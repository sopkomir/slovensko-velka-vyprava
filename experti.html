     model:lv===2?'1) Bývanie pre mladé rodiny – cieľ: udržať a prilákať mladých; nástroj: obecné nájomné byty a pozemky; účinok: vyšší podiel 25 – 39-ročných; riziko: bez pracovných príležitostí odídu. 2) Služby pre seniorov a komunitná starostlivosť – cieľ: dôstojné starnutie doma; nástroj: denné centrá, terénna opatrovateľská služba; účinok: nižšie náklady na ústavnú starostlivosť, nové pracovné miesta; riziko: nedostatok personálu. 3) Dostupnosť práce – cieľ: znížiť odchod za prácou; nástroj: lepšie spoje do krajského mesta, coworking, podpora miestnych firiem; účinok: dochádzka namiesto odsťahovania; riziko: závislosť od jedného zamestnávateľa.':'Príčiny: 1) rozdielna plodnosť – vyššia na severe a východe (napr. okresy Kežmarok, Sabinov), aj vplyvom rómskych komunít; 2) selektívna migrácia – mladí odchádzajú z periférnych regiónov (napr. južné okresy stredného Slovenska) do Bratislavy a krajských miest, zostávajú starší; 3) suburbanizácia – mladé rodiny sa sťahujú do zázemia miest (okolie Bratislavy omladzuje), kým staré sídliská v centrách miest starnú; 4) historický vývoj – silné ročníky zo 70. rokov žijú najmä v mestách postavených v čase industrializácie.',
     rubric:lv===2?['Každé opatrenie má cieľ a konkrétny nástroj.','Uviedol/a som očakávaný účinok.','Pomenoval/a som riziko.','Opatrenia na seba nadväzujú a vychádzajú z dát.']:['Uviedol/a som aspoň tri príčiny.','Každá príčina má príklad regiónu.','Prepojil/a som príčinu s dôsledkom vo vekovej štruktúre.','Použil/a som odborné pojmy.']})]),
 sheet:lv=>sheetHead('Dynamika a štruktúra obyvateľstva',lv)+`<p><b>1.</b> Údaje môjho okresu (DATAcube): narodení ____ zomretí ____ prisťahovaní ____ vysťahovaní ____ obyvatelia ____</p><p>Natalita ____ ‰ · mortalita ____ ‰ · PP ____ ‰ · migračné saldo ____ ‰ · celkový prírastok ____ ‰</p>
  <p><b>2.</b> Nakresli vekovú pyramídu okresu (5-ročné skupiny):</p>${grid(170)}<p><b>3.</b> Tvoja analýza / návrh:</p>${savedAns('demo')}`},

sid:{icon:'🏙️',badge:'Urbanista',
 question:'Ako je usporiadaná sídelná sústava Slovenska a ako ju menia urbanizačné procesy?',
 cp:'Sídla Slovenska, sídelná sústava, urbanizácia a suburbanizácia; funkcie miest; porovnanie sídiel podľa štatistických údajov.',
 text:[
  {h:'Sídelná sústava',p:`Slovensko má takmer 2 900 obcí, z toho asi 140 miest; približne dve tretiny obcí majú menej ako 1 000 obyvateľov – sídelná štruktúra je výrazne rozdrobená. ${g('sidhier','Sídelnú hierarchiu')} tvorí hlavné mesto Bratislava, krajské mestá (Košice a ďalšie s 55 – 90 tis. obyvateľmi), okresné centrá a vidiecke obce. Bratislava je ${g('primat','primátnym mestom')} – koncentruje vládne inštitúcie, centrály firiem, univerzity a väčšinu zahraničných investícií.`},
  {h:'Poradie a veľkosť',p:`Podľa ${g('rank','pravidla poradia a veľkosti')} by druhé mesto malo mať polovicu obyvateľov prvého – Košice (asi 229 tis.) tomu zhruba zodpovedajú. Tretie až ôsme mesto (Prešov, Žilina, Nitra, Banská Bystrica, Trnava, Trenčín) sú však výrazne menšie, než by pravidlo predpovedalo – sieť stredne veľkých miest je pomerne vyrovnaná a chýba „tretie veľkomesto“.`},
  {h:'Fázy urbanizácie',p:`Prudká urbanizácia prebiehala v rokoch 1950 – 1990 spolu s industrializáciou: rast miest, výstavba sídlisk (Petržalka, Košice-Sídlisko KVP a Dargovských hrdinov, Prešov-Sekčov). Po roku 1990 nastupuje ${g('urbfazy','suburbanizácia')} – rast obcí v zázemí miest, najvýraznejší okolo Bratislavy, Košíc, Prešova, Žiliny a Nitry. V niektorých mestách sa objavujú znaky reurbanizácie (obnova centier, nová bytová výstavba na brownfieldoch).`},
  {h:'Funkčné mestské regióny',p:`Mestá dnes chápeme spolu so zázemím ako ${g('fmr','funkčné mestské regióny')} – vymedzené dochádzkou za prácou a službami. Zázemie Bratislavy siaha aj za hranice štátu (rakúske a maďarské obce, kam sa sťahujú obyvatelia Bratislavy). Riadenie takých regiónov vyžaduje spoluprácu viacerých samospráv (doprava, územné plánovanie, školy).`},
  {h:'Pre maturantov: hodnotenie suburbanizácie',lv:2,p:`Suburbanizácia prináša bývanie v rodinných domoch a rast daňových príjmov obcí, ale aj rozptýlenú zástavbu na úrodnej pôde, závislosť od auta, preťažené cesty a deficit občianskej vybavenosti. Hodnotenie závisí od kritérií (ekonomické, sociálne, environmentálne) a od mierky – čo je výhodné pre domácnosť, môže byť nevýhodné pre región.`}],
 fact:'Petržalka mala v čase najväčšieho rozmachu vyše 130 tisíc obyvateľov – bola by tak treťou najväčšou „samostatnou“ obcou na Slovensku po Bratislave a Košiciach.',
 trip:'Vymedz funkčný mestský región najbližšieho krajského mesta: v údajoch zo sčítania 2021 nájdi dochádzku do práce z okolitých obcí a zakresli hranicu regiónu.',
 check:{1:['[2] Charakterizujem sídelnú štruktúru a hierarchiu Slovenska.','[3] Aplikujem pravidlo poradia a veľkosti.','[2] Vysvetlím fázy urbanizácie na príkladoch.','[4] Analyzujem funkčný mestský región.'],2:['[5] Zhodnotím suburbanizáciu podľa viacerých kritérií.','[6] Navrhnem princípy územného rozvoja suburbánnej obce.']},
 teacher:{ciele:['charakterizovať sídelnú sústavu a hierarchiu','aplikovať pravidlo poradia a veľkosti','vysvetliť fázy urbanizácie a funkčné mestské regióny','zhodnotiť suburbanizáciu (Maturita)'],
  svp:'Cieľové požiadavky na maturitu – sídla Slovenska, urbanizácia; porovnávanie oblastí podľa štatistických údajov.',
  tipy:['Počty obyvateľov miest v grafe sú zaokrúhlené podľa SODB 2021.','Dochádzka zo sčítania 2021 je výborný zdroj na vymedzenie funkčných regiónov (portál scitanie.sk).','Petržalka – historické maximum je zaokrúhlené.']},
 quiz:{1:[
  {q:bl(3)+'Podľa pravidla poradia a veľkosti by štvrté najväčšie mesto malo mať pri Bratislave s 475 tis. obyvateľmi asi…',o:[{t:'119 tis.',ok:1},{t:'82 tis.'},{t:'237 tis.'}],e:'475 ÷ 4 ≈ 119 tis.; skutočná Žilina má asi 82 tis.'},
  {q:bl(2)+'Čo je suburbanizácia?',o:[{t:'rast zázemia miest sťahovaním obyvateľov a funkcií',ok:1},{t:'rast centier miest'},{t:'zánik vidieka'}]},
  {q:bl(1)+'Približne koľko miest má Slovensko?',o:[{t:'140',ok:1},{t:'14'},{t:'2 900'}]},
  {q:bl(4)+'Prečo je Bratislava primátnym mestom?',o:[{t:'koncentruje inštitúcie, firmy a investície a výrazne prevyšuje ostatné mestá',ok:1},{t:'je najstaršia'},{t:'leží najvyššie'}]},
  {q:bl(2)+'Čím je vymedzený funkčný mestský región?',o:[{t:'dochádzkou do práce a za službami',ok:1},{t:'hranicou okresu'},{t:'nadmorskou výškou'}]}],
  2:[
  {q:bl(4)+'Čo z grafu poradia a veľkosti vyplýva o sieti miest Slovenska?',o:[{t:'chýba „tretie veľkomesto“, stredné mestá sú menšie ako predikcia',ok:1},{t:'všetky mestá presne zodpovedajú pravidlu'},{t:'Košice sú väčšie ako Bratislava'}]},
  {q:bl(5)+'Ktorý argument je environmentálny pri hodnotení suburbanizácie?',o:[{t:'záber úrodnej pôdy a nárast individuálnej dopravy',ok:1},{t:'rast daňových príjmov obcí'},{t:'nedostatok miest v škôlkach'}]},
  {q:bl(2)+'Ktorá fáza nasleduje po suburbanizácii v modeli fáz urbanizácie?',o:[{t:'dezurbanizácia',ok:1},{t:'urbanizácia'},{t:'industrializácia'}]},
  {q:bl(4)+'Prečo siaha zázemie Bratislavy aj do Rakúska a Maďarska?',o:[{t:'lacnejšie bývanie a otvorené hranice v schengenskom priestore',ok:1},{t:'Bratislava tam má mestské časti'},{t:'je tam viac pracovných miest pre Bratislavčanov'}]},
  {q:bl(6)+'Ktorý princíp je pre suburbánnu obec najlepší pri tvorbe územného plánu?',o:[{t:'rozvoj podmieniť kapacitou škôl, vody, kanalizácie a dopravy',ok:1},{t:'povoliť výstavbu všade'},{t:'zakázať akúkoľvek výstavbu'}]}]},
 act:(el,lv)=>runParts(el,[
   dynRounds([
    {t:bl(4)+'Analyzuj graf. Ktoré mesto sa najviac blíži predikcii pravidla 1/n?',img:()=>rankSize(),o:[{t:'Košice',ok:1},{t:'Prešov'},{t:'Trnava'}]},
    {t:bl(3)+'Modelová obec v zázemí: 1991 – 1 500, 2021 – 7 800 obyvateľov. O koľko percent narástla?',o:[{t:'o 420 %',ok:1},{t:'o 52 %'},{t:'o 5,2 %'}],why:'(7 800 − 1 500) ÷ 1 500 × 100 = 420 %.'}]),
   dynSort({t:bl(2)+'Ktorú fázu urbanizácie ilustruje situácia?',bins:[['u','urbanizácia','🏗️'],['s','suburbanizácia','🏡'],['r','reurbanizácia','🔄']],items:[['🏢','výstavba sídliska Petržalka v 70. a 80. rokoch','u'],['🏭','príchod ľudí z vidieka za prácou v továrňach','u'],['🏡','nové štvrte rodinných domov za hranicou mesta','s'],['🚗','rastúca dochádzka autom do centra','s'],['🏙️','byty na mieste bývalej továrne v centre','r'],['☕','návrat mladých do zrekonštruovaného centra','r']]})],'Sídelnú sústavu analyzuješ ako urbanista!'),
 argue:(el,lv)=>runArgue(el,[
   evidence({b:5,claim:'Suburbanizácia okolo Bratislavy je pre región prínosom.',items:[['🏡','Rodiny získali dostupnejšie bývanie v rodinných domoch.','p'],['💶','Obce v zázemí majú vyššie daňové príjmy.','p'],['🚗','Ranné kolóny pri vstupe do mesta sa predĺžili.','v'],['🌾','Zastavala sa veľká časť najúrodnejšej pôdy.','v'],['🏫','V niektorých obciach chýbajú miesta v škôlkach a školách.','v'],['🏔️','V Tatrách napadol sneh.','n']]}),
   openTask({b:lv===2?6:5,key:'suburb',t:lv===2?'Navrhni 4 princípy územného rozvoja pre rýchlo rastúcu obec v zázemí mesta. Každý zdôvodni z ekonomického, sociálneho alebo environmentálneho hľadiska.':'Zhodnoť suburbanizáciu okolo Bratislavy: uveď výhody a nevýhody z ekonomického, sociálneho a environmentálneho hľadiska a sformuluj záver.',
     model:lv===2?'1) Rast podmieniť infraštruktúrou – nová zóna až po zabezpečení vody, kanalizácie, škôl (sociálne, ekonomické). 2) Kompaktná zástavba pri zastávkach verejnej dopravy, nie rozptýlená po poliach (environmentálne – menej áut, menší záber pôdy). 3) Zmiešané funkcie – v obci aj obchody, služby, pracovné miesta (sociálne – kratšie cesty, živšia obec). 4) Spolupráca s mestom a susednými obcami na doprave a školách (ekonomické – efektívnejšie investície).':'Ekonomicky: + rast daňových príjmov obcí, stavebníctvo; − náklady na novú infraštruktúru. Sociálne: + dostupnejšie bývanie pre rodiny; − nedostatok škôl a služieb, oslabenie väzieb v pôvodnej komunite. Environmentálne: − záber úrodnej pôdy, rast automobilovej dopravy a emisií. Záver: suburbanizácia uspokojuje dopyt po bývaní, ale bez územného plánovania a investícií do verejnej dopravy prevažujú negatívne dôsledky pre región.',
     rubric:['Pokryl/a som všetky tri hľadiská.','Uviedol/a som konkrétne príklady.','Argumenty sú vyvážené (výhody aj nevýhody / zdôvodnenie).','Záver vyplýva z argumentov.']})]),
 sheet:lv=>sheetHead('Sídelná sústava a urbanizácia',lv)+`<p><b>1.</b> Pravidlo poradia a veľkosti – doplň predikciu (475 ÷ n) a rozdiel:</p><table style="width:100%;border-collapse:collapse;font-size:13px"><tr>${['poradie','mesto','skutočnosť (tis.)','predikcia (tis.)','rozdiel'].map(h=>`<th style="border:1px solid #111;padding:4px">${h}</th>`).join('')}</tr>${RANKD.map(([n,v],i)=>`<tr><td style="border:1px solid #111;padding:4px;text-align:center">${i+1}</td><td style="border:1px solid #111;padding:4px">${n}</td><td style="border:1px solid #111;text-align:center">${v}</td><td style="border:1px solid #111"></td><td style="border:1px solid #111"></td></tr>`).join('')}</table>
  <p><b>2.</b> Hodnotenie / návrh:</p>${savedAns('suburb')}`},

hosp:{icon:'🏭',badge:'Ekonomický geograf',
 question:'Ako sa hospodárstvo Slovenska transformovalo a aké má dnes silné a slabé stránky?',
 cp:'Hospodárstvo Slovenska – primárny, sekundárny a terciárny sektor; priemysel, poľnohospodárstvo, doprava, cestovný ruch; zastúpenie nerastných surovín a energetika.',
 text:[
  {h:'Transformácia po roku 1989',p:`${g('transform','Ekonomická transformácia')} znamenala privatizáciu, útlm ťažkého a zbrojárskeho priemyslu, rast nezamestnanosti v 90. rokoch a postupné otvorenie trhu. Po roku 2000 prišla vlna ${g('pzi','priamych zahraničných investícií')} – najmä do automobilového a elektrotechnického priemyslu, podporená investičnými stimulmi, kvalifikovanou a relatívne lacnou pracovnou silou, polohou a vstupom do EÚ (2004) a eurozóny (2009).`},
  {h:'Štruktúra hospodárstva',p:`Slovensko je malá ${g('otvor','otvorená ekonomika')} – hodnota exportu sa blíži k hodnote HDP, hlavnými partnermi sú Nemecko, Česko, Poľsko, Maďarsko a Francúzsko. Priemysel má v porovnaní s priemerom EÚ nadpriemerný podiel; dominuje automobilový priemysel (štyri automobilky a stovky dodávateľov), ďalej hutníctvo, strojárstvo, elektrotechnika, chémia a papier. Najviac ľudí však pracuje v službách. Poľnohospodárstvo zamestnáva len niekoľko percent pracujúcich.`},
  {h:'Energetika a suroviny',p:`Slovensko dováža takmer všetku ropu a zemný plyn, no elektrinu vyrába prevažne doma: jadrové elektrárne Mochovce a Jaslovské Bohunice dávajú viac ako polovicu výroby, ďalej vodné elektrárne (Gabčíkovo, Vážska kaskáda), plyn a obnoviteľné zdroje. Ťažba hnedého uhlia na Hornej Nitre skončila v roku 2023 a región prechádza transformáciou.`},
  {h:'Doprava a cestovný ruch',p:`Územím prechádzajú tri ${g('tent','koridory TEN-T')}; kľúčová je os Bratislava – Žilina – Košice (D1, železnica) a Bratislava ako uzol na Dunaji. Hornatý reliéf predražuje výstavbu (tunely, estakády), preto sa diaľničné spojenie na východ budovalo postupne. Cestovný ruch sa sústreďuje do Bratislavy, Vysokých Tatier a Liptova; potenciál majú kúpele, termálne vody a pamiatky UNESCO.`},
  {h:'Pre maturantov: zraniteľnosť a odolnosť',lv:2,p:`Vysoká koncentrácia na automobilový priemysel a export robí ekonomiku citlivou na výkyvy v Európe a na technologické zmeny (prechod na elektromobilitu). Rast odolnosti vyžaduje diverzifikáciu (IT, výskum, služby s vyššou pridanou hodnotou), investície do vzdelávania a inovácií a energetickú bezpečnosť (diverzifikácia dodávok plynu a ropy).`}],
 fact:'Slovensko je dlhodobo najväčším výrobcom osobných automobilov na počet obyvateľov na svete – vyrobí takmer milión áut ročne.',
 trip:'Zisti päť najväčších zamestnávateľov svojho kraja (register, správy VÚC). Do ktorého sektora a odvetvia patria a odkiaľ pochádza ich kapitál?',
 check:{1:['[2] Vysvetlím ekonomickú transformáciu po roku 1989.','[2] Charakterizujem štruktúru hospodárstva podľa sektorov.','[4] Analyzujem lokalizačné faktory automobilového priemyslu.','[3] Opíšem energetický mix a dopravné koridory.'],2:['[5] Zhodnotím zraniteľnosť otvorenej ekonomiky.','[6] Navrhnem stratégiu diverzifikácie hospodárstva regiónu.']},

  svp:'Cieľové požiadavky na maturitu – hospodárstvo Slovenska (sektory, priemysel, poľnohospodárstvo, doprava, cestovný ruch), nerastné suroviny a energetika.',
  tipy:['Údaje o exporte a sektoroch sa každý rok menia – aktuálne: ŠÚ SR, NBS, Eurostat.','Údaje o firmách (vlastníci, investície) si pred hodinou overte.','Prepojenie s ekonómiou a občianskou náukou (stimuly, eurozóna).']},
 quiz:{1:[
  {q:bl(2)+'Čo bolo hlavným motorom rastu priemyslu po roku 2000?',o:[{t:'priame zahraničné investície, najmä v automobilovom priemysle',ok:1},{t:'ťažba uhlia'},{t:'textilný priemysel'}]},
  {q:bl(1)+'Ktorý zdroj vyrába viac ako polovicu elektriny na Slovensku?',o:[{t:'jadrové elektrárne',ok:1},{t:'uhoľné elektrárne'},{t:'veterné elektrárne'}]},
  {q:bl(2)+'Čo znamená, že Slovensko je otvorená ekonomika?',o:[{t:'vysoký podiel exportu a importu na HDP',ok:1},{t:'nemá colnice'},{t:'všetky firmy sú štátne'}]},
  {q:bl(4)+'Ktorá kombinácia lokalizačných faktorov prilákala automobilky na západ Slovenska?',o:[{t:'poloha pri trhoch EÚ, diaľnica D1, kvalifikovaná pracovná sila, stimuly',ok:1},{t:'zásoby ropy a mora'},{t:'najvyššie hory'}]},
  {q:bl(1)+'V ktorom roku skončila ťažba uhlia na Hornej Nitre?',o:[{t:'2023',ok:1},{t:'1993'},{t:'2004'}]}],
  2:[
  {q:bl(5)+'Prečo je vysoký podiel automobilového priemyslu rizikom?',o:[{t:'výkyvy dopytu a technologické zmeny zasiahnu veľkú časť ekonomiky',ok:1},{t:'autá sa nedajú vyvážať'},{t:'nie je to riziko'}]},
  {q:bl(4)+'Ktorý faktor najviac predražuje dopravné prepojenie západ – východ?',o:[{t:'hornatý reliéf (tunely, estakády)',ok:1},{t:'nedostatok riek'},{t:'veľký počet letísk'}]},
  {q:bl(6)+'Ktorá stratégia najlepšie zvyšuje odolnosť ekonomiky?',o:[{t:'diverzifikácia do odvetví s vyššou pridanou hodnotou a investície do vzdelávania',ok:1},{t:'zameranie na jedno odvetvie'},{t:'obmedzenie exportu'}]},
  {q:bl(2)+'Koľko koridorov TEN-T prechádza Slovenskom?',o:[{t:'tri',ok:1},{t:'jeden'},{t:'šesť'}]},

 cp:'Práca s mapou, grafmi, tabuľkami a textom; porovnávanie oblastí podľa štatistických údajov; analýza klimatických diagramov; vyvodzovanie záverov.',
 text:[
  {h:'Postup analýzy prameňa',p:`Pri každom ${g('pramen','geografickom prameni')} postupuj v piatich krokoch: <b>1. Identifikuj</b> – typ prameňa, autor/zdroj, územie, čas, mierka a jednotky. <b>2. Opíš</b> – čo prameň ukazuje: hodnoty, maximá a minimá, trend, priestorový vzorec. <b>3. Vysvetli</b> – príčiny vzorca pomocou geografických poznatkov. <b>4. Porovnaj a prepoj</b> – s inými prameňmi a regiónmi. <b>5. Zhodnoť</b> – ${g('spolahl','spoľahlivosť')}, obmedzenia (zaokrúhlenie, priemer, chýbajúce údaje) a sformuluj záver.`},
  {h:'Typické chyby',p:`Opis bez vysvetlenia („hodnota je 12 %“ – ale prečo?), vysvetlenie bez dát (všeobecné frázy), zamieňanie korelácie a príčiny, prehliadanie jednotiek a mierky, zovšeobecňovanie z jedného údaja. Dobrá odpoveď vždy obsahuje <b>konkrétny údaj z prameňa + geografické vysvetlenie + záver</b>.`},
  {h:'Slovesá úloh a úroveň náročnosti',p:`Slovesá prezrádzajú, čo sa od teba čaká: <i>uveď, pomenuj</i> (zapamätať), <i>vysvetli, opíš</i> (porozumieť), <i>vypočítaj, urč</i> (aplikovať), <i>porovnaj, analyzuj</i> (analyzovať), <i>zhodnoť, posúď, zdôvodni</i> (hodnotiť), <i>navrhni, vytvor</i> (tvoriť). Na vyššie slovesá nestačí reprodukcia – treba argumentovať.`},
  {h:'Pre maturantov: kombinácia prameňov',lv:2,p:`Najnáročnejšie úlohy kombinujú viac prameňov (napr. mapu hustoty, tabuľku nezamestnanosti a text o suburbanizácii). Hľadaj súvislosti medzi nimi, všímaj si protirečenia a vysvetli ich (iné roky, iná mierka, iný zdroj). Záver formuluj opatrne – na úrovni, ktorú pramene naozaj podporujú.`}],
 fact:'Rovnaké údaje môžu na mape vyzerať úplne inak podľa zvolených intervalov stupnice – preto pri analýze tematickej mapy vždy čítaj legendu a pýtaj sa, kto a prečo zvolil práve tieto triedy.',
 trip:'Nájdi na webe ŠÚ SR alebo SHMÚ jeden graf alebo mapu o tvojom regióne a analyzuj ho podľa piatich krokov. Výsledok prines na hodinu.',
 check:{1:['[1] Viem identifikovať typ, zdroj a mierku prameňa.','[2] Opíšem vzorec a trend v prameni s konkrétnymi údajmi.','[4] Vysvetlím príčiny vzorca geografickými poznatkami.','[5] Posúdim spoľahlivosť a obmedzenia prameňa.'],2:['[4] Prepojím viac prameňov a vysvetlím rozdiely medzi nimi.','[5] Sformulujem záver primeraný dôkazom.']},
 teacher:{ciele:['systematicky analyzovať mapy, grafy, tabuľky a texty','prepájať údaje s geografickým vysvetlením','hodnotiť spoľahlivosť a obmedzenia prameňov','formulovať zdôvodnené závery (Maturita)'],
  svp:'Cieľové požiadavky na maturitu – všeobecné požiadavky: úlohy na prácu s mapou, so štatistickými údajmi, s grafmi; porovnávať oblasti podľa štatistických údajov; analyzovať klimatické diagramy.',
  tipy:['Tabuľka a text v tejto téme sú modelové – zámerne, aby sa dali použiť na nácvik bez viazanosti na rok.','Vhodné ako opakovanie pred maturitou: žiaci si vymieňajú pramene a hodnotia odpovede podľa kritérií vo dvojiciach.','Odpovede z otvorených úloh sa ukladajú a tlačia v pracovnom liste – môžu slúžiť ako portfólio.']},
 quiz:{1:[
  {q:bl(1)+'Čo urobíš ako prvé pri analýze tematickej mapy?',o:[{t:'prečítam názov, legendu, mierku a zdroj',ok:1},{t:'hneď vyslovím záver'},{t:'spočítam farby'}]},
  ()=>({q:bl(2)+'Ktorá odpoveď je opisom, nie vysvetlením?',o:[{t:`Nezamestnanosť v okrese ${LT.p} je ${SV.p[0]} %.`,ok:1},{t:'Nezamestnanosť je vyššia, lebo okres je vzdialený od diaľnice a trhov.'},{t:'Okres stráca mladých, preto starne.'}]}),
  ()=>({q:bl(4)+`Okres ${LT.s} má kladné migračné saldo a nízky priemerný vek. Čo z toho pravdepodobne vyplýva?`,o:[{t:'prisťahúvajú sa mladšie rodiny – typické pre zázemie mesta',ok:1},{t:'okres sa vyľudňuje'},{t:'okres má najvyššiu nezamestnanosť'}]}),
  ()=>({q:bl(5)+`Prečo je záver „okres ${LT.p} je chudobný, lebo ľudia nechcú pracovať“ chybný?`,o:[{t:'zamieňa koreláciu za príčinu a nezohľadňuje ponuku práce ani dostupnosť',ok:1},{t:'je správny'},{t:'lebo údaje sú v percentách'}]}),
  {q:bl(2)+'Ktoré sloveso vyžaduje hodnotenie?',o:[{t:'posúď',ok:1},{t:'uveď'},{t:'vypočítaj'}]}],
  2:[
  {q:bl(5)+'Mapa hustoty a tabuľka nezamestnanosti sú z rôznych rokov. Ako s tým naložíš?',o:[{t:'uvediem to ako obmedzenie a záver formulujem opatrne',ok:1},{t:'ignorujem to'},{t:'pramene nemožno použiť vôbec'}]},
  ()=>({q:bl(4)+'Ktorý záver najlepšie spája modelový text a tabuľku?',o:[{t:`okres ${LT.s} je typický suburbánny región – rast obyvateľov, mladšia štruktúra, tlak na služby`,ok:1},{t:`okres ${LT.s} sa vyľudňuje`},{t:`okres ${LT.h} má najviac prisťahovaných`}]}),
  {q:bl(5)+'Prečo môže voľba intervalov v legende zmeniť dojem z mapy?',o:[{t:'rovnaké údaje sa zatriedia inak a zvýraznia iné rozdiely',ok:1},{t:'lebo mení údaje'},{t:'nemôže'}]},
  {q:bl(4)+'Klimatický diagram stanice má júlovú teplotu 19 °C a 50 letných dní ročne. Kam ju zaradíš?',o:[{t:'teplá oblasť (aspoň 50 letných dní)',ok:1},{t:'chladná oblasť'},{t:'mierne teplá oblasť'}]},
  {q:bl(6)+'Ktorá štruktúra odpovede je pre úlohu „zhodnoť“ najvhodnejšia?',o:[{t:'tvrdenie – dôkaz z prameňa – vysvetlenie – protiargument – záver',ok:1},{t:'len vymenovanie faktov'},{t:'len vlastný názor'}]}]},
 act:(el,lv)=>runParts(el,[
   orderCards({t:bl(2)+'Zoraď kroky analýzy prameňa.',cards:[['🔎','identifikuj'],['📝','opíš'],['💡','vysvetli'],['🔗','porovnaj a prepoj'],['⚖️','zhodnoť a uzavri']],done:'Identifikuj → opíš → vysvetli → prepoj → zhodnoť.'}),
   dynRounds([
    {t:bl(4)+'Prameň 1 – tabuľka. Ktorý okres má znaky periférie?',img:()=>srcTable(),o:[{t:`okres ${LT.p} – vysoká nezamestnanosť, odchod obyvateľov, starnutie`,ok:1},{t:`okres ${LT.s}`},{t:`okres ${LT.h}`}]},
    {t:bl(4)+'Prameň 2 – mapa hustoty krajov. Aký priestorový vzorec vidíš?',img:()=>densityMap(),o:[{t:'najvyššia hustota na západe (Bratislavský kraj), najnižšia v hornatom Banskobystrickom kraji',ok:1},{t:'hustota rastie od západu na východ'},{t:'všetky kraje majú rovnakú hustotu'}]},
    {t:bl(4)+'Prameň 3 – klimatické diagramy. Ktorý údaj najlepšie dokladá vplyv nadmorskej výšky?',img:()=>`<div class="twin">${climDiag(HUR,'Hurbanovo – približne')}${climDiag(LOM,'Lomnický štít – približne')}</div>`,o:[{t:'rozdiel júlových teplôt asi 14 °C a vyššie zrážky na štíte',ok:1},{t:'rovnaký tvar teplotnej krivky'},{t:'počet mesiacov v roku'}]}]),
   dynSort({t:bl(4)+'Je výrok opis, vysvetlenie, alebo hodnotenie?',bins:[['o','opis','📝'],['v','vysvetlenie','💡'],['h','hodnotenie','⚖️']],items:[['📊',`Okres ${LT.s} má najnižší priemerný vek – ${SV.s[2]} roka.`,'o'],['🏡','Mladé rodiny sa sťahujú do zázemia pre dostupnejšie bývanie.','v'],['⚖️','Údaje sú modelové, preto záver platí len ako ilustrácia.','h'],['📈','Hustota je najvyššia v Bratislavskom kraji.','o'],['⛰️','Nízka hustota súvisí s hornatým reliéfom a lesmi.','v'],['🔎','Pre spoľahlivý záver by bolo treba údaje za viac rokov.','h']]})],'Pramene analyzuješ ako maturant na jednotku!'),
 argue:(el,lv)=>runArgue(el,[
   openTask({b:4,key:'pr1',t:'Analyzuj modelový text a tabuľku spolu: aký proces opisujú, ktoré údaje to dokladajú a aké sú dôsledky pre obce?',img:()=>`<blockquote class="src">${SRC_TEXT}</blockquote>${srcTable()}`,
     model:'Pramene opisujú suburbanizáciu: text uvádza rast počtu domov a obyvateľov v zázemí a úbytok obyvateľov mesta; tabuľka to dopĺňa – okres ${LT.s} (zázemie) má kladné migračné saldo ${SV.s[1]} ‰ a najnižší priemerný vek ${SV.s[2]} roka, čo zodpovedá prisťahovaniu mladých rodín. Dôsledky: tlak na materské školy a dopravu (zápchy), potreba investícií do infraštruktúry, kým jadrové mesto stráca daňovníkov. Obmedzenie: ide o modelové údaje bez časového radu.',
     rubric:['Pomenoval/a som proces (suburbanizácia).','Citoval/a som aspoň dva konkrétne údaje z prameňov.','Vysvetlil/a som dôsledky pre obce.','Uviedol/a som obmedzenie prameňov.']}),
   openTask({b:5,key:'pr2',t:`Zhodnoť, či okres ${LT.p} môžeme označiť za „zaostávajúci región“. Použi údaje z tabuľky, aspoň jeden protiargument a sformuluj záver primeraný dôkazom.`,img:()=>srcTable(),
     model:`Argumenty pre: najvyššia nezamestnanosť (${SV.p[0]} %), záporné migračné saldo (${SV.p[1]} ‰) a najvyšší priemerný vek (${SV.p[2]} roka) – kombinácia typická pre perifériu podľa modelu jadro – periféria. Protiargument/obmedzenie: tri ukazovatele nezachytávajú príjmy, vzdelanie, dostupnosť služieb ani vývoj v čase; údaje sú modelové. Záver: na základe dostupných údajov má okres ${LT.p} výrazné znaky zaostávajúceho regiónu, pre spoľahlivé hodnotenie by bolo treba ďalšie ukazovatele a časový rad.`,
     rubric:['Použil/a som aspoň tri údaje.','Uviedol/a som protiargument alebo obmedzenie.','Prepojil/a som údaje s pojmom (periféria, disparity).','Záver je opatrný a primeraný dôkazom.']}),
   ...(lv===2?[openTask({b:6,key:'pr3',t:'Navrhni vlastnú tematickú mapu, ktorá by najlepšie ukázala rozdiely medzi okresmi A, B a C: aký ukazovateľ, aký typ mapy, aké intervaly legendy a prečo.',
     model:'Ukazovateľ: kompozitný index (napr. priemer štandardizovaných hodnôt nezamestnanosti, migračného salda a priemerného veku) alebo samostatne migračné saldo ako najcitlivejší indikátor zmeny. Typ mapy: kartogram (choropletová mapa) pre relatívne ukazovatele; absolútne počty by sa zobrazili kartodiagramom (kruhy). Intervaly: 4 – 5 tried s prirodzenými zlommi alebo kvantilmi, divergentná farebná škála (záporné saldo teplé farby, kladné studené) s nulou v strede. Zdôvodnenie: relatívne ukazovatele sa nesmú zobrazovať absolútnymi kruhmi, divergentná škála jasne odlíši rast a úbytok.',
     rubric:['Zvolil/a som vhodný ukazovateľ a zdôvodnil/a ho.','Určil/a som typ mapy (kartogram/kartodiagram) správne.','Navrhol/navrhla som intervaly a farebnú škálu.','Zohľadnil/a som, ako voľba ovplyvní interpretáciu.']})]:[])]),
 sheet:lv=>sheetHead('Analýza prameňov',lv)+`<blockquote class="src">${SRC_TEXT}</blockquote>${srcTable()}<p><b>1.</b> Analýza (5 krokov):</p>${savedAns('pr1')}<p><b>2.</b> Hodnotenie okresu ${LT.p}:</p>${savedAns('pr2')}${lv===2?'<p><b>3.</b> Návrh tematickej mapy:</p>'+savedAns('pr3'):''}`},

mt2:{icon:'🗂️',badge:'Maturant',
 question:'Ako vytvoriť komplexnú charakteristiku regiónu, ktorá prepája prírodné a humánne javy do súvislostí?',
 cp:'Komplexná geografická charakteristika regiónov Slovenska; prepájanie fyzickogeografickej a humánnogeografickej sféry; zaradenie miestnej krajiny; úlohy na projektovanie a hodnotenie.',
 text:[
  {h:'Štruktúra odpovede',p:`${g('komplex','Komplexná charakteristika regiónu')} má päť častí: <b>1. Poloha a vymedzenie</b> (geomorfologické a administratívne zaradenie, susedné regióny). <b>2. Prírodné pomery</b> (reliéf a geológia, klíma, vody, pôdy, bióta, ochrana). <b>3. Obyvateľstvo a sídla</b> (počet, hustota, štruktúra, centrá, urbanizácia). <b>4. Hospodárstvo a doprava</b> (sektory, odvetvia, cestovný ruch, koridory). <b>5. Problémy a perspektívy</b> (environmentálne a sociálne problémy, rozvojové príležitosti).`},
  {h:'Kľúč: súvislosti, nie zoznam',p:`Najvyššie hodnotená odpoveď nie je zoznam faktov, ale reťaz ${g('kauz','kauzálnych väzieb')}: napr. <i>kotlina medzi pohoriami → inverzie v zime → zhoršená kvalita ovzdušia pri lokálnom vykurovaní</i>, alebo <i>úrodné černozeme a teplá klíma → intenzívne poľnohospodárstvo → riziko veternej erózie</i>. Pri každej časti sa pýtaj „prečo?“ a „s akým dôsledkom?“.`},
  {h:'Príklad osnovy – Liptov',p:`Liptovská kotlina medzi Západnými Tatrami a Nízkymi Tatrami (Fatransko-tatranská oblasť), Žilinský kraj. Mierne teplá až chladná oblasť s inverziami, Váh a vodná nádrž Liptovská Mara, kambizeme a fluvizeme, susedstvo dvoch národných parkov. Centrá Liptovský Mikuláš a Ružomberok, koridor D1 a hlavnej železnice. Hospodárstvo: papierenský priemysel (Ružomberok), cestovný ruch (Jasná, aquaparky s termálnou vodou, jaskyne). Problémy a perspektívy: tlak cestovného ruchu na prírodu, lesné kalamity, kvalita ovzdušia pri inverziách; príležitosť v celoročnom udržateľnom turizme.`},
  {h:'Ústna odpoveď na maturite',p:`Na prípravu máš obmedzený čas – píš <b>heslovitú osnovu</b> podľa piatich častí a ku každej si poznač jeden konkrétny údaj a jednu väzbu príčina – dôsledok. Pri odpovedi pracuj s mapou (ukazuj), hovor v celých vetách, používaj pojmy a na záver zhodnoť región.`},
  {h:'Pre maturantov: porovnávacia charakteristika',lv:2,p:`Najnáročnejšia forma je porovnanie dvoch regiónov (napr. Liptov a Podunajská nížina). Porovnávaj podľa rovnakých kritérií v rovnakom poradí, vysvetľuj rozdiely príčinami (reliéf, klíma, poloha, história) a na záver posúď, ktorý región má lepšie predpoklady pre konkrétny typ rozvoja – a prečo.`}],
 fact:'Liptovská Mara je objemom vody najväčšou vodnou nádržou na Slovensku – pri jej napustení v 70. rokoch zmizlo pod hladinou viacero obcí.',
 trip:'Vypracuj komplexnú charakteristiku regiónu, v ktorom žiješ, podľa piatich častí. Pridaj mapu s vyznačenými kľúčovými prvkami a prezentuj ju triede ako ústnu maturitnú odpoveď.',
 check:{1:['[2] Poznám päťčlennú štruktúru komplexnej charakteristiky.','[4] Dokážem vytvoriť kauzálne väzby medzi zložkami krajiny.','[3] Aplikujem štruktúru na konkrétny región.','[5] Zhodnotím problémy a perspektívy regiónu.'],2:['[6] Vytvorím komplexnú charakteristiku miestneho regiónu.','[5] Porovnám dva regióny podľa jednotných kritérií.']},
 teacher:{ciele:['vytvoriť štruktúrovanú komplexnú charakteristiku regiónu','prepájať zložky krajiny do kauzálnych väzieb','zhodnotiť problémy a perspektívy regiónu','porovnať dva regióny (Maturita)'],
  svp:'Cieľové požiadavky na maturitu – geografia Slovenskej republiky: komplexné hodnotenie regiónov; všeobecné požiadavky: úlohy na schopnosť projektovať prácu, prácu s mapou a hodnotenie.',
  tipy:['Časovač v kroku Argumentácia simuluje prípravu na ústnu odpoveď – dĺžku si prispôsobte podľa školských pravidiel maturity.','Osnovy žiakov sa ukladajú a sú vytlačené v pracovnom liste – vhodné ako podklad na skúšanie.','Príklad Liptova slúži ako vzor; žiaci by mali spracovať vlastný región.']},
 quiz:{1:[
  {q:bl(1)+'Ktorá časť patrí na koniec komplexnej charakteristiky?',o:[{t:'problémy a perspektívy',ok:1},{t:'poloha'},{t:'reliéf'}]},
  {q:bl(4)+'Ktorá väzba príčina – dôsledok je správna?',o:[{t:'kotlina → teplotné inverzie → horšia kvalita ovzdušia v zime',ok:1},{t:'černozem → inverzie → lyžovanie'},{t:'vysoká nadmorská výška → vyššia teplota'}]},
  {q:bl(3)+'Do ktorej klimatickej oblasti prevažne patrí Liptovská kotlina?',o:[{t:'mierne teplá (na okrajoch chladná)',ok:1},{t:'teplá'},{t:'len chladná'}]},
  {q:bl(2)+'Prečo je dôležité uvádzať v odpovedi konkrétne údaje?',o:[{t:'dokladajú tvrdenia a ukazujú porozumenie',ok:1},{t:'aby bola odpoveď dlhšia'},{t:'nie je to dôležité'}]},
  {q:bl(1)+'Ktorá vodná nádrž je objemom najväčšia na Slovensku?',o:[{t:'Liptovská Mara',ok:1},{t:'Zemplínska šírava'},{t:'Oravská priehrada'}]}],
  2:[
  {q:bl(5)+'Ktorý región má lepšie prírodné predpoklady pre intenzívne poľnohospodárstvo – Liptov, alebo Podunajská nížina – a prečo?',o:[{t:'Podunajská nížina – rovinatý reliéf, teplá klíma, černozeme',ok:1},{t:'Liptov – vyššia nadmorská výška'},{t:'oba rovnako'}]},
  {q:bl(4)+'Aké je správne pravidlo porovnávacej charakteristiky?',o:[{t:'porovnávať podľa rovnakých kritérií v rovnakom poradí a vysvetľovať rozdiely',ok:1},{t:'najprv celý jeden región, potom druhý bez prepojenia'},{t:'porovnávať len hospodárstvo'}]},
  {q:bl(5)+'Ktorý záver o Liptove je najlepšie zdôvodnený?',o:[{t:'perspektívou je celoročný udržateľný cestovný ruch, lebo región má NP, termálne vody a dobrú dostupnosť po D1, ale musí riešiť tlak na prírodu',ok:1},{t:'Liptov nemá žiadne problémy'},{t:'Liptov by mal postaviť oceliareň'}]},
  {q:bl(6)+'Čo by si pridal/a do charakteristiky, aby bola komplexnejšia?',o:[{t:'väzby medzi zložkami (napr. reliéf → doprava → cestovný ruch) a vlastné hodnotenie',ok:1},{t:'viac nadpisov bez obsahu'},{t:'zoznam všetkých obcí'}]},
  {q:bl(4)+'Prečo prechádza hlavný dopravný koridor práve Liptovskou kotlinou?',o:[{t:'kotlina je prirodzený pozdĺžny prechod medzi pohoriami pozdĺž Váhu',ok:1},{t:'je najvyššie položená'},{t:'je tam more'}]}]},
 act:(el,lv)=>runParts(el,[
   orderCards({t:bl(1)+'Zoraď časti komplexnej charakteristiky regiónu.',cards:STRUCT,done:'Poloha → prírodné pomery → obyvateľstvo a sídla → hospodárstvo → problémy a perspektívy.'}),

const ri=(a,b,s=1)=>a+Math.floor(Math.random()*(Math.floor((b-a)/s)+1))*s;

const fs=n=>Math.round(n).toLocaleString('sk');
const uniqOpts=(ok,wr)=>{const seen=new Set([ok]);return [{t:ok,ok:1},...wr.filter(w=>{if(seen.has(w))return false;seen.add(w);return true}).slice(0,3).map(t=>({t}))]};

/* výber úloh do testu: náhodný výber z banky, varianty znenia, generované úlohy */
const QN=6;
function pickQ(m,lv){const gens=(m.gen||[]).map(g=>()=>g(lv));
  const sel=lv===2?[...shuffle(m.quiz[2]).slice(0,3),...shuffle([...m.quiz[1],...gens]).slice(0,QN-3)]:shuffle([...m.quiz[1],...gens]).slice(0,QN);
  return shuffle(sel).map(q=>{q=typeof q==='function'?q():q;return Array.isArray(q.q)?{...q,q:pick(q.q)}:q})}
/* analýza: náhodné poradie a výber kôl, generované kolá sa vytvoria nanovo */
function dynRounds(rounds,n){return (el,next,pi,pn)=>choiceRounds(shuffle(rounds).slice(0,n||rounds.length).map(r=>{r=typeof r==='function'?r():r;return Array.isArray(r.t)?{...r,t:pick(r.t)}:r}))(el,next,pi,pn)}
function dynSort(cfg,n){return (el,next,pi,pn)=>sortBins({...cfg,items:shuffle(cfg.items).slice(0,Math.min(n||6,cfg.items.length))})(el,next,pi,pn)}
/* pred analýzu sa vloží rozcvička s generovanými výpočtami */
let __pre=null;
function runParts(el,parts,msg){if(__pre){parts=[...__pre,...parts];__pre=null}let p=0;const go=()=>parts[p](el,()=>{p++;p<parts.length?go():finish(el,msg)},p,parts.length);go()}
/* otvorené úlohy: náhodný variant zadania */
const ALT={};
const _openTask=openTask;
openTask=function(cfg){return (el,next,pi,pn)=>{const vs=[cfg,...(ALT[cfg.key]||[])];const v=pick(vs);const vi=vs.indexOf(v);

const DYN_ON=1;
/* =========================================================
   DYNAMIZÁCIA + ÚVODNÉ ANIMÁCIE CELKOV (spoločné jadro)
   ========================================================= */
const dri=(a,b,s=1)=>a+Math.floor(Math.random()*(Math.floor((b-a)/s)+1))*s;
const dpick=a=>a[Math.floor(Math.random()*a.length)];
const df1=(n,d=1)=>(+n).toFixed(d).replace('.',',').replace('-','−');
const dfs=n=>Math.round(n).toLocaleString('sk');
const dUniq=(ok,wr)=>{const seen=new Set([ok]);return [{t:ok,ok:1},...wr.filter(w=>{if(seen.has(w))return false;seen.add(w);return true}).slice(0,3).map(t=>({t}))]};
const SEQ=/(^|>)\s*(Teraz|A nakoniec|Ešte|Potom)\b/;
const isSeq=arr=>arr.some(r=>SEQ.test(String(Array.isArray(r)?r[0]:(r&&r.t)||'')));
if(typeof DYN_ON==='undefined'){
  /* poradie kôl a úloh sa mieša, ak na sebe nezávisia */
  if(typeof choiceRounds==='function'){const _cr=choiceRounds;choiceRounds=function(r){return _cr(isSeq(r)?r:shuffle(r))}}
  if(typeof tapZones==='function'){const _tz=tapZones;tapZones=function(cfg){return (el,next,pi,pn)=>_tz({...cfg,tasks:isSeq(cfg.tasks)?cfg.tasks:shuffle(cfg.tasks)})(el,next,pi,pn)}}
}
/* výber otázok do kvízu – náhodný výber z banky a generované úlohy */
function makePickQ(N,minOwn){return function(m,lv){const gens=(m.gen||[]).map(g=>()=>g(lv));const own=m.quiz[lv]||[];const other=lv===2?(m.quiz[1]||[]):[];
  let sel=lv===2&&minOwn?[...shuffle(own).slice(0,minOwn),...shuffle([...own.slice(minOwn),...other,...gens]).slice(0,N-minOwn)]:shuffle([...own,...gens]).slice(0,N);
  if(lv===2&&minOwn){const rest=shuffle([...own,...other,...gens].filter(x=>!sel.includes(x)));sel=[...new Set(sel)];while(sel.length<N&&rest.length)sel.push(rest.pop())}
  return shuffle(sel).map(q=>{q=typeof q==='function'?q():q;return Array.isArray(q.q)?{...q,q:dpick(q.q)}:q})}}

const INTRO_CSS=`
.intro-ov{position:fixed;inset:0;z-index:90;background:rgba(10,18,32,.86);display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.intro-box{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}

.intro-top b{flex:1;font-size:16px}.intro-top small{color:var(--ink-soft);font-weight:700}
.intro-bars{display:flex;gap:4px;padding:8px 14px 0}.intro-bars i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.intro-bars i span{display:block;height:100%;width:0;background:var(--ink)}
.intro-bars i.done span{width:100%}.intro-bars i.on span{animation:ibar var(--dur) linear forwards}
.intro-stage{position:relative;padding:10px 14px 0;overflow:hidden;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.intro-stage .fr{width:100%;max-height:52vh;display:flex;justify-content:center}.intro-stage .fr>*{max-height:52vh;width:auto;max-width:100%}
.intro-stage .fr svg{max-height:52vh;width:100%;height:auto}
.intro-cap{display:flex;gap:10px;align-items:flex-start;padding:12px 16px 4px;min-height:84px}.intro-cap p{margin:0;flex:1;font-size:19px;font-weight:700;line-height:1.35;animation:icap .6s both}
.intro-ctl{display:flex;gap:8px;justify-content:space-between;padding:8px 14px 14px;flex-wrap:wrap}
.fx-zoomin{animation:izi 4.5s ease-out both}.fx-zoomout{animation:izo 4.5s ease-out both}.fx-pop{animation:ipop .7s cubic-bezier(.2,1.4,.4,1) both}
.fx-wipe{animation:iwipe 2.2s ease-in-out both}.fx-pan{animation:ipan 5s ease-in-out both}
.fx-draw path,.fx-draw polyline,.fx-draw line{stroke-dasharray:2400;stroke-dashoffset:2400;animation:idraw 3.2s ease-in-out forwards}
.fx-grow rect{transform-box:fill-box;transform-origin:bottom;animation:igrow 1.2s ease-out both}.fx-grow rect:nth-of-type(2n){animation-delay:.15s}.fx-grow rect:nth-of-type(3n){animation-delay:.3s}
.mk{opacity:0;animation:ifade .5s var(--d) forwards}.mk circle.ring{transform-box:fill-box;transform-origin:center;animation:iring 1.6s var(--d) ease-out infinite}
@keyframes izi{from{transform:scale(1.35)}to{transform:scale(1)}}@keyframes izo{from{transform:scale(.55);opacity:.3}to{transform:scale(1);opacity:1}}
@keyframes ipop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}@keyframes iwipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes ipan{from{transform:translateX(6%) scale(1.15)}to{transform:translateX(-2%) scale(1.15)}}@keyframes idraw{to{stroke-dashoffset:0}}
@keyframes igrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes ifade{to{opacity:1}}@keyframes iring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.8);opacity:0}}
@keyframes ibar{to{width:100%}}@keyframes icap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

function withMarks(svg,marks){if(!marks||!marks.length)return svg;const i=svg.lastIndexOf('</svg>');
  const m=marks.map(([x,y,l,d=0.8,c='#E4572E'])=>`<g class="mk" style="--d:${d}s"><circle class="ring" cx="${x}" cy="${y}" r="16" fill="none" stroke="${c}" stroke-width="4"/><circle cx="${x}" cy="${y}" r="6" fill="${c}" stroke="#fff" stroke-width="2"/>${l?`<text x="${x+12}" y="${y-12}" font-size="15" font-weight="800" fill="#111" paint-order="stroke" stroke="#fff" stroke-width="4">${l}</text>`:''}</g>`).join('');
  return svg.slice(0,i)+m+svg.slice(i)}
function playIntro(pi,onDone){const spec=INTROS[pi];if(!spec){onDone&&onDone();return}let k=0,timer=null,paused=false;
  const ov=document.createElement('div');ov.className='intro-ov';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','Úvodná animácia: '+spec.title);
  ov.innerHTML=`<div class="intro-box"><div class="intro-top"><b>▶ ${spec.title}</b><small>úvod celku</small></div><div class="intro-bars">${spec.frames.map(()=>'<i><span></span></i>').join('')}</div><div class="intro-stage" id="ist"></div><div class="intro-cap"><p id="icap"></p><button class="say" id="isay" aria-label="Prečítaj">🔊</button></div>
   <div class="intro-ctl"><span><button class="btn soft small" id="iprev">⏮</button> <button class="btn soft small" id="ipause">⏸</button> <button class="btn soft small" id="iagain">↺ Znova</button></span><button class="btn sun small" id="iskip">Preskočiť ⏭</button></div></div>`;
  document.body.appendChild(ov);
  const bars=[...ov.querySelectorAll('.intro-bars i')];
  const close=()=>{clearTimeout(timer);try{speechSynthesis.cancel()}catch(e){}ov.remove();store.set('intro_'+pi,1);onDone&&onDone()};
  function show(){const f=spec.frames[k];const dur=f.dur||Math.max(4200,f.cap.split(' ').length*360);
    bars.forEach((b,i)=>{b.className=i<k?'done':i===k?'on':'';b.style.setProperty('--dur',dur+'ms')});
    const raw=typeof f.svg==='function'?f.svg():f.svg;ov.querySelector('#ist').innerHTML=`<div class="fr fx-${f.fx||'pop'}">${withMarks(raw,f.marks)}</div>`;
    ov.querySelector('#icap').outerHTML=`<p id="icap">${f.cap}</p>`;ov.querySelector('#isay').dataset.say=f.cap.replace(/<[^>]+>/g,'');
    if(spec.voice&&typeof say==='function')say(f.cap.replace(/<[^>]+>/g,''),true);
    clearTimeout(timer);if(!paused)timer=setTimeout(()=>{k++;if(k<spec.frames.length)show();else{ov.querySelector('#iskip').textContent='Začať ▶';bars.forEach(b=>b.className='done')}},dur)}
  ov.querySelector('#iskip').onclick=close;
  ov.querySelector('#iagain').onclick=()=>{k=0;paused=false;ov.querySelector('#ipause').textContent='⏸';show()};
  ov.querySelector('#iprev').onclick=()=>{k=Math.max(0,k-1);show()};
  ov.querySelector('#ipause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶':'⏸';if(paused){clearTimeout(timer);bars[k]&&(bars[k].querySelector('span').style.animationPlayState='paused')}else{show()}};
  ov.querySelector('#isay').onclick=e=>{e.stopPropagation();say(e.currentTarget.dataset.say,true)};
  document.addEventListener('keydown',function esc(ev){if(ev.key==='Escape'){document.removeEventListener('keydown',esc);if(document.body.contains(ov))close()}});
  show()}
function packOf(id){return COURSE.findIndex(p=>p.items.some(i=>i[0]===id))}
