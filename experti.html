<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Experti – Geografia Slovenska pre maturantov</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1B2A41">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.hub-btn{flex:0 0 40px;width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--line);background:var(--card);border-radius:12px;font-size:22px;text-decoration:none;color:inherit;font-weight:800}

:root{
  --paper:#F3F5F8;--card:#FFFFFF;--ink:#0F1B2D;--ink-soft:#46536A;--line:#D5DCE6;--topo:#E3E8EF;--press:rgba(27,42,65,.25);
  --red:#9A3412;--blue:#1E40AF;--green:#047857;--yellow:#F5B700;--tan:#E6D49B;--brown:#7A4A22;
  --lowland:#0E9384;--lowland-soft:#D5F0EC;--sun:#F2C200;--sun-soft:#FFF4C4;--river-soft:#DCE8F8;--berry:#D62828;--hill-soft:#F3E7C8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121C2B;--card:#1B2940;--ink:#EEF3FA;--ink-soft:#B6C3D6;--line:#33476A;--topo:#18263B;--press:rgba(0,0,0,.5);--lowland-soft:#1C3A2B;--sun-soft:#3F3818;--river-soft:#17345A;--hill-soft:#3E3320}}
:root[data-theme="dark"]{--paper:#121C2B;--card:#1B2940;--ink:#EEF3FA;--ink-soft:#B6C3D6;--line:#33476A;--topo:#18263B;--press:rgba(0,0,0,.5);--lowland-soft:#1C3A2B;--sun-soft:#3F3818;--river-soft:#17345A;--hill-soft:#3E3320}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent;min-height:100vh}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.12;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
svg{max-width:100%}
:focus-visible{outline:4px solid var(--yellow);outline-offset:3px;border-radius:10px}
.topo{position:fixed;inset:0;width:100%;height:100%;z-index:-1;color:var(--topo);pointer-events:none}
/* trail marker */
.marker{display:inline-block;flex:0 0 auto;border:2px solid var(--ink);border-radius:3px;background:linear-gradient(#fff 0 33%,var(--mc) 33% 67%,#fff 67%);vertical-align:-4px}
.m-cervena{--mc:var(--red)}.m-modra{--mc:var(--blue)}.m-zelena{--mc:var(--green)}.m-zlta{--mc:var(--yellow)}
/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px;text-align:left}
#brandOwl{display:block;width:34px;flex:0 0 34px}#brandOwl svg{width:34px;height:40px;display:block}
.brand b{font-family:'Fraunces',Georgia,serif;font-size:20px;display:block;line-height:1}
.brand small{font-size:12px;color:var(--ink-soft)}
.lvl{margin-left:auto;display:flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.lvl button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.lvl button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pass-btn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-weight:800;display:flex;gap:6px;align-items:center}
@media (max-width:520px){.brand-txt small{display:none}.lvl button{padding:6px 9px;font-size:13px}}
@media (max-width:420px){.brand-txt{display:none}}
main{max-width:960px;margin:0 auto;padding:16px 14px 110px}
/* buttons */
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;font-size:17px;background:var(--ink);color:var(--paper);box-shadow:0 4px 0 var(--press);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:50px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.btn.soft{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.sun{background:var(--yellow);color:#1B2A41}
.btn.green{background:var(--green);color:#fff}
.btn.small{padding:8px 13px;font-size:15px;min-height:40px;border-radius:12px}
.say{border:2px solid var(--line);background:var(--card);border-radius:50%;width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;font-size:19px}
/* hero */
.hero{display:grid;grid-template-columns:1fr 1.25fr;gap:18px;align-items:center;margin:10px 0 8px}
.hero h1{font-size:clamp(44px,9vw,78px);font-weight:800;line-height:.95}
.hero .sub{font-family:'Fraunces',Georgia,serif;font-size:22px;margin:6px 0 10px;color:var(--brown)}
.hero .lead{margin:0;color:var(--ink-soft);max-width:44ch}
.hero-r{border-radius:20px;overflow:hidden;border:2px solid var(--line);background:#fff;transform:rotate(1.2deg);box-shadow:0 10px 30px rgba(27,42,65,.12)}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero-r{transform:none}}
.guide{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start;margin:18px 0 6px}
.guide .owl{width:76px}
.bubble{background:var(--card);border:2px solid var(--ink);border-radius:20px 20px 20px 6px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.bubble p{margin:0;flex:1}
/* routes */
.route{margin:26px 0 8px}
.route header{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.route h2{font-size:26px}.route header span{color:var(--ink-soft);font-size:14px;font-weight:700}
.stops{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sign{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--ink);border-radius:10px 26px 26px 10px;padding:10px 14px 10px 10px;text-align:left;box-shadow:0 4px 0 var(--press);min-height:68px}
.sign:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.sg-n{flex:0 0 34px;height:34px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-family:'Fraunces',Georgia,serif;border:2px solid var(--ink);background:linear-gradient(#fff 0 30%,var(--rc) 30% 70%,#fff 70%);color:transparent;text-shadow:none}
.r-cervena{--rc:var(--red)}.r-modra{--rc:var(--blue)}.r-zelena{--rc:var(--green)}
.sg-t{flex:1}.sg-t b{display:block;font-family:'Fraunces',Georgia,serif;font-size:18px;line-height:1.15}.sg-t small{color:var(--ink-soft);font-weight:700}
.sg-i{font-size:28px}
.sign.done{border-color:var(--green)}.sign.done small{color:var(--green)}
.sign[disabled]{opacity:.55;box-shadow:none;border-style:dashed;cursor:default}
/* module */
.mhead{display:flex;justify-content:space-between;gap:10px;margin:4px 0 8px}
.mtitle{font-size:clamp(28px,6vw,42px);margin:0 0 10px;display:flex;align-items:center;gap:12px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}.steps::-webkit-scrollbar{display:none}
.steps button{flex:0 0 auto;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:5px 12px 5px 6px;display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px}
.steps button i{font-style:normal;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--paper);font-size:14px}
.steps button[aria-current="step"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.steps button[aria-current="step"] i{background:var(--yellow)}
.steps button.ok i{background:var(--green);color:#fff}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}
.card h2{font-size:24px;margin-bottom:6px}
.read-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sec{margin:14px 0;max-width:68ch}.sec h2{font-size:23px;margin-bottom:4px}.sec p{margin:0;font-size:18px}
.sec.extra{border-left:5px solid var(--blue);padding-left:14px}
.tag{display:inline-block;background:var(--hill-soft);border-radius:8px;padding:2px 10px;font-weight:800;font-size:14px;margin-bottom:6px}.tag.t2{background:var(--river-soft)}
.g{border:0;background:none;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--blue)}
.gpop{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);border-radius:16px;padding:12px 56px 12px 16px;width:min(520px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.gpop p{margin:4px 0 0}.gpop .say{position:absolute;right:8px;top:8px;background:var(--card);color:var(--ink)}
.fact,.trip{border-radius:16px;padding:12px 16px;margin:16px 0;max-width:68ch}
.fact{background:var(--sun-soft)}.fact p,.trip p{margin:4px 0 0}
.trip{background:var(--lowland-soft);display:flex;gap:12px;align-items:flex-start}
.hint{font-size:14px;color:var(--ink-soft);text-align:center}
.task{display:flex;gap:12px;align-items:center;background:var(--sun-soft);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:18px;font-weight:800}
.task p{margin:0;flex:1}
.scene{width:100%;height:auto;display:block;border-radius:14px;touch-action:manipulation}
.ill{max-width:560px;margin:0 auto 12px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 0}.dots i{width:11px;height:11px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--green)}
.mini-count{text-align:center;color:var(--ink-soft);font-size:13px;margin:4px 0 0}
.feedback{min-height:28px;text-align:center;font-weight:800;margin-top:8px}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}
.zone{cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--press);min-height:54px;justify-content:center;text-align:center}
.opt svg{width:100%;max-width:220px;height:auto}.opt .emo{font-size:40px;line-height:1}
.opt.right{border-color:var(--green);background:var(--lowland-soft)}.opt.wrong{border-color:var(--red)}
.opt:active{transform:translateY(2px);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.chip{border:2px solid var(--ink);background:var(--card);border-radius:10px;min-height:44px;padding:0 12px;font-size:16px;font-weight:800;box-shadow:0 3px 0 var(--press)}
.chip[aria-pressed="true"]{background:var(--yellow);color:#1B2A41}.chip:disabled{opacity:.3;box-shadow:none}
.bigemo{font-size:56px;text-align:center;line-height:1.2}
.sort-item{display:flex;flex-direction:column;align-items:center;gap:2px;margin:4px auto 12px;background:var(--paper);border:2px dashed var(--line);border-radius:18px;padding:10px 16px;max-width:340px;font-size:19px;text-align:center}
.sort-item .emo{font-size:52px;line-height:1}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bin{border:2px solid var(--ink);background:var(--card);border-radius:16px;padding:10px;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--press)}
.bin .emo{font-size:32px;line-height:1.1}.bin:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.order{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ocard{position:relative;border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:12px 8px;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 var(--press)}
.ocard .emo{font-size:30px;line-height:1}.ocard em{position:absolute;top:-10px;right:-8px;font-style:normal;background:var(--green);color:#fff;border-radius:6px;width:30px;height:30px;display:grid;place-items:center;font-weight:800}.ocard em:empty{display:none}
.ocard.right{border-color:var(--green);background:var(--lowland-soft);box-shadow:none}
.wscroll,#tz{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}.wscroll svg{min-width:640px}#tz svg.cvmap{min-width:620px}
.tbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:640px){.twin{grid-template-columns:1fr}}
.cap{margin:0 0 4px;font-weight:800;font-size:14px;color:var(--ink-soft)}
.cwrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}.cwrap canvas{position:absolute;inset:0;width:100%;height:100%}.cwrap #ct{position:relative}
.slider{display:flex;flex-direction:column;gap:6px;margin:14px auto 0;max-width:520px;font-weight:700}.slider input{width:100%;accent-color:var(--blue);height:32px}
.checks{display:grid;gap:8px;margin-top:10px}.chk{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:12px;padding:10px 12px;font-weight:700}.chk input{width:26px;height:26px;accent-color:var(--green);flex:0 0 26px}
.play ol{padding-left:24px;margin:8px 0}.play li{margin:6px 0}.play h3{font-size:19px;margin-top:14px}
.next-bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:2px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.next-bar .in{max-width:960px;margin:0 auto;display:flex;gap:10px;justify-content:space-between}
.done-card{text-align:center;padding:10px}.done-card .big{font-size:46px}
.sheet{background:#fff;color:#111;border-radius:10px;padding:22px;border:1px solid #ccc;font-family:'Nunito',sans-serif}
.sheet .sh-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:10px;flex-wrap:wrap}
.sheet h2{font-size:25px;margin:2px 0 6px;color:#111}.sheet p{margin:7px 0}.sheet svg{display:block;margin:8px auto;width:100%;height:auto}.sheet .lines{border-bottom:1.5px solid #555;height:32px}
dialog{border:0;border-radius:22px;padding:0;max-width:min(680px,94vw);width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(18,28,43,.55)}
.dlg{padding:20px;max-height:84vh;overflow:auto}.dlg h2{font-size:26px;margin-bottom:8px}.dlg h3{font-size:18px;margin:14px 0 4px}.dlg ul{margin:4px 0;padding-left:22px}.dlg .close{float:right}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.badge{border:2px dashed var(--line);border-radius:16px;padding:10px;text-align:center;font-size:13px}
.badge .st{width:70px;height:70px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:32px;border:5px double var(--line)}
.badge.got{border-style:solid;border-color:var(--green)}.badge.got .st{border-color:var(--green);background:var(--lowland-soft)}.badge b{display:block;font-size:14px}
.reveal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(18,28,43,.6);padding:20px}
.reveal .box{background:var(--card);border-radius:26px;padding:24px 20px;text-align:center;max-width:360px;width:100%}
.reveal .st{width:140px;height:140px;margin:6px auto 12px;border-radius:50%;display:grid;place-items:center;font-size:64px;border:9px double var(--green);background:var(--lowland-soft);animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:scale(2.4) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:15px}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@media (min-width:700px){.swipe{display:none}}
.stopcard{background:var(--paper);border-radius:18px;padding:14px;margin-top:12px}.sc-h{display:flex;gap:12px;align-items:center}.sc-h small{color:var(--ink-soft);font-weight:800}.sc-h h2{font-size:24px}.sc-h div{flex:1}.sc-e{font-size:40px}.stopcard>p{font-size:17px;margin:8px 0}.sc-q{margin-top:12px!important}

.marker{border-radius:50%!important;background:var(--mc)!important;border-color:var(--ink)}
.sg-n{border-radius:50%!important;background:var(--rc)!important;color:#fff!important;font-family:'Fraunces',Georgia,serif}
#brandOwl{display:none}
@media (max-width:480px){.brand-txt{display:none!important}}
.r-zelena{--rc:#047857}.m-zelena{--mc:#047857}
.bhero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:center;margin:10px 0 6px}
.bhero .kicker{display:inline-block;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#0E9384;margin-bottom:6px}
.bhero h1{font-size:clamp(44px,9vw,76px);font-weight:800;line-height:.95}.bhero .sub{font-family:'Fraunces',Georgia,serif;font-size:20px;margin:8px 0;color:var(--ink-soft)}.bhero .lead{margin:0;max-width:46ch}
.bh-g{display:flex;gap:12px;justify-content:center}.gcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 12px 10px;text-align:center;width:150px}.gcard svg{width:100%}.gcard b{display:block;font-family:'Fraunces',Georgia,serif;font-size:18px}.gcard small{color:var(--ink-soft);font-weight:700}
@media (max-width:700px){.bhero{grid-template-columns:1fr}}
.gi{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:start;margin:0 0 10px}.gi-samo{grid-template-columns:1fr 78px}.gi-samo .gi-a{order:2}
.gi-a{text-align:center;font-family:'Fraunces',Georgia,serif;font-size:14px}.gi-a svg{width:78px;display:block}
.gi-b{background:var(--paper);border-radius:18px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start}.gi-ema .gi-b{border-top-left-radius:4px}.gi-samo .gi-b{border-top-right-radius:4px;background:#ECEBFB}
.gi-b p{margin:0;flex:1;font-size:16.5px}
.rq{border:2px solid #0E9384;border-radius:16px;padding:10px 14px;margin:6px 0 16px;background:#F2FBF9}.rq span{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#0E9384}.rq p{margin:2px 0 0;font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gi-samo .gi-b{background:#262B52}:root:not([data-theme="light"]) .rq{background:#10302C}}

.bl{display:inline-block;font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.02em;color:#fff;background:var(--c);border-radius:6px;padding:2px 8px;margin-right:4px;vertical-align:2px;white-space:nowrap}
.task{font-weight:600!important;background:#EEF2F8!important}
.ctx{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin:0 0 16px}@media (max-width:640px){.ctx{grid-template-columns:1fr}}
.ctx>div{border-radius:14px;padding:12px 14px}.ctx>div:first-child{background:#0F1B2D;color:#fff}.ctx-cp{background:#FFF7ED;border:1px solid #FED7AA}
.ctx-k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}.ctx-q{font-family:'Fraunces',Georgia,serif;font-size:21px;margin:4px 0 0;line-height:1.25}.ctx-cp p{margin:4px 0 0;font-size:14.5px}
.ota-l{display:block;font-weight:700;font-size:14px;margin:6px 0 4px}.ota{width:100%;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink);resize:vertical}
.ota:focus{border-color:var(--blue);outline:none}
.model{background:#ECFDF5;border-left:5px solid #047857;border-radius:10px;padding:10px 14px;margin-top:14px}.model p{margin:4px 0 0}
.rubric{margin-top:12px}.rubric .chk{margin-top:6px}
.xhero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center;margin:10px 0}@media (max-width:700px){.xhero{grid-template-columns:1fr}}
.xhero .kicker{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#9A3412}.xhero h1{font-size:clamp(46px,9vw,80px);font-weight:800;line-height:.95;margin:6px 0}.xhero .sub{font-family:'Fraunces',Georgia,serif;font-size:21px;margin:0 0 8px;color:var(--ink-soft)}.xhero .lead{margin:0;max-width:52ch}
.xh-b{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .task{background:#1F2B42!important}:root:not([data-theme="light"]) .ctx-cp{background:#3A2A1C;border-color:#6B4423}:root:not([data-theme="light"]) .model{background:#12352A}}
.timer{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 12px}.timer #tm{font-family:'Fraunces',Georgia,serif;font-size:40px;font-weight:800;min-width:110px;text-align:center}.timer #tm.warn{color:#B91C1C}
.ota.sm{font-size:15px}
blockquote.src{margin:0 0 12px;padding:10px 14px;border-left:4px solid #9A3412;background:#FFF7ED;border-radius:8px;font-style:italic}
.dtab{width:100%;border-collapse:collapse;font-size:14px;background:var(--card)}.dtab caption{font-weight:700;text-align:left;padding:4px 0}.dtab th,.dtab td{border:1px solid var(--line);padding:6px 8px;text-align:left}.dtab td.n{text-align:right;font-variant-numeric:tabular-nums}.dtab th{background:#EEF2F8;font-size:12.5px}
#print-area{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{@page{size:A4;margin:12mm}body{background:#fff}body>*:not(#print-area){display:none!important}#print-area{display:block}#print-area .sheet{border:0;padding:0}}

<body>
<svg class="topo" id="topo" aria-hidden="true"></svg>
<header class="top"><div class="top-in">
  <button class="brand" id="homeBtn" aria-label="Domov – trasy"><span id="brandOwl"></span><span class="brand-txt"><b>Experti</b><small>Geografia Slovenska pre maturantov</small></span></button>
  <div class="lvl" role="group" aria-label="Ročník"><button data-lv="1">Základ</button><button data-lv="2">Maturita</button></div>
  <button class="pass-btn" id="autoBtn" title="Automatické čítanie úloh nahlas" aria-pressed="false">🔇</button>
  <button class="pass-btn" id="passBtn" aria-label="Portfólio">📁 <span id="passCount">0</span></button>
</div></header>
<main id="app"></main>
<div class="next-bar" id="nextBar" hidden><div class="in" id="nextIn"></div></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="print-area"></div>
<script>
/* výslovnosť pre syntetický hlas: rozpísanie skratiek, jednotiek a čísel */
function plural(n,a,b,c){n=Math.abs(n);return n===1?a:(n>=2&&n<=4)?b:c}
function spk(t){let s=String(t).replace(/<[^>]+>/g,' ').replace(/\p{Extended_Pictographic}/gu,'').replace(/[▲★☐→↔·–—]/g,', ');
  s=s.replace(/(\d)[\u00a0 ](?=\d{3}(?!\d))/g,'$1').replace(/(\d)[\u00a0 ](?=\d{3}(?!\d))/g,'$1');
  const R=[[/m n\. m\./g,'metrov nad morom'],[/km²/g,'štvorcových kilometrov'],[/°C/g,' stupňov Celzia'],[/(\d+(?:,\d+)?)\s?%/g,'$1 percent'],
    [/\bnapr\./g,'napríklad'],[/\btzv\./g,'takzvaný'],[/\ba pod\./g,'a podobne'],[/\bpribl\./g,'približne'],[/\broč\./g,'ročník'],[/\btis\./g,'tisíc'],[/\bstor\./g,'storočie'],
    [/\bsv\. (\p{Lu}\p{Ll}*[ye])\b/gu,'svätej $1'],[/\bsv\. /g,'svätého '],
    [/(?<!\p{L})SHMÚ(?!\p{L})/gu,'Slovenský hydrometeorologický ústav'],[/\bSODB\b/g,'sčítanie obyvateľov, domov a bytov'],[/\bTANAP\b/g,'Tanap'],[/\bPIENAP\b/g,'Pienap'],[/\bNAPANT\b/g,'Napant'],
    [/\bCHKO\b/g,'chránená krajinná oblasť'],[/\bNP\b/g,'národný park'],[/\bUNESCO\b/g,'Unesko'],[/(?<!\p{L})EÚ(?!\p{L})/gu,'Európska únia'],[/\bSR\b/g,'Slovenskej republiky'],[/(?<!\p{L})MŠ(?!\p{L})/gu,'materská škola'],[/(?<!\p{L})ZŠ(?!\p{L})/gu,'základná škola'],
    [/\bD1\b/g,'dé jednotka'],[/\bD2\b/g,'dé dvojka'],[/ = /g,' je ']];
  R.forEach(([a,b])=>{s=s.replace(a,b)});
  const U={km:['kilometer','kilometre','kilometrov'],cm:['centimeter','centimetre','centimetrov'],mm:['milimeter','milimetre','milimetrov'],m:['meter','metre','metrov']};
  s=s.replace(/(\d+(?:,\d+)?)\s?(km|cm|mm|m)(?![\p{L}²])/gu,(x,n,u)=>n+' '+(n.includes(',')?U[u][1].replace(/e$/,'a'):plural(+n,...U[u]))).replace(/(?<![\p{L}\d])km(?![\p{L}²])/gu,'kilometrov');
  s=s.replace(/(\d+)\s?h\b/g,(m,n)=>n+' '+plural(+n,'hodina','hodiny','hodín')).replace(/(\d+)\s?min\b/g,(m,n)=>n+' '+plural(+n,'minúta','minúty','minút'));
  return s.replace(/\s+/g,' ').replace(/\s,/g,',').trim()}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem('ex_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ex_'+k,JSON.stringify(v))}catch(e){}}};
const S={level:store.get('level',1),view:'home',mod:null,step:0,badges:store.get('badges',{}),seen:store.get('seen',{})};

function toast(t,ms=3200){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}

/* speech */
let voice=null,warned=false;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();const sk=vs.filter(v=>/^sk/i.test(v.lang));voice=sk.find(v=>/natural|neural|enhanced|vylepš|premium|google|online/i.test(v.name))||sk[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
S.auto=store.get('auto',false);
function say(t,manual){if(!manual&&!S.auto)return;speakNow(t)}
function speakNow(t){
  if(!('speechSynthesis' in window)){toast('Tento prehliadač nevie čítať nahlas.');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(spk(t));
  u.lang='sk-SK';u.rate=.9;u.pitch=1.08;
  if(voice)u.voice=voice;else if(!warned){warned=true;toast('Slovenský hlas sa v zariadení nenašiel. Dá sa doinštalovať v nastaveniach (Jazyk a čítanie textu).',5200)}
  speechSynthesis.speak(u);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();say(b.dataset.say,true)}});

/* sounds */
let actx=null;
function tone(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;const notes=ok?[660,880,1175]:[260,200];notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ok?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.18,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.22);o.connect(g).connect(actx.destination);o.start(t+i*.09);o.stop(t+i*.09+.25)})}catch(e){}}
const PRAISE=['Správne!','Presne tak!','Výborne!','Dobrá úvaha!','Sedí to!'];
const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];

/* ---------- Buzola ---------- */
function owl(){return `<svg class="owl" viewBox="0 0 120 142" role="img" aria-label="Sova Buzola">
<path d="M26 34 18 6 46 24Z" fill="#6E4527"/><path d="M94 34 102 6 74 24Z" fill="#6E4527"/>
<ellipse cx="60" cy="82" rx="46" ry="56" fill="#8B5E3C"/>
<path d="M16 74Q4 106 24 128Q32 100 32 78Z" fill="#6E4527"/><path d="M104 74Q116 106 96 128Q88 100 88 78Z" fill="#6E4527"/>
<ellipse cx="60" cy="98" rx="30" ry="36" fill="#F2D6A8"/>
<path d="M30 72Q60 88 90 72L88 81Q60 97 32 81Z" fill="#2F8FD8"/><path d="M74 80l10 22-12-4z" fill="#2F8FD8"/>
<g transform="translate(60 106)"><circle r="15" fill="#FFF8EA" stroke="#C9874A" stroke-width="2.5"/><path d="M0-12 4 0 0 12-4 0Z" fill="#213A5C"/><path d="M0-12 4 0H-4Z" fill="#E4572E"/><circle r="2" fill="#FFC93C"/></g>
<circle cx="41" cy="50" r="21" fill="#F7E7C9"/><circle cx="79" cy="50" r="21" fill="#F7E7C9"/>
<circle cx="41" cy="50" r="14" fill="#fff"/><circle cx="79" cy="50" r="14" fill="#fff"/>
<circle cx="43" cy="51" r="8.5" fill="#213A5C"/><circle cx="77" cy="51" r="8.5" fill="#213A5C"/>
<circle cx="46" cy="48" r="3" fill="#fff"/><circle cx="80" cy="48" r="3" fill="#fff"/>
<path d="M53 62h14l-7 12z" fill="#F2A33A"/>
<path d="M44 136q-6 4-10 2m10-2q0 5-4 6m4-6q4 4 2 7M76 136q6 4 10 2m-10-2q0 5 4 6m-4-6q-4 4-2 7" stroke="#F2A33A" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>`}
function bubble(text){return `<div class="bubble"><p>${text}</p><button class="say" data-say="${esc(text)}" aria-label="Prečítaj nahlas">🔊</button></div>`}
function esc(t){return String(t).replace(/<[^>]+>/g,'').replace(/"/g,'&quot;')}

/* ---------- topo background ---------- */
(function(){const svg=$('#topo');const W=1200,H=1600;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('preserveAspectRatio','xMidYMid slice');let out='';
 const blob=(cx,cy,r,seed)=>{let d='';const n=48;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;const rr=r*(1+.13*Math.sin(a*3+seed)+.07*Math.sin(a*5+seed*2));const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*.82;d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}return d+'Z'};
 [[980,180,1.1],[160,1200,2.3],[1050,1350,4.1]].forEach(([x,y,s])=>{for(let k=1;k<=7;k++)out+=`<path d="${blob(x,y,k*48,s+k*.3)}" fill="none" stroke="currentColor" stroke-width="2.2"/>`});
 svg.innerHTML=out})();
$('#brandOwl').innerHTML=owl();


function dotsHTML(n,i){return `<div class="dots" aria-hidden="true">${Array.from({length:n},(_,k)=>`<i class="${k<i?'on':''}"></i>`).join('')}</div>`}
function taskHTML(t){return `<div class="task"><p>${t}</p><button class="say" data-say="${esc(t)}" aria-label="Prečítaj úlohu">🔊</button></div>`}


/* ---------- generic activity helpers ---------- */
function runParts(el,parts,msg){let p=0;const go=()=>parts[p](el,()=>{p++;p<parts.length?go():finish(el,msg)},p,parts.length);go()}
function optHTML(o,k){return `<button class="opt" data-k="${k}">${o.e?`<span class="emo">${o.e}</span>`:''}${o.s||''}${o.t?`<span>${o.t}</span>`:''}</button>`}
function choiceRounds(rounds){return (el,next,pi,pn)=>{let i=0;
  function draw(){const r=rounds[i];const opts=shuffle(r.o);
    el.innerHTML=taskHTML(r.t)+(r.img?`<div class="ill">${typeof r.img==='function'?r.img():r.img}</div>`:'')+
      `<div class="opts" ${r.col?'style="grid-template-columns:1fr"':''}>${opts.map(optHTML).join('')}</div><div class="feedback" id="fb" aria-live="polite"></div>${dotsHTML(pn,pi)}<p class="mini-count">${i+1} / ${rounds.length}</p>`;
    if(i>0||pi>0)say(r.t);
    $$('.opt',el).forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.k];const fb=$('#fb',el);
      if(o.ok){b.classList.add('right');fb.className='feedback good';const msg=r.why||praise();fb.textContent=msg+' ✔';tone(true);say(msg);$$('.opt',el).forEach(x=>x.disabled=true);
        setTimeout(()=>{i++;i<rounds.length?draw():next()},r.why?2300:1200)}
      else{b.classList.add('wrong');b.disabled=true;fb.className='feedback bad';fb.textContent=r.hint||'Skús ešte raz.';tone(false)}})}
  draw()}}
function sortBins({t,bins,items}){return (el,next,pi,pn)=>{const its=shuffle(items);let i=0;
  function draw(){const it=its[i];
    el.innerHTML=taskHTML(t)+`<div class="sort-item"><span class="emo">${it[0]}</span><b>${it[1]}</b></div>
      <div class="bins">${bins.map(b=>`<button class="bin" data-b="${b[0]}"><span class="emo">${b[2]}</span>${b[1]}</button>`).join('')}</div>
      <div class="feedback" id="fb" aria-live="polite"></div>${dotsHTML(pn,pi)}<p class="mini-count">${i+1} / ${its.length}</p>`;
    say((i===0&&pi>0?t+' ':'')+it[1]);
    $$('.bin',el).forEach(b=>b.onclick=()=>{const fb=$('#fb',el);
      if(b.dataset.b===it[2]){tone(true);fb.className='feedback good';const msg=it[3]||praise();fb.textContent=msg+' ✔';if(it[3])say(it[3]);$$('.bin',el).forEach(x=>x.disabled=true);
        setTimeout(()=>{i++;i<its.length?draw():next()},it[3]?2000:900)}
      else{tone(false);fb.className='feedback bad';fb.textContent='Porozmýšľaj ešte raz.'}})}
  draw()}}
function tapZones({zones,tasks,svg}){return (el,next,pi,pn)=>{let q=0;
  function draw(){const [tt,key]=tasks[q];
    el.dataset.tz=JSON.stringify(zones[key]);el.innerHTML=taskHTML(tt)+`<div id="tz">${svg()}</div><p class="mini-count swipe">↔ Mapu môžeš posúvať prstom.</p><div class="feedback" id="fb" aria-live="polite"></div>${dotsHTML(pn,pi)}<p class="mini-count">${q+1} / ${tasks.length}</p>`;
    if(q>0||pi>0)say(tt);
    const s=$('#tz svg',el);s.style.cursor='pointer';
    s.addEventListener('click',e=>{const pt=s.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(s.getScreenCTM().inverse());
      let best=null,bd=1e9;for(const [k,[x,y,r]] of Object.entries(zones)){const d=Math.hypot(p.x-x,p.y-y)/r;if(d<bd){bd=d;best=k}}
      const fb=$('#fb',el);
      if(bd<=1.15&&best===key){const [x,y,r]=zones[key];s.insertAdjacentHTML('beforeend',`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#FFC93C" stroke-width="6"/>`);
        tone(true);fb.className='feedback good';fb.textContent=praise()+' ✔';s.style.pointerEvents='none';setTimeout(()=>{q++;q<tasks.length?draw():next()},1200)}
      else{tone(false);fb.className='feedback bad';const nm=bd<=1.15?zones[best][3]:null;fb.textContent=nm?`Toto je ${nm}. Hľadaj ďalej.`:'Skús ešte raz.';if(nm)say(`Toto je ${nm}.`)}})}
  draw()}}
function labelSlots({t,svg,keys,label,hint,wide}){return (el,next,pi,pn)=>{const filled={};let sel=null;const order=shuffle(keys);
  function draw(){
    el.innerHTML=taskHTML(t)+`<div id="r" class="${wide?'wscroll':''}">${svg(filled)}</div>${wide?'<p class="mini-count">Mapu môžeš posúvať prstom do strany.</p>':''}<div class="chips">${order.map(k=>`<button class="chip wide" data-k="${k}" aria-pressed="${sel===k}" ${filled[k]?'disabled':''}>${label[k]}</button>`).join('')}</div><div class="feedback" id="fb" aria-live="polite"></div>${dotsHTML(pn,pi)}`;
    $$('.chip',el).forEach(c=>c.onclick=()=>{sel=c.dataset.k;draw();say(label[sel])});
    $$('.slot',el).forEach(s=>{const go=()=>{const fb=$('#fb',el);if(!sel){fb.className='feedback bad';fb.textContent='Najprv vyber slovo dole.';return}
      if(s.dataset.k===sel){filled[sel]=label[sel];sel=null;tone(true);draw();if(Object.keys(filled).length===keys.length){$('#fb',el).className='feedback good';$('#fb',el).textContent='Všetko je pomenované! ✔';say('Všetko je pomenované!');setTimeout(next,1300)}}
      else{tone(false);fb.className='feedback bad';fb.textContent=hint||'Tam to nepatrí. Skús iné miesto.'}};
      s.onclick=go;s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  }
  draw()}}
function orderCards({t,cards,done}){return (el,next,pi,pn)=>{let got=0;const sh=shuffle(cards.map((c,i)=>[...c,i]));
  el.innerHTML=taskHTML(t)+`<div class="order">${sh.map(c=>`<button class="ocard" data-i="${c[2]}"><span class="emo">${c[0]}</span>${c[1]}<em></em></button>`).join('')}</div><div class="feedback" id="fb" aria-live="polite"></div>${dotsHTML(pn,pi)}`;
  if(pi>0)say(t);
  $$('.ocard',el).forEach(b=>b.onclick=()=>{const fb=$('#fb',el);
    if(+b.dataset.i===got){got++;b.disabled=true;b.classList.add('right');$('em',b).textContent=got;tone(true);say(cards[got-1][1]);
      if(got===cards.length){fb.className='feedback good';fb.textContent=done+' ✔';setTimeout(()=>{say(done)},700);setTimeout(next,2600)}}
    else{tone(false);fb.className='feedback bad';fb.textContent='Ešte nie. Čo je na rade teraz?'}})}}
function placeGrid({cols,rows,cell,base,road,tasks}){return (el,next,pi,pn)=>{const placed={...base};let q=0;
  function svg(){let s=`<svg class="scene" viewBox="0 0 ${cols*cell} ${rows*cell}" style="max-width:460px;margin:0 auto">`;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const isRoad=r===road;s+=`<g class="zone cellz" data-c="${c},${r}" role="button" tabindex="0" aria-label="políčko"><rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="${isRoad?'#C9CDD3':((r+c)%2?'#E3F1D9':'#D5EACB')}" stroke="#fff" stroke-width="2"/></g>`}
    if(road!=null)s+=`<path d="M0 ${road*cell+cell/2}H${cols*cell}" stroke="#fff" stroke-width="3" stroke-dasharray="14 10" pointer-events="none"/>`;
    for(const [k,e] of Object.entries(placed)){const [c,r]=k.split(',').map(Number);s+=`<text x="${c*cell+cell/2}" y="${r*cell+cell/2+2}" font-size="${cell*.55}" text-anchor="middle" dominant-baseline="central" pointer-events="none">${e}</text>`}
    return s+'</svg>'}
  function draw(){const [tt,target,emo]=tasks[q];
    el.innerHTML=taskHTML(tt)+svg()+`<div class="feedback" id="fb" aria-live="polite"></div>${dotsHTML(pn,pi)}<p class="mini-count">${q+1} / ${tasks.length}</p>`;
    if(q>0||pi>0)say(tt);
    $$('.cellz',el).forEach(z=>{const go=()=>{const fb=$('#fb',el);
      if(z.dataset.c===target){placed[target]=emo;tone(true);el.querySelector('svg.scene').outerHTML;q++;fb.className='feedback good';fb.textContent=praise()+' ✔';
        el.querySelector('svg.scene').outerHTML=svg();setTimeout(()=>{q<tasks.length?draw():next()},1100)}
      else if(placed[z.dataset.c]){tone(false);fb.className='feedback bad';fb.textContent='Toto miesto je už obsadené.'}
      else{tone(false);fb.className='feedback bad';fb.textContent='Nie celkom. Prečítaj si úlohu ešte raz a pozri sa, od čoho sa počíta.'}};
      z.onclick=go;z.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  }
  draw()}}


const sw=c=>`<svg viewBox="0 0 60 40" aria-hidden="true"><rect x="4" y="4" width="52" height="32" rx="8" fill="${c}" stroke="#213A5C" stroke-width="2"/></svg>`;
const big=e=>`<div class="bigemo">${e}</div>`;

const ZC={cervena:'#D62828',modra:'#1D5FC4',zelena:'#2A9D4B',zlta:'#F2C200'};
const ZN={cervena:'červenej',modra:'modrej',zelena:'zelenej',zlta:'žltej'};
function znacka(type,col,{line=false,size=''}={}){const c=line?'#fff':(ZC[col]||col);const st='stroke="#111" stroke-width="1.6"';let m='';

/* ---------- contour engine ---------- */
const TER={
 kopec:(x,y)=>{const sx=x<.42?.2:.085;return 60+840*Math.exp(-(((x-.42)/sx)**2+((y-.5)/.24)**2)/2)},
 dva:(x,y)=>80+720*Math.exp(-(((x-.3)/.13)**2+((y-.52)/.18)**2)/2)+560*Math.exp(-(((x-.72)/.12)**2+((y-.45)/.16)**2)/2),
 udolie:(x,y)=>140+1100*Math.abs(x-.5)**1.4+320*(1-y),
 plosina:(x,y)=>{const r=Math.hypot((x-.5)/1.35,(y-.5));return 110+620/(1+Math.exp((r-.27)/.022))},
 rovina:(x,y)=>130+190*x+15*Math.sin(y*4)};
const TNAME={kopec:'vrch',dva:'dva vrchy so sedlom',udolie:'údolie',plosina:'plošina',rovina:'rovina'};
function contourPath(f,L,W,H,nx=72,ny=48){let d='';const gx=W/nx,gy=H/ny;const z=[];for(let j=0;j<=ny;j++){z[j]=[];for(let i=0;i<=nx;i++)z[j][i]=f(i/nx,j/ny)}
  const ip=(a,b,za,zb)=>a+(b-a)*((L-za)/(zb-za));
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=z[j][i],b=z[j][i+1],c=z[j+1][i+1],e=z[j+1][i];const x=i*gx,y=j*gy;
    const pts=[];if((a<L)!==(b<L))pts.push([ip(x,x+gx,a,b),y]);if((b<L)!==(c<L))pts.push([x+gx,ip(y,y+gy,b,c)]);if((e<L)!==(c<L))pts.push([ip(x,x+gx,e,c),y+gy]);if((a<L)!==(e<L))pts.push([x,ip(y,y+gy,a,e)]);
    for(let k=0;k+1<pts.length;k+=2)d+=`M${pts[k][0].toFixed(1)} ${pts[k][1].toFixed(1)}L${pts[k+1][0].toFixed(1)} ${pts[k+1][1].toFixed(1)}`}
  return d}
function contourSVG(t,{W=360,H=240,step=100,water=null,labels=true,pts=null,line=false,river=true,bg=true}={}){const f=TER[t];let s=`<svg class="scene" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vrstevnicová mapa">${bg?`<rect width="${W}" height="${H}" fill="${line?'#fff':'#FBF7EC'}" stroke="#ccc"/>`:''}`;
  for(let L=step;L<1000;L+=step){const d=contourPath(f,L,W,H);if(d)s+=`<path d="${d}" fill="none" stroke="${line?'#333':(water&&L===water?'#1D5FC4':'#A0602D')}" stroke-width="${water&&L===water?3:(L%500===0?2:1.1)}"/>`}
  if(river&&t==='udolie')s+=`<path d="M${W/2} 0V${H}" stroke="#1D5FC4" stroke-width="3" stroke-dasharray="${line?'6 4':''}"/><path d="M${W/2-7} ${H-24}l7 12 7-12" fill="none" stroke="#1D5FC4" stroke-width="2.5"/>`;
  if(labels){if(t==='kopec')s+=`<path d="M${.42*W} ${.5*H-6}l5 8h-10z" fill="#1B2A41"/><text x="${.42*W+8}" y="${.5*H-6}" font-size="12" font-weight="700">900</text>`;
   if(t==='dva')s+=`<path d="M${.3*W} ${.52*H-6}l5 8h-10z" fill="#1B2A41"/><text x="${.3*W+8}" y="${.52*H-6}" font-size="12" font-weight="700">800</text><path d="M${.72*W} ${.45*H-6}l5 8h-10z" fill="#1B2A41"/><text x="${.72*W+8}" y="${.45*H-6}" font-size="12" font-weight="700">640</text>`}
  if(pts)pts.forEach(([n,x,y])=>{s+=`<circle cx="${x*W}" cy="${y*H}" r="7" fill="#D62828" stroke="#fff" stroke-width="2"/><text x="${x*W+10}" y="${y*H+5}" font-size="15" font-weight="800" fill="#D62828" paint-order="stroke" stroke="#fff" stroke-width="3">${n}</text>`});
  return s+'</svg>'}
function profileSVG(t,{W=360,H=130,water=null,mini=false}={}){const f=TER[t];const yv=t==='udolie'?.75:.5;let p=`M0 ${H}`;for(let i=0;i<=90;i++){const x=i/90;const z=f(x,yv);p+=`L${(x*W).toFixed(1)} ${(H-z/1000*(H-10)).toFixed(1)}`}p+=`L${W} ${H}Z`;
  let s=`<svg class="scene" viewBox="0 0 ${W} ${H}" role="img" aria-label="Profil terénu"><rect width="${W}" height="${H}" fill="#EAF4FB"/>`;
  if(water!=null){const wy=H-water/1000*(H-10);s+=`<rect x="0" y="${wy}" width="${W}" height="${H-wy}" fill="#5BA8DE" opacity=".75"/>`}
  s+=`<path d="${p}" fill="#B98A5E" stroke="#6E4527" stroke-width="2" ${water!=null?'opacity=".92"':''}/>`;
  if(water!=null){const wy=H-water/1000*(H-10);s+=`<path d="M0 ${wy}H${W}" stroke="#1D5FC4" stroke-width="2" stroke-dasharray="6 4"/><text x="6" y="${wy-5}" font-size="12" font-weight="800" fill="#1D5FC4">${water} m</text>`}
  if(!mini)[200,400,600,800].forEach(v=>{const y=H-v/1000*(H-10);s+=`<path d="M${W-30} ${y}H${W}" stroke="#555"/><text x="${W-32}" y="${y+4}" font-size="10" text-anchor="end" fill="#555">${v}</text>`});
  return s+'</svg>'}

    <div class="row"><button class="btn sun" id="exNext">Rozumiem, ďalej</button></div>${dotsHTML(pn,pi)}`;
  function update(){$('#pf',el).innerHTML=profileSVG(t,{water:w});$('#ct',el).innerHTML=contourSVG(t,{water:w,bg:false});$('#wlt',el).innerHTML=`Hladina vody: <b>${w} m n. m.</b>`;
    const cv=$('#cv',el),ctx=cv.getContext('2d'),f=TER[t];const im=ctx.createImageData(360,240);
    const land=[[159,208,138],[176,214,140],[214,214,150],[230,212,155],[222,190,130],[205,165,110],[185,140,95],[165,118,80],[145,98,66],[125,82,55]];
    for(let j=0;j<240;j++)for(let i=0;i<360;i++){const z=f(i/360,j/240);const k=(j*360+i)*4;const col=z<w?[91,168,222]:land[Math.min(9,Math.floor(z/100))];im.data[k]=col[0];im.data[k+1]=col[1];im.data[k+2]=col[2];im.data[k+3]=z<w?235:170}
    ctx.putImageData(im,0,0);$$('[data-t]',el).forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t))}
  $$('[data-t]',el).forEach(b=>b.onclick=()=>{t=b.dataset.t;update();say(TNAME[t])});
  $('#wl',el).oninput=e=>{w=+e.target.value;update()};
  $('#exNext',el).onclick=next;update()}

  {q:bl(2)+'Prečo majú jadrové pohoria „jadro“ a „obal“?',o:[{t:'staré kryštalinikum je prekryté mladšími usadenými horninami a príkrovmi',ok:1},{t:'sú to vyhasnuté sopky'},{t:'vznikli usadením piesku'}]},
  {q:bl(3)+'V ktorom regióne by si hľadal ložiská magnezitu?',o:[{t:'na Gemeri (Jelšava, Hnúšťa)',ok:1},{t:'na Záhorí'},{t:'na Podunajskej nížine'}]},

  {q:bl(2)+'Ktorá charakteristika patrí k socioekonomickej polohe?',o:[{t:'členstvo v eurozóne a schengenskom priestore',ok:1},{t:'poloha v miernom pásme'},{t:'odvodňovanie Dunajom'}]}],
  2:[
  {q:bl(4)+'Prečo sú ložiská nerastných surovín na Slovensku početné, ale väčšinou malé?',o:[{t:'zložitá geologická stavba s mnohými jednotkami a tektonickým porušením',ok:1},{t:'Slovensko je malé'},{t:'suroviny sa už všetky vyťažili'}],e:'Príkrovová stavba a rôznorodé horniny vytvárajú pestré, ale rozdrobené ložiská.'},
  {q:bl(5)+'Ktorý argument najlepšie hodnotí vnútrozemskú polohu pre priemysel?',o:[{t:'nevýhodu bez prístavu kompenzuje blízkosť trhov EÚ a koridory TEN-T',ok:1},{t:'vnútrozemská poloha je vždy nevýhodou'},{t:'poloha nemá na priemysel vplyv'}]},
  {q:bl(4)+'Prečo je južné Slovensko seizmicky aktívnejšie ako sever?',o:[{t:'leží na okraji Panónskej panvy s aktívnymi zlomami',ok:1},{t:'je tam viac sopiek'},{t:'je tam viac flyšu'}]},
  {q:bl(3)+'Rozdiel zemepisnej dĺžky medzi krajnými bodmi je 5,73°. O koľko sa líši miestny slnečný čas?',o:[{t:'asi o 23 minút',ok:1},{t:'asi o 6 minút'},{t:'asi o 57 minút'}],e:'5,73 × 4 min ≈ 22,9 min.'},
  {q:bl(5)+'Ktorý zdroj je najvhodnejší na posúdenie zosuvného rizika pri plánovanej stavbe?',o:[{t:'inžinierskogeologická mapa a register svahových deformácií ŠGÚDŠ',ok:1},{t:'turistická mapa'},{t:'satelitná fotka bez údajov'}]}]},
 act:(el,lv)=>runParts(el,[
   dynRounds([
    {t:bl(4)+'Analyzuj mapu geologických pásiem. Ktoré tvrdenie z nej vyplýva?',img:()=>geoMap(),o:[{t:'pásma sú usporiadané v oblúku zo severu na juh: flyš – bradlá – jadrové pohoria – rudohorie – neovulkanity/panva',ok:1},{t:'sopečné pohoria tvoria severnú hranicu'},{t:'nížiny ležia na severe'}]},
    {t:bl(4)+'Priblížený sever: čo oddeľuje Vonkajšie a Vnútorné Karpaty?',img:()=>geoMap({zoom:true}),o:[{t:'bradlové pásmo',ok:1},{t:'Slovenské rudohorie'},{t:'Dunaj'}]}]),
   dynSort({t:bl(3)+'Priraď pohorie ku geologickej jednotke.',bins:[['f','flyšové pásmo','🧱'],['j','jadrové pohorie','🪨'],['n','neovulkanity','🌋'],['r','Slovenské rudohorie','⛏️']],items:[['⛰️','Javorníky','f'],['⛰️','Bukovské vrchy','f'],['⛰️','Malá Fatra','j'],['⛰️','Tribeč','j'],['⛰️','Kremnické vrchy','n'],['⛰️','Vihorlatské vrchy','n'],['⛰️','Volovské vrchy','r'],['⛰️','Stolické vrchy','r']]}),
   dynSort({t:bl(2)+'Do ktorej dimenzie polohy patrí charakteristika?',bins:[['m','matematickogeografická','📐'],['f','fyzickogeografická','⛰️'],['s','socioekonomická','🏛️']],items:[['🕐','pásmový čas UTC+1','m'],['🌊','povodie Dunaja','f'],['🇪🇺','eurozóna','s'],['🌐','47°44′ – 49°37′ s. š.','m'],['🛤️','koridory TEN-T','s'],['⛰️','Západné Karpaty','f']]})],'Analýza polohy a geológie je hotová!'),
 argue:(el,lv)=>runArgue(el,[
   evidence({b:5,claim:'Poloha Slovenska je výhodná pre automobilový priemysel.',items:[['🛣️','Diaľnice D1 a D2 sú súčasťou transeurópskych koridorov.','p'],['🇪🇺','Slovensko je v jednotnom trhu EÚ a eurozóne.','p'],['⚓','Slovensko nemá vlastný námorný prístav.','v'],['🏔️','Na severe Slovenska sú vysoké pohoria.','n'],['👷','V okruhu 300 km sú desiatky dodávateľov automobilového priemyslu.','p'],['💶','Krajina musí dovážať takmer všetku ropu a plyn.','v']]}),
   openTask({b:5,key:'poloha',t:'Zhodnoť socioekonomickú polohu Slovenska: uveď dve výhody, dve nevýhody a záver, či prevažujú výhody. Opri sa o konkrétne fakty.',
     model:'Výhody: (1) poloha v strede jednotného trhu EÚ, blízko Viedne, Budapešti, Prahy a Krakova a na koridoroch TEN-T – lacnejšia logistika a prístup k zákazníkom; (2) členstvo v eurozóne a schengenskom priestore odstraňuje kurzové riziko a hraničné kontroly. Nevýhody: (1) vnútrozemská poloha – závislosť od prístavov iných štátov a potrubí pri dovoze surovín; (2) hornatý reliéf zdražuje dopravné prepojenie západ – východ, čo prispieva k regionálnym rozdielom. Záver: pre priemysel a služby výhody prevažujú, nevýhody sa prejavujú najmä v energetickej závislosti a v zaostávaní východných regiónov.',
     rubric:['Uviedol/a som aspoň dve výhody s konkrétnym faktom.','Uviedol/a som aspoň dve nevýhody s konkrétnym faktom.','Použil/a som pojmy (koridor, jednotný trh, vnútrozemský štát…).','Sformuloval/a som zdôvodnený záver.']}),
   ...(lv===2?[openTask({b:6,key:'geohazard',t:'Navrhni postup, ako by obec vo flyšovom pásme mala posúdiť zosuvné riziko pred vymedzením novej stavebnej zóny. Uveď zdroje údajov a kroky.',
     model:'1) Zistiť geologickú stavbu a registrované svahové deformácie (mapový portál ŠGÚDŠ, Atlas máp stability svahov). 2) Analyzovať sklon svahu (ZBGIS, digitálny model reliéfu), odtok vody a historické zosuvy (kronika, staré ortofotomapy). 3) Objednať inžinierskogeologický prieskum (vrty, monitoring). 4) Vylúčiť rizikové plochy v územnom pláne, navrhnúť odvodnenie a obmedziť výruby. 5) Informovať obyvateľov a zaviesť monitoring.',
     rubric:['Postup má logické poradie krokov.','Uviedol/a som konkrétne zdroje údajov.','Prepojil/a som geologickú stavbu flyšu so vznikom zosuvov.','Navrhol/navrhla som preventívne opatrenia.']})]:[])]),
 sheet:lv=>sheetHead('Poloha a geologická stavba',lv)+`<p><b>1.</b> Vyznač geologické pásma (flyš, bradlá, jadrové pohoria, rudohorie, neovulkanity, panva) a dopíš po dva príklady pohorí.</p>${physMap({line:true,cities:[],rivers:['dunaj','vah','hron'],relief:false,extra:`<path d="${FLYS.flys}" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4"/>`})}
  <p><b>2.</b> Zhodnotenie socioekonomickej polohy (tvoja odpoveď):</p>${savedAns('poloha')}`},

relief:{icon:'⛰️',badge:'Geomorfológ',
 question:'Ktoré procesy vytvorili reliéf Slovenska a ako ho systematicky členíme?',
 cp:'Tvorba reliéfu endogénnymi a exogénnymi procesmi, typy reliéfu, geomorfologické členenie, geomorfologické celky; príklady Súľovské skaly, Slovenský raj, Šomoška, Záhorská nížina; identifikovať celky v miestnej krajine.',
 text:[
  {h:'Endogénne procesy',p:`${g('endo','Endogénne procesy')} vytvorili základnú mozaiku: vrásnenie a presuny príkrovov, neskôr hlavne <b>zlomová tektonika</b>. Jadrové pohoria sa vyzdvihli ako ${g('hrast','hraste')}, vnútrohorské kotliny poklesli ako ${g('priekopa','tektonické priekopy')} – preto sa na Slovensku striedajú pohoria a kotliny. V treťohorách vznikli sopečné pohoria (andezity – Štiavnické vrchy, čadiče – Cerová vrchovina so Šomoškou).`},
  {h:'Exogénne procesy',p:`${g('exo','Exogénne procesy')} reliéf dotvárajú: <b>fluviálne</b> (riečne doliny, terasy, nivy, prielomy), <b>glaciálne</b> (ľadovcové doliny tvaru U, kary, morény a plesá v Tatrách, menej v Nízkych Tatrách), <b>krasové</b> (jaskyne, priepasti, škrapy, tiesňavy – Slovenský kras, Slovenský raj), <b>eolické</b> (viate piesky a presypy Záhorskej nížiny), <b>svahové</b> (zosuvy vo flyši) a <b>zvetrávanie</b> (skalné mesto Súľovských skál v zlepencoch). Rastie aj vplyv <b>antropogénnych</b> procesov (lomy, haldy, násypy).`},
  {h:'Typy reliéfu',p:`Podľa ${g('clenitost','výškovej členitosti')} rozlišujeme roviny, pahorkatiny, vrchoviny, hornatiny a veľhornatiny (Tatry). Slovensko je výrazne vertikálne členité – rozdiel medzi najnižším bodom (Klin nad Bodrogom, 94 m) a Gerlachovským štítom (2 655 m) je viac ako 2,5 km na malej rozlohe, čo sa odráža v podnebí, vodách, pôdach aj osídlení.`},
  {h:'Geomorfologické členenie',p:`Hierarchia (Mazúr – Lukniš): sústava → podsústava (Karpaty, Panónska panva) → provincia (Západné Karpaty, Východné Karpaty, Západopanónska panva, Východopanónska panva) → subprovincia (napr. Vnútorné Západné Karpaty, Vonkajšie Západné Karpaty, Malá Dunajská kotlina, Viedenská kotlina, Veľká Dunajská kotlina) → oblasť (napr. Fatransko-tatranská, Slovenské stredohorie, Lučensko-košická zníženina, Podunajská nížina, Záhorská nížina, Východoslovenská nížina) → <b>geomorfologický celok</b> → podcelok → časť.`},
  {h:'Pre maturantov: reliéf a človek',lv:2,p:`Reliéf ovplyvňuje hustotu osídlenia (kotliny a nížiny), dopravné koridory (Považie, Podtatranská kotlina), poľnohospodárske využitie aj riziká (povodne v nivách, zosuvy). Pri charakteristike regiónu na maturite vždy prepájaj typ reliéfu s jeho dôsledkami pre ostatné zložky krajiny a pre človeka.`}],
 fact:'Šomoška na hranici s Maďarskom má jedinečný „kamenný vodopád“ – zvislé čadičové stĺpce, ktoré sa pri chladnutí lávy prehli do oblúka.',
 trip:'Identifikuj geomorfologický celok, podcelok a oblasť, v ktorej leží tvoja obec, a nájdi v okolí aspoň jeden tvar vytvorený endogénnym a jeden exogénnym procesom.',
 check:{1:['[2] Rozlíšim endogénne a exogénne procesy.','[3] Priradím typické tvary k procesom na príkladoch zo Slovenska.','[1] Poznám hierarchiu geomorfologického členenia.','[4] Dokážem analyzovať, prečo sa striedajú pohoria a kotliny.'],2:['[3] Zaradím miestnu krajinu do geomorfologického členenia.','[5] Zhodnotím vplyv reliéfu na osídlenie a dopravu.']},
 teacher:{ciele:['vysvetliť endogénne a exogénne procesy na príkladoch zo Slovenska','priradiť tvary reliéfu k procesom (Súľovské skaly, Slovenský raj, Šomoška, Záhorská nížina, Tatry)','zaradiť celky do geomorfologického členenia','zhodnotiť vplyv reliéfu na človeka (Maturita)'],
  svp:'Cieľové požiadavky na maturitu: opísať geomorfologické procesy, ktoré modelovali reliéf Slovenska, a podľa mapy na konkrétnych príkladoch charakterizovať ich vplyv; identifikovať geomorfologické celky v miestnej krajine.',
  tipy:['Geomorfologické členenie overte podľa aktuálnej mapy geomorfologických jednotiek (Atlas krajiny SR, lepsiageografia.sk).','Úloha na hierarchiu (zoraďovanie) je vhodná aj ako opakovanie na začiatku hodiny.']},
 quiz:{1:[
  {q:bl(2)+'Ktorý proces vytvoril viate piesky Záhorskej nížiny?',o:[{t:'eolický (vietor)',ok:1},{t:'glaciálny'},{t:'vulkanický'}]},
  {q:bl(2)+'Prečo sa na Slovensku striedajú pohoria a kotliny?',o:[{t:'zlomová tektonika – hraste sa dvíhali, priekopy poklesávali',ok:1},{t:'vietor odvial časť hôr'},{t:'všetky kotliny sú krátery sopiek'}],e:'Jadrové pohoria sú hraste, vnútrohorské kotliny tektonické priekopy.'},
  {q:bl(3)+'Ktorý tvar je výsledkom glaciálnych procesov?',o:[{t:'kar s plesom v Tatrách',ok:1},{t:'Súľovské skaly'},{t:'Zádielska tiesňava'}]},
  {q:bl(1)+'Do ktorej subprovincie patrí Východoslovenská nížina?',o:[{t:'Veľká Dunajská kotlina',ok:1},{t:'Malá Dunajská kotlina'},{t:'Vnútorné Západné Karpaty'}]},
  {q:bl(4)+'Šomoška a Štiavnické vrchy majú spoločné…',o:[{t:'sopečný pôvod',ok:1},{t:'krasový pôvod'},{t:'ľadovcový pôvod'}]}],
  2:[
  {q:bl(4)+'Prečo sú Súľovské skaly skalným mestom?',o:[{t:'nerovnomerné zvetrávanie a erózia zlepencov s rôzne odolnými vrstvami',ok:1},{t:'vyhasnutá sopka'},{t:'činnosť ľadovca'}]},
  {q:bl(1)+'Ktorá jednotka je v hierarchii hneď nad geomorfologickým celkom?',o:[{t:'oblasť',ok:1},{t:'subprovincia'},{t:'podcelok'}]},
  {q:bl(5)+'Ktorý záver o vplyve reliéfu na dopravu je najlepšie zdôvodnený?',o:[{t:'hlavné koridory sledujú doliny a kotliny (Považie, Podtatranská kotlina), lebo tam je menší sklon a menej tunelov',ok:1},{t:'reliéf dopravu neovplyvňuje'},{t:'diaľnice sa stavajú po hrebeňoch'}]},
  {q:bl(3)+'Výškový rozdiel na ploche 4 km² je 520 m. O aký typ reliéfu ide?',o:[{t:'o hornatinu',ok:1},{t:'o rovinu'},{t:'o pahorkatinu'}],e:'Vysoká výšková členitosť (stovky metrov) charakterizuje hornatiny; roviny a pahorkatiny majú rozdiely do desiatok, maximálne nižších stoviek metrov.'},
  {q:bl(4)+'Do ktorej provincie patria Vihorlatské vrchy?',o:[{t:'Východné Karpaty',ok:1},{t:'Západné Karpaty'},{t:'Východopanónska panva'}]}]},
 act:(el,lv)=>runParts(el,[
   orderCards({t:bl(1)+'Zoraď jednotky geomorfologického členenia od najväčšej po najmenšiu (príklad: Tatry).',cards:[['🌍','sústava'],['🏔️','podsústava'],['🗺️','provincia'],['📍','subprovincia'],['🧩','oblasť'],['⛰️','celok'],['▫️','podcelok']],done:'Sústava → podsústava → provincia → subprovincia → oblasť → celok → podcelok.'}),
   dynSort({t:bl(3)+'Ktorý proces vytvoril daný tvar?',bins:[['endo','endogénny','🌋'],['exo','exogénny','💨']],items:Object.values(LAND).map(([n,e,d,t])=>[e,`${n}: ${d}`,t]).concat([['🪨','vyzdvihnutý hrasť Tribeča','endo'],['〰️','zosuv svahu na Kysuciach','exo']])}),
   dynRounds([
    {t:bl(4)+'Pozri sa na hierarchiu. Ktoré tvrdenie je správne?',img:hierarchy(),o:[{t:'Tatry sú celok Fatransko-tatranskej oblasti Vnútorných Západných Karpát',ok:1},{t:'Tatry patria do Panónskej panvy'},{t:'Fatransko-tatranská oblasť je provincia'}]},
    ...(lv===2?[{t:bl(4)+'Podunajská nížina, Záhorská nížina a Východoslovenská nížina: ktorá patrí do Východopanónskej panvy?',o:[{t:'Východoslovenská nížina',ok:1},{t:'Podunajská nížina'},{t:'Záhorská nížina'}],why:'Patrí do subprovincie Veľká Dunajská kotlina, ostatné dve do Západopanónskej panvy.'}]:[])])],'Geomorfológiu Slovenska ovládaš!'),
 argue:(el,lv)=>runArgue(el,[
   openTask({b:4,key:'proces',t:'Vyber dve lokality (Súľovské skaly, Slovenský raj, Šomoška, Záhorská nížina, Tatry) a pre každú analyzuj: horninu, rozhodujúci proces a vzniknuté tvary. Porovnaj ich.',
     model:'Súľovské skaly: zlepence (zlepené valúny) – nerovnomerné zvetrávanie a erózia vytvorili skalné veže, brány a okná (skalné mesto). Šomoška: čadič – treťohorná láva pri chladnutí puká na šesťboké stĺpy (endogénny pôvod, exogénne odkrytie). Porovnanie: obe lokality sú skalné útvary, ale v Súľove rozhoduje odolnosť vrstiev voči zvetrávaniu, kým na Šomoške vulkanický pôvod a chladnutie lávy; Súľov je výsledkom exogénnych, Šomoška najmä endogénnych procesov.',
     rubric:['Pre obe lokality som uviedol/a horninu.','Pomenoval/a som rozhodujúci proces (endo/exo).','Opísal/a som typické tvary.','Porovnal/a som lokality – spoločné a rozdielne.']}),
   openTask({b:lv===2?6:3,key:'miestna',t:lv===2?'Vytvor komplexnú geomorfologickú charakteristiku miestnej krajiny: zaradenie do členenia, typ reliéfu, procesy, tvary a vplyv na osídlenie a dopravu.':'Zaraď svoju obec do geomorfologického členenia (provincia, subprovincia, oblasť, celok) a opíš typ reliéfu v okolí.',
     model:'Príklad – Michalovce: Východopanónska panva → Veľká Dunajská kotlina → Východoslovenská nížina → celok Východoslovenská rovina (resp. pahorkatina podľa polohy). Typ reliéfu: rovina až pahorkatina s nízkou výškovou členitosťou; procesy: akumulácia riek (Laborec, Ondava) – nivy, terasy, mŕtve ramená; na severe kontakt so sopečnými Vihorlatskými vrchmi. Vplyv: rovinatý terén umožnil rozvoj poľnohospodárstva, vodnej nádrže (Zemplínska šírava) a ciest; riziko záplav v nivách.',
     rubric:['Zaradenie má správne poradie úrovní.','Určil/a som typ reliéfu podľa členitosti.','Uviedol/a som aspoň dva procesy a tvary.',lv===2?'Zhodnotil/a som vplyv reliéfu na osídlenie a dopravu.':'Použil/a som mapový zdroj (atlas, ZBGIS).']})]),
 sheet:lv=>sheetHead('Reliéf a geomorfologické členenie',lv)+`<p><b>1.</b> Doplň hierarchiu pre svoju obec: sústava ________ podsústava ________ provincia ________ subprovincia ________ oblasť ________ celok ________</p>
  <p><b>2.</b> Tabuľka: lokalita – hornina – proces – tvary (Súľovské skaly, Slovenský raj, Šomoška, Záhorská nížina, Tatry).</p><table style="width:100%;border-collapse:collapse;font-size:13px"><tr>${['lokalita','hornina','proces','tvary'].map(h=>`<th style="border:1px solid #111;padding:4px">${h}</th>`).join('')}</tr>${Object.values(LAND).map(([n])=>`<tr><td style="border:1px solid #111;padding:6px">${n}</td><td style="border:1px solid #111"></td><td style="border:1px solid #111"></td><td style="border:1px solid #111"></td></tr>`).join('')}</table>
  <p><b>3.</b> Tvoja analýza lokalít:</p>${savedAns('proces')}`},

atmo:{icon:'🌦️',badge:'Klimatológ a hydrológ',
 question:'Čo podmieňuje podnebie a vodstvo Slovenska a ako sa prejavuje vertikálna členitosť?',
 cp:'Klimatotvorné činitele, prúdenie vzduchových hmôt, polárny front, cyklóny, anticyklóny, teplota, zrážky, teplotný gradient, inverzia, klimatické diagramy, podnebné oblasti; vodstvo, riečna sieť, odtokový režim. Zaradiť miestnu krajinu do podnebnej oblasti.',
 text:[
  {h:'Cirkulácia atmosféry',p:`Slovensko leží v miernom pásme so ${g('front','západným prúdením')} na polárnom fronte. Striedajú sa ${g('vzdhm','vzduchové hmoty')} – vlhká polárna morská od Atlantiku (leto chladnejšie a daždivé, zima miernejšia), suchá polárna kontinentálna z východu (mrazivé zimy, horúce letá), občas arktická a tropická. Počasie riadia ${g('cyklona','cyklóny a anticyklóny')} – v zime často Sibírska anticyklóna, v lete Azorská.`},
  {h:'Klimatotvorné činitele a gradient',p:`Rozhodujúca je <b>nadmorská výška</b>: ${g('gradient','teplotný gradient')} vo voľnej atmosfére je asi 0,6 °C/100 m, zrážky s výškou rastú. Uplatňuje sa <b>reliéf</b> – návetrie a záveterie (zrážkový tieň, miestne ${g('fen','fény')}), <b>expozícia</b> svahov a ${g('inverzia','teplotné inverzie')} v kotlinách v chladnom polroku. Na juhu a juhovýchode rastie kontinentalita.`},
  {h:'Klimatické oblasti',p:`Používané členenie: <b>teplá oblasť</b> – v priemere 50 a viac letných dní (Tmax ≥ 25 °C) za rok (nížiny); <b>mierne teplá</b> – menej ako 50 letných dní a priemerná júlová teplota 16 °C a viac (pahorkatiny, kotliny); <b>chladná</b> – priemerná júlová teplota pod 16 °C (horské polohy). Ďalej sa členia na okrsky podľa vlahovej bilancie a zím. ${g('klimdiag','Klimatický diagram')} je základný nástroj ich porovnania.`},
  {h:'Vodstvo a odtokový režim',p:`Riečnu sieť určuje reliéf: rieky pramenia v horách, tečú kotlinami a dolinami a v nížinách sa meandrujú. ${g('odtrezim','Odtokový režim')}: <b>vysokohorský</b> (maximum máj – jún z topenia snehu, Tatry), <b>stredohorský</b> (maximum marec – apríl), <b>vrchovinovo-nížinný</b> (maximum február – marec), minimum spravidla koncom leta a na jeseň. ${g('spodt','Špecifický odtok')} je najvyšší v Tatrách a najnižší na nížinách. Najväčšiu zásobu podzemnej vody má Žitný ostrov, významné sú minerálne a geotermálne vody.`},
  {h:'Pre maturantov: klíma a voda v zmene',lv:2,p:`Dlhodobé merania SHMÚ ukazujú zvyšovanie priemernej teploty, viac tropických dní a nerovnomernejšie zrážky – dlhšie suchá aj prívalové dažde. To mení odtokový režim (menej snehu → plochšie jarné maximum), zvyšuje riziko povodní z prívalových zrážok a tlak na podzemné vody. Adaptácia: zadržiavanie vody v krajine, revitalizácia tokov, ochrana zdrojov pitnej vody.`}],
 fact:'Na Lomnickom štíte sa pri zrážkach meria viac ako dvojnásobok ročného úhrnu Hurbanova – na vzdialenosť niekoľko sto kilometrov a výškový rozdiel 2,5 km sa podnebie mení ako pri ceste zo strednej Európy do subarktídy.',
 trip:'Zaraď svoju obec do klimatickej oblasti. Na stránke SHMÚ porovnaj dlhodobé údaje najbližšej stanice s Hurbanovom a vysvetli rozdiely klimatotvornými činiteľmi.',
 check:{1:['[2] Dokážem vysvetliť klimatotvorné činitele Slovenska.','[3] Viem použiť teplotný gradient vo výpočte.','[4] Dokážem analyzovať a porovnať klimatické diagramy.','[2] Rozlíšim typy odtokového režimu.'],2:['[3] Viem vypočítať špecifický odtok.','[5] Dokážem zhodnotiť dôsledky zmeny klímy pre vodný režim.']},
 teacher:{ciele:['vysvetliť cirkuláciu atmosféry a klimatotvorné činitele','analyzovať klimatické diagramy a vymedziť klimatické oblasti','vysvetliť odtokový režim a vypočítať špecifický odtok','zhodnotiť dopady zmeny klímy (Maturita)'],
  svp:'Cieľové požiadavky na maturitu: analyzovať klimatické diagramy; podľa mapy určiť a porovnať podnebné oblasti Slovenska; zaradiť miestnu krajinu do podnebnej oblasti a charakterizovať jej podnebné špecifiká; vodstvo, riečna sieť, odtokový režim.',
  tipy:['Hodnoty v klimatických diagramoch sú zaokrúhlené približné dlhodobé priemery na ilustráciu – na presnú prácu použite normály SHMÚ.','Krivky odtokového režimu sú modelové (relatívne hodnoty).','Definície klimatických oblastí sa v literatúre uvádzajú s malými rozdielmi – vhodná príležitosť na prácu s viacerými zdrojmi.']},
 quiz:{1:[
  {q:bl(2)+'Prečo sú zimy na západe Slovenska v priemere miernejšie ako na východe?',o:[{t:'silnejší vplyv vlhkého vzduchu od Atlantiku',ok:1},{t:'na západe sú vyššie hory'},{t:'na východe je more'}]},
  {q:bl(3)+'V 300 m n. m. je 14 °C. Akú teplotu očakávaš v 1 800 m pri gradiente 0,6 °C/100 m?',o:[{t:'5 °C',ok:1},{t:'9 °C'},{t:'−4 °C'}],e:'1 500 m × 0,6/100 = 9 °C; 14 − 9 = 5 °C.'},
  {q:bl(4)+'Diagram s júlovou teplotou 7 °C a ročnými zrážkami okolo 1 400 mm patrí…',o:[{t:'vysokohorskej stanici – chladná oblasť',ok:1},{t:'nížinnej stanici – teplá oblasť'},{t:'kotline – mierne teplá oblasť'}]},
  {q:bl(2)+'Kedy má rieka s vysokohorským režimom najvyšší prietok?',o:[{t:'v máji až júni',ok:1},{t:'vo februári'},{t:'v októbri'}]},
  {q:bl(1)+'Ktorá oblasť má priemernú júlovú teplotu pod 16 °C?',o:[{t:'chladná',ok:1},{t:'mierne teplá'},{t:'teplá'}]}],
  2:[
  {q:bl(3)+'Povodie má plochu 2 000 km² a priemerný prietok 30 m³/s. Aký je špecifický odtok?',o:[{t:'15 l·s⁻¹·km⁻²',ok:1},{t:'1,5 l·s⁻¹·km⁻²'},{t:'66 l·s⁻¹·km⁻²'}],e:'30 000 l/s ÷ 2 000 km² = 15 l·s⁻¹·km⁻².'},
  {q:bl(4)+'Prečo je v januári v Poprade často chladnejšie ako na Skalnatom plese?',o:[{t:'teplotná inverzia pri anticyklóne – studený vzduch v kotline',ok:1},{t:'Poprad je vyššie'},{t:'Skalnaté pleso má viac slnka v lete'}]},
  {q:bl(5)+'Ktoré opatrenie najlepšie zmierňuje povodne z prívalových zrážok v malom povodí?',o:[{t:'zadržiavanie vody v krajine (mokrade, remízky, poldre)',ok:1},{t:'betónovanie a narovnanie potoka'},{t:'odlesnenie svahov'}]},
  {q:bl(4)+'Ako zmena klímy mení odtokový režim horských riek?',o:[{t:'menej snehu → nižšie a skoršie jarné maximum, dlhšie letné minimá',ok:1},{t:'viac snehu → vyššie maximum'},{t:'nemení ho'}]},
  {q:bl(2)+'Čo je fén?',o:[{t:'teplý suchý padavý vietor na záveternej strane pohoria',ok:1},{t:'studený vietor z Arktídy'},{t:'búrková cyklóna'}]}]},
 act:(el,lv)=>runParts(el,[
   dynRounds([
    {t:bl(4)+'Porovnaj klimatické diagramy. Ktoré tvrdenie je správne?',img:()=>`<div class="twin">${climDiag(HUR,'Hurbanovo (115 m) – približne')}${climDiag(LOM,'Lomnický štít (2 634 m) – približne')}</div>`,o:[{t:'na Lomnickom štíte je chladnejšie a vlhkejšie; zrážkové maximum je v lete na oboch staniciach',ok:1},{t:'Hurbanovo má viac zrážok'},{t:'teplotné krivky majú opačný priebeh'}]},
    {t:bl(3)+'Do ktorej klimatickej oblasti zaradíš Lomnický štít podľa diagramu?',img:()=>climDiag(LOM,'Lomnický štít – približne'),o:[{t:'chladná – júlová teplota pod 16 °C',ok:1},{t:'mierne teplá'},{t:'teplá'}]},
    {t:bl(4)+'Zaraď krivky odtokových režimov: ktorá zodpovedá Popradu pri Svite (rieka pod Tatrami)?',img:()=>regimes(),o:[{t:'vysokohorský – maximum v máji až júni',ok:1},{t:'nížinný – maximum vo februári'},{t:'stredohorský – maximum v marci'}]}]),
   ...(lv===2?[dynRounds([
    {t:bl(4)+'Graf inverzie: v Poprade (690 m) je −14 °C, na Skalnatom plese (1 780 m) −6 °C. Aký je „gradient“ a čo znamená?',img:()=>inversion(),o:[{t:'teplota s výškou stúpa asi o 0,7 °C/100 m – inverzia',ok:1},{t:'normálny pokles 0,6 °C/100 m'},{t:'žiadna zmena'}]}])]:[])],'Atmosféru a hydrosféru analyzuješ ako odborník!'),
 argue:(el,lv)=>runArgue(el,[
   openTask({b:lv===2?5:3,key:'miestneklima',t:'Zaraď miestnu krajinu do klimatickej oblasti a charakterizuj jej podnebné špecifiká počas roka (teplota, zrážky, sneh, inverzie, vietor). Vysvetli ich klimatotvornými činiteľmi.',
     model:'Príklad – Michalovce (Východoslovenská nížina, asi 115 m): teplá oblasť – viac ako 50 letných dní ročne, teplé letá s búrkami, zimy chladnejšie ako na západe pre vplyv kontinentálneho vzduchu a Sibírskej anticyklóny; snehová pokrývka nestála, zrážky okolo 600 mm s letným maximom. Pri Vihorlatských vrchoch rastú zrážky a klesá teplota (nadmorská výška, návetrie). Zemplínska šírava zmierňuje teplotné extrémy v bezprostrednom okolí.',
     rubric:['Správne som určil/a klimatickú oblasť a zdôvodnil/a ju kritériom.','Opísal/a som chod počasia počas roka.','Vysvetlil/a som aspoň dva klimatotvorné činitele.','Použil/a som údaje (stanica, mapa, SHMÚ).']}),
   evidence({b:5,claim:'Zmena klímy zvyšuje riziko sucha aj povodní na Slovensku.',items:[['🌡️','Počet tropických dní v nížinách dlhodobo rastie.','p'],['🌧️','Pribúdajú krátke intenzívne (prívalové) dažde.','p'],['❄️','V jednej zime napadlo výnimočne veľa snehu.','n'],['💧','V lete sa častejšie objavujú nízke prietoky a vysychanie potokov.','p'],['🏔️','Gerlachovský štít je najvyšší vrch Slovenska.','n'],['📉','V niektorých rokoch nie je zrážkový úhrn podpriemerný.','v']]})]),
 sheet:lv=>sheetHead('Podnebie a vodstvo',lv)+`<p><b>1.</b> Zostroj klimatický diagram stanice podľa údajov SHMÚ (teplota – krivka, zrážky – stĺpce):</p>${grid(170)}
  <p><b>2.</b> Výpočty: teplota vo výške ______ m pri ______ °C v ______ m: ______ °C. ${lv===2?'Špecifický odtok: Q = ____ m³/s, A = ____ km², q = ____ l·s⁻¹·km⁻².':''}</p><p><b>3.</b> Charakteristika podnebia miestnej krajiny:</p>${savedAns('miestneklima')}`},

pedo:{icon:'🌿',badge:'Krajinný ekológ',
 question:'Ako sa s nadmorskou výškou menia pôdy a bióta a ako vyvažujeme ochranu prírody s využívaním krajiny?',
 cp:'Pedosféra Slovenska, vertikálna zonálnosť pôd; rozmiestnenie rastlinstva a živočíšstva podľa fyzickogeografických pomerov; ochrana ekosystémov; kritériá vyčlenenia fyzickogeografických regiónov.',
 text:[
  {h:'Vertikálna zonálnosť pôd',p:`Pôdy sa na Slovensku menia najmä s výškou – hovoríme o ${g('zonal','vertikálnej zonálnosti')}. Nížiny: <b>černozeme</b> a <b>čiernice</b> (najúrodnejšie, na spraši), pahorkatiny: <b>hnedozeme</b> a <b>luvizeme</b>, vrchoviny a hornatiny: <b>kambizeme</b> (najrozšírenejšie), najvyššie polohy: <b>podzoly</b>, <b>rankre</b> a <b>litozeme</b>. Mimo zonálnosti sú ${g('intrazon','intrazonálne pôdy')}: fluvizeme v nivách, gleje na zamokrených miestach, rendziny na vápencoch, organozeme v rašeliniskách.`},
  {h:'Vegetácia a fauna',p:`Lesná vegetácia sa člení na ${g('vegst','vegetačné stupne')} – od dubového v nížinách po subniválny v najvyšších častiach Tatier. Pôvodné nížinné lesy nahradili polia, zachovali sa lužné lesy pri Dunaji a Morave. Fauna je zmesou panónskych (stepných), karpatských a horských druhov; vyskytujú sa veľké šelmy (medveď, vlk, rys) a ${g('endemit','endemity')} (kamzík a svišť vrchovský tatranský).`},
  {h:'Ochrana prírody',p:`Zákon o ochrane prírody a krajiny rozlišuje päť stupňov ochrany. Veľkoplošné chránené územia: 9 národných parkov a 14 chránených krajinných oblastí; maloplošné: rezervácie, prírodné pamiatky, chránené areály. Sieť Natura 2000 tvoria chránené vtáčie územia a územia európskeho významu. Na Slovensku sú 4 ${g('biosfrez','biosférické rezervácie')} UNESCO (Poľana, Slovenský kras, Východné Karpaty, Tatry) a viacero ${g('ramsar','ramsarských lokalít')}.`},
  {h:'Fyzickogeografické regióny',p:`Fyzickogeografické regióny vymedzujeme podľa <b>kritéria</b>, ktoré najlepšie vystihuje rozdiely krajiny – najčastejšie podľa reliéfu (geomorfologické jednotky), ktorý podmieňuje podnebie, vody, pôdy aj biotu. Možné sú aj regióny podľa klímy, pôd či vegetácie. Pri každej regionalizácii treba kritérium jasne pomenovať a zdôvodniť.`},
  {h:'Pre maturantov: konflikt ochrany a využívania',lv:2,p:`Typický konflikt: lesná kalamita v národnom parku. Jeden prístup presadzuje <b>bezzásahový režim</b> (príroda sa obnoví sama, vzniká biodiverzita), druhý <b>spracovanie kalamity</b> (ochrana okolitých hospodárskych lesov pred podkôrnym hmyzom, ekonomické záujmy vlastníkov). Rozhodnutia sa opierajú o zonáciu, vedecký monitoring a právne pravidlá – a vyžadujú vyvážiť ekologické, ekonomické a sociálne hľadisko.`}],
 fact:'Prales Stužica v Bukovských vrchoch patrí k najzachovalejším bukovým pralesom Európy a je súčasťou lokality svetového dedičstva UNESCO Karpatské bukové pralesy.',
 trip:'Na mapovom portáli VÚPOP nájdi pôdny typ v okolí obce a na mape ŠOP SR chránené územia v okolí. Zhodnoť, ako súvisia s reliéfom a využitím krajiny.',
 check:{1:['[2] Dokážem vysvetliť vertikálnu zonálnosť pôd a vegetácie.','[3] Priradím pôdne typy k výškovým stupňom a podmienkam.','[1] Poznám systém ochrany prírody na Slovensku.','[4] Dokážem analyzovať vzťahy medzi reliéfom, klímou, pôdou a biotou.'],2:['[6] Dokážem navrhnúť kritérium fyzickogeografickej regionalizácie.','[5] Dokážem zhodnotiť konflikt ochrany a využívania krajiny z viacerých hľadísk.']},
 teacher:{ciele:['vysvetliť vertikálnu zonálnosť pôd a vegetácie','analyzovať vzťahy zložiek krajiny','charakterizovať systém ochrany prírody','navrhnúť kritérium regionalizácie a zhodnotiť konflikt ochrany a využívania (Maturita)'],
  svp:'Cieľové požiadavky na maturitu: pedosféra Slovenska, vertikálna zonálnosť pôd; analyzovať fyzickogeografické pomery a ich vplyv na rozmiestnenie rastlinstva; porovnať oblasti Slovenska podľa rastlinstva a živočíšstva; určiť kritérium vyčlenenia fyzickogeografických regiónov.',
  tipy:['Zdroje: VÚPOP (pôdne mapy), Štátna ochrana prírody SR (chránené územia), Atlas krajiny SR.','Téma kalamít v NP je spoločensky citlivá – veďte diskusiu ako vyváženú analýzu argumentov.']},
 quiz:{1:[
  {q:bl(2)+'Prečo sú černozeme najúrodnejšie?',o:[{t:'hrubý humusový horizont na spraši v teplej a suchšej klíme',ok:1},{t:'vznikajú pod ihličnatými lesmi'},{t:'sú plytké na vápencoch'}]},
  {q:bl(3)+'Ktorý pôdny typ očakávaš v nive Dunaja?',o:[{t:'fluvizem',ok:1},{t:'podzol'},{t:'ranker'}]},
  {q:bl(1)+'Koľko národných parkov má Slovensko?',o:[{t:'9',ok:1},{t:'14'},{t:'5'}]},
  {q:bl(4)+'Prečo sú v najvyšších polohách podzoly a rankre?',o:[{t:'chladná vlhká klíma, kyslý opad ihličnanov a pomalé zvetrávanie',ok:1},{t:'teplá klíma a spraš'},{t:'záplavy'}]},
  {q:bl(2)+'Čo je endemit?',o:[{t:'druh rozšírený len na obmedzenom území',ok:1},{t:'invázny druh'},{t:'vyhynutý druh'}]}],
  2:[
  {q:bl(6)+'Ktoré kritérium je pre fyzickogeografickú regionalizáciu Slovenska najvhodnejšie a prečo?',o:[{t:'reliéf – podmieňuje podnebie, vody, pôdy aj biotu',ok:1},{t:'hranice krajov – sú úradné'},{t:'počet obyvateľov'}]},
  {q:bl(5)+'Ktorý argument patrí k ekologickému hľadisku pri kalamite v NP?',o:[{t:'odumreté drevo zvyšuje biodiverzitu a les sa obnoví prirodzene',ok:1},{t:'drevo sa dá predať'},{t:'vlastníci potrebujú príjem'}]},
  {q:bl(4)+'Prečo sa rendziny vyskytujú aj v nižších aj vo vyšších polohách?',o:[{t:'sú viazané na horninu (vápence), nie na výškové pásmo – sú intrazonálne',ok:1},{t:'vznikajú len pri riekach'},{t:'sú zonálne'}]},
  {q:bl(1)+'Koľko biosférických rezervácií UNESCO je na Slovensku?',o:[{t:'4',ok:1},{t:'9'},{t:'1'}]},
  {q:bl(5)+'Čo je najlepším podkladom na rozhodnutie o zásahu v kalamite?',o:[{t:'zonácia NP, vedecký monitoring a zákonné pravidlá',ok:1},{t:'názor na sociálnej sieti'},{t:'počet turistov'}]}]},
 act:(el,lv)=>runParts(el,[
   dynSort({t:bl(3)+'Priraď pôdny typ k typickej polohe.',bins:[['n','nížiny','🌾'],['p','pahorkatiny','🌱'],['h','vrchoviny a hornatiny','🌲'],['v','najvyššie polohy','🏔️'],['i','intrazonálne','💧']],items:[['🟫','černozem','n'],['🟫','čiernica','n'],['🟫','hnedozem','p'],['🟫','luvizem','p'],['🟫','kambizem','h'],['🟫','podzol','v'],['🟫','ranker','v'],['🟫','fluvizem','i'],['🟫','rendzina','i']]}),
   dynRounds([
    {t:bl(4)+'Ktorý pôdny profil zodpovedá podzolu vysokých polôh?',o:[{s:soilProfile('podzol'),t:'A',ok:1},{s:soilProfile('cernozem'),t:'B'},{s:soilProfile('fluvizem'),t:'C'}],why:'Áno – tenký humus, vybielený eluviálny horizont a obohatený iluviálny horizont.'},
    {t:bl(4)+'Zlatník rozlišuje 10 vegetačných stupňov. Ktorá trojica je zoradená správne od najnižšieho?',o:[{t:'bukový → smrekový → kosodrevinový',ok:1},{t:'smrekový → dubový → alpínsky'},{t:'kosodrevinový → bukový → dubový'}]}])],'Pedosféru a biosféru analyzuješ ako krajinný ekológ!'),
 argue:(el,lv)=>runArgue(el,[
   openTask({b:4,key:'zonal',t:'Analyzuj vertikálnu zonálnosť na profile od Dunaja (Komárno) po Gerlachovský štít: ako sa menia teplota, zrážky, pôdy a vegetácia a prečo?',
     model:'Komárno (asi 110 m): teplá oblasť, zrážky okolo 550 mm, černozeme a čiernice, pôvodne dubové lesy, dnes polia. Pahorkatiny a nižšie vrchoviny: miernejšie teplo, viac zrážok, hnedozeme a luvizeme, bukovo-dubové a dubovo-bukové lesy. Hornatiny (800 – 1 500 m): mierne teplá až chladná oblasť, kambizeme, bukové, jedľovo-bukové a smrekové lesy. Nad hranicou lesa (asi 1 500 – 1 800 m): chladná oblasť, viac ako 1 200 mm zrážok, podzoly a rankre, kosodrevina, alpínske lúky; najvyššie subniválny stupeň a litozeme. Príčina: s výškou klesá teplota (gradient asi 0,6 °C/100 m) a rastú zrážky, čo mení zvetrávanie, rozklad humusu a podmienky rastu.',
     rubric:['Opísal/a som aspoň tri výškové úrovne.','Pre každú som uviedol/a pôdu aj vegetáciu.','Vysvetlil/a som príčinu (teplota, zrážky, gradient).','Použil/a som odborné pojmy správne.']}),

/* charts */
function demTransition(){const n=[38,37,30,20,12,10,9],m=[36,25,16,11,10,11,12];return lineChart([['natalita (‰)','#1E40AF',n],['mortalita (‰)','#B91C1C',m]],{years:['fáza 1','','fáza 2','','fáza 3','','fáza 4/5'],title:'Model demografického prechodu (stylizované hodnoty)'})}
const RANKD=[['Bratislava',475],['Košice',229],['Prešov',86],['Žilina',82],['Nitra',78],['Banská Bystrica',76],['Trnava',64],['Trenčín',55]];
function rankSize(){const W=420,H=240,L=50,B=34;const mx=500;const X=i=>L+i*(W-L-20)/7,Y=v=>H-B-v/mx*(H-B-26);
  let s=`<svg class="scene" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pravidlo poradia a veľkosti"><text x="8" y="16" font-size="12" font-weight="700">Veľkosť miest (stĺpce) a predikcia 1/n (čiara), tis. obyv.</text>`;
  [0,100,200,300,400,500].forEach(v=>{s+=`<path d="M${L} ${Y(v)}H${W-10}" stroke="#E5E7EB"/><text x="${L-6}" y="${Y(v)+4}" font-size="9" text-anchor="end">${v}</text>`});
  RANKD.forEach(([n,v],i)=>{s+=`<rect x="${X(i)-12}" y="${Y(v)}" width="24" height="${H-B-Y(v)}" fill="#1E40AF"/><text x="${X(i)}" y="${H-B+12}" font-size="8.5" text-anchor="middle">${n.split(' ')[0]}</text>`});
  s+=`<polyline points="${RANKD.map((d,i)=>`${X(i)},${Y(475/(i+1))}`).join(' ')}" fill="none" stroke="#C2410C" stroke-width="2.5" stroke-dasharray="6 4"/>`;
  return s+'</svg>'}
const NUTS2={ba:'SK01',tt:'SK02',tn:'SK02',nr:'SK02',za:'SK03',bb:'SK03',po:'SK04',ke:'SK04'};
function nutsMap(){const c={SK01:'#1E40AF',SK02:'#60A5FA',SK03:'#FBBF24',SK04:'#F97316'};const n={SK01:'Bratislavský kraj',SK02:'Západné Slovensko',SK03:'Stredné Slovensko',SK04:'Východné Slovensko'};
  const extra=`<g transform="translate(${CV.W-170} ${CV.H-80})"><rect width="162" height="72" rx="6" fill="#fff" opacity=".94"/>${Object.entries(n).map(([k,v],i)=>`<rect x="8" y="${8+i*15}" width="14" height="10" fill="${c[k]}"/><text x="28" y="${17+i*15}" font-size="9.5">${k} ${v}</text>`).join('')}</g>`;
  return physMap({kraje:true,relief:false,krajFill:k=>c[NUTS2[k]],cities:[],rivers:['dunaj'],scale:false,extra})}
function hbarX(data,unit,title){const m=Math.max(...data.map(d=>d[1]));return `<svg class="scene" viewBox="0 0 420 ${data.length*32+34}" role="img"><text x="8" y="16" font-size="12" font-weight="700">${title}</text>${data.map(([n,v,c],i)=>{const w=v/m*220;return `<text x="150" y="${i*32+44}" text-anchor="end" font-size="11.5" font-weight="600">${n}</text><rect x="158" y="${i*32+28}" width="${w}" height="21" rx="4" fill="${c||'#1E40AF'}"/><text x="${164+w}" y="${i*32+43}" font-size="11.5" font-weight="700">${v}${unit}</text>`}).join('')}</svg>`}
