    {t:'Mapa ukazuje sťahovanie z Bratislavy do okolitých obcí. Ako sa tento proces volá?',img:()=>suburbMap(),o:[{t:'suburbanizácia',ok:1},{t:'industrializácia'},{t:'vyľudňovanie'}]},
    {t:'Modelový graf: ako sa menil počet obyvateľov mesta a obce v jeho zázemí?',img:()=>lineChart([['mesto','#5B5BD6',[442,428,415,440,475]],['obec v zázemí (×10)','#E0603A',[16,18,24,38,62]]],{years:['1991','2001','2011','2016','2021'],title:'Počet obyvateľov (tisíce, modelové údaje)'}),o:[{t:'obec v zázemí rastie rýchlejšie ako mesto',ok:1},{t:'obe klesajú'},{t:'mesto rastie, obec klesá'}]}]),
   sortBins({t:'Akú hlavnú funkciu má mesto?',bins:[['k','kúpeľná','♨️'],['t','turistická','🏰'],['d','dopravná / priemyselná','🏭'],['a','administratívna','🏛️']],items:[['📍','Piešťany','k'],['📍','Bardejovské Kúpele','k'],['📍','Banská Štiavnica','t'],['📍','Žilina (križovatka, automobilka)','d'],['📍','Bratislava (sídlo vlády)','a'],['📍','Vysoké Tatry','t']]}),
   ...(lv===2?[choiceRounds([
    {t:'Obec v zázemí mesta chce povoliť 300 nových domov na poli. Čo by mala vyriešiť ako prvé?',o:[{t:'škôlku, školu, vodu, kanalizáciu a dopravu do mesta',ok:1},{t:'nový štadión'},{t:'nič – stačia domy'}]}])]:[])],'Sídla čítaš ako urbanista!'),
 sheet:lv=>sheetHead('Sídla a urbanizácia',lv)+`<p><b>1.</b> Funkčná mapa mojej obce – vyfarbi plochy podľa legendy (bývanie, výroba, služby, škola, oddych, doprava):</p>${grid(220)}
  <p><b>2.</b> Funkcie miest: Piešťany ______ Žilina ______ Banská Štiavnica ______ Bratislava ______</p>${lv===2?'<p><b>3.</b> Výhody a nevýhody suburbanizácie pre obec:</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div>výhody'+linesN(3)+'</div><div>nevýhody'+linesN(3)+'</div></div>':''}`},

pripady:{icon:'🔎',badge:'Výskumník',
 intro:[['ema','Teraz to spojme. Vybrala som štyri príbehy obcí – každý je iný problém: vyľudňovanie, suburbanizácia, starnutie a odchod mladých do zahraničia.'],['samo','Ku každému mám grafy. Sú to modelové údaje, ktoré ukazujú typický vývoj – vašou úlohou bude potom nájsť skutočné údaje svojej obce a porovnať ich.']],
 question:'Aké demografické a sídelné problémy riešia slovenské regióny a ako ich možno riešiť?',
 text:[
  {h:'1. Vyľudňovanie vidieka',p:`${g('vyludn','Vyľudňovanie')} postihuje najmä malé obce v odľahlých regiónoch – na severovýchode (Poloniny, okolie Medzilaboriec a Sniny), na Gemeri, v Honte a Novohrade. Mladí odchádzajú za prácou a štúdiom, zostávajú starší ľudia, zatvára sa škola, obchod, pošta, ruší sa autobus. Pomôcť môže lepšia doprava, internet, práca na diaľku, cestovný ruch či podpora mladých rodín.`},
  {h:'2. Suburbanizácia',p:`Opačný problém majú obce v zázemí Bratislavy a ďalších veľkých miest: rastú rýchlejšie, ako stíhajú budovať škôlky, školy, cesty a kanalizáciu. Pôvodní obyvatelia a nové rodiny majú často iné potreby. Kľúčom je dobrý územný plán a spolupráca obce s mestom.`},
  {h:'3. Starnutie',p:`Celé Slovensko starne. Pribúda dôchodcov a ubúda ľudí v produktívnom veku, ktorí platia odvody. Obce potrebujú viac sociálnych služieb, lekárov a bezbariérové priestory, štát rieši dôchodky a zdravotníctvo. Starnutie je aj príležitosť: skúsení seniori môžu byť aktívni v komunite.`},
  {h:'4. Odchod mladých do zahraničia',p:`Časť mladých ľudí odchádza študovať a pracovať do zahraničia a nevráti sa. Región stráca vzdelaných ľudí – ${g('brain','odliv mozgov')}. Na druhej strane navrátilci prinášajú skúsenosti a kontakty. Krajiny sa snažia mladých udržať kvalitnými školami, dostupným bývaním a zaujímavou prácou.`},
  {h:'Pre hlbších bádateľov: rómske komunity',lv:2,p:`Na východe a juhu Slovenska žijú aj ${g('marg','marginalizované rómske komunity')} – často v osadách s chudobou, horším prístupom k vode, vzdelaniu a práci. Atlas rómskych komunít mapuje, kde a v akých podmienkach žijú. Riešenie vyžaduje dlhodobé investície do vzdelávania, bývania, zdravia a zamestnanosti – a rešpekt.`}],
 fact:'Na Slovensku sú obce, ktoré majú menej ako 50 obyvateľov – najmenšia, Príkra pri Svidníku, len niekoľko stálych obyvateľov.',
 trip:'Vyber si jeden zo štyroch problémov, ktorý sa najviac týka tvojej obce. Nájdi k nemu skutočné údaje (DATAcube, scitanie.sk) a urob krátky rozhovor so starostom, učiteľom alebo susedom.',
 check:{1:['Viem vysvetliť príčiny a dôsledky vyľudňovania vidieka.','Viem opísať problémy suburbánnych obcí.','Viem, čo znamená starnutie pre obce a štát.','Viem vysvetliť odliv mozgov.'],2:['Viem porovnať modelové údaje so skutočnými údajmi svojej obce.','Navrhnem realistické riešenie problému obce.']},
 play:{name:'Projekt: budúcnosť našej obce',need:'skutočné údaje obce, mapa, plagát alebo prezentácia',
  steps:['Rozdeľte sa do 4 tímov podľa prípadových štúdií.','Každý tím zistí, či a ako sa problém týka vašej obce (údaje, rozhovory, pozorovanie).','Navrhnite 2 – 3 riešenia a posúďte ich: kto ich zaplatí, kto ich zrealizuje, ako dlho to potrvá.','Prezentujte výsledky triede alebo pozvite starostu na diskusiu.'],

function compass(az){const r=80;const a=(az-90)*Math.PI/180;return `<svg viewBox="0 0 200 200" style="max-width:240px;margin:0 auto;display:block" aria-label="Azimut"><circle cx="100" cy="100" r="${r}" fill="#fff" stroke="#14213D" stroke-width="3"/>${Array.from({length:36},(_,i)=>{const t=(i*10-90)*Math.PI/180,l=i%9===0?14:6;return `<path d="M${100+Math.cos(t)*r} ${100+Math.sin(t)*r}L${100+Math.cos(t)*(r-l)} ${100+Math.sin(t)*(r-l)}" stroke="#14213D" stroke-width="${i%9===0?2.5:1}"/>`}).join('')}
 ${[['S',0],['V',90],['J',180],['Z',270]].map(([n,d])=>{const t=(d-90)*Math.PI/180;return `<text x="${100+Math.cos(t)*(r-26)}" y="${100+Math.sin(t)*(r-26)+5}" text-anchor="middle" font-size="15" font-weight="800">${n}</text>`}).join('')}
 <path d="M100 100L${100+Math.cos(a)*(r-6)} ${100+Math.sin(a)*(r-6)}" stroke="#E0603A" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="#14213D"/><text x="100" y="196" font-size="12" text-anchor="middle" fill="#555">šípka ukazuje k cieľu</text></svg>`}
function hbarB(data,unit){const m=Math.max(...data.map(d=>d[1]));return `<svg class="scene" viewBox="0 0 420 ${data.length*34+14}" role="img">${data.map(([n,v,c],i)=>{const w=v/m*230;return `<text x="130" y="${i*34+26}" text-anchor="end" font-size="12" font-weight="700">${n}</text><rect x="138" y="${i*34+10}" width="${w}" height="22" rx="5" fill="${c||'#0E9384'}"/><text x="${144+w}" y="${i*34+26}" font-size="12" font-weight="800">≈ ${v}${unit}</text>`}).join('')}</svg>`}

    ...(lv===2?[{t:'Hypotéza: „Čím vyššia nadmorská výška, tým menej ornej pôdy.“ Ktoré pozorovanie ju podporuje?',o:[{t:'v horských okresoch prevládajú lesy a pasienky, na nížinách orná pôda',ok:1},{t:'na nížinách je najviac lesov'},{t:'orná pôda je všade rovnako'}]}]:[])])],'Poľnohospodárstvo rozumieš ako agronóm!'),

priem:{icon:'⚡',badge:'Inžinier',
 intro:[['samo','Slovensko vyrába takmer milión áut ročne – na počet obyvateľov najviac na svete. Ale čo keď autám prestane dariť? Mám pocit, že máme všetky vajcia v jednom košíku.'],['ema','A elektrina? V Mochovciach som videla chladiace veže jadrovej elektrárne. Na Hornej Nitre sa zasa nedávno prestalo ťažiť uhlie a ľudia hľadajú novú prácu.']],
 question:'Čo vyrába slovenský priemysel, prečo práve tam a odkiaľ máme energiu?',
 text:[
  {h:'Priemysel ako motor hospodárstva',p:`Sekundárny sektor (priemysel, stavebníctvo, energetika) tvorí na Slovensku vysoký podiel hospodárstva v porovnaní s inými krajinami EÚ. Najdôležitejšie ${g('odvetvie','odvetvie')} je <b>automobilový priemysel</b>: Volkswagen (Bratislava), Stellantis (Trnava), Kia (Žilina), Jaguar Land Rover (Nitra) a stovky dodávateľov. Pri Košiciach vzniká ďalší závod (Volvo).`},
  {h:'Ďalšie odvetvia',p:`<b>Hutníctvo</b> – oceliareň v Košiciach. <b>Chemický priemysel</b> – rafinéria Slovnaft v Bratislave, výroba hnojív v Šali. <b>Elektrotechnický</b> – výroba televízorov a elektroniky (Galanta, Nitra). <b>Papierenský a drevospracujúci</b> – Ružomberok. <b>Potravinársky</b> – mliekarne, pivovary, cukrovary. Ťaží sa magnezit (Gemer), vápenec, štrkopiesky.`},
  {h:'Prečo závod práve tu?',p:`Firmy sa rozhodujú podľa ${g('lokfakt','lokalizačných faktorov')}: dostupná a kvalifikovaná <b>pracovná sila</b>, dobrá <b>doprava</b> (diaľnice, železnica), blízkosť <b>dodávateľov a trhu</b> v EÚ, cena <b>energie</b> a podpora štátu. Preto sa automobilky usídlili na západe a v strede Slovenska pri diaľnici D1.`},
  {h:'Energetika',p:`${g('energmix','Energetický mix')}: viac ako polovicu elektriny (v posledných rokoch okolo 60 %) vyrábajú jadrové elektrárne Mochovce a Jaslovské Bohunice. Významný podiel majú vodné elektrárne (Gabčíkovo, Vážska kaskáda), menší plyn, biomasa a slnko. Ropu a zemný plyn musíme dovážať potrubiami. V roku 2023 sa skončila ťažba uhlia na Hornej Nitre a zatvorila uhoľná elektráreň Nováky.`},
  {h:'Pre hlbších bádateľov: transformácia regiónu',lv:2,p:`Koniec ťažby uhlia znamená pre Hornú Nitru (Prievidza, Handlová) stratu tisícov pracovných miest. Región prechádza <b>spravodlivou transformáciou</b>: rekvalifikácia baníkov, nové firmy, obnova krajiny. Podobne sa celé Slovensko pripravuje na prechod k elektromobilom a čistejšej energii – je to výzva aj príležitosť.`}],
 fact:'Slovensko je na počet obyvateľov najväčším výrobcom osobných áut na svete – vyrobí ich takmer jeden milión ročne.',
 trip:'Zisti, aký najväčší zamestnávateľ je v tvojom okrese. Čo vyrába alebo poskytuje? Prečo sídli práve tam (doprava, ľudia, suroviny)?',
 check:{1:['Vymenujem hlavné priemyselné odvetvia a ich centrá.','Viem, kde sa vyrábajú autá.','Viem vysvetliť lokalizačné faktory.','Poznám zdroje elektriny na Slovensku.'],2:['Viem zhodnotiť riziká závislosti od jedného odvetvia.','Viem vysvetliť transformáciu uhoľného regiónu.']},
 play:{name:'Kde postavíme továreň?',need:'mapa Slovenska (pracovný list), kartičky s údajmi o 4 modelových lokalitách',
  steps:['Rozdeľte sa do tímov „investorov“. Každý tím plánuje závod na elektrické batérie.','Porovnajte 4 lokality podľa: pracovná sila, diaľnica, železnica, voda, cena pozemku, vzdialenosť od automobiliek.','Každému faktoru dajte body 1 – 5 a vypočítajte súčet.','Predstavte rozhodnutie a vysvetlite, čo ste obetovali (napr. ochranu pôdy).'],
  l2:'Doplňte environmentálne kritériá (spotreba vody, záber ornej pôdy, emisie) a sledujte, či sa poradie lokalít zmení.',
  out:'Na vychádzke zmapujte firmy a výrobné haly v obci. Čo vyrábajú a odkiaľ k nim chodia pracovníci?'},
 teacher:{ciele:['charakterizovať hlavné priemyselné odvetvia a ich rozmiestnenie','vysvetliť lokalizačné faktory','opísať energetický mix a výrobu elektriny','zhodnotiť riziká a transformáciu (8. – 9. roč.)'],
  svp:'3. cyklus, téma Slovensko: hospodárstvo a výroba elektriny, využívanie krajiny, regionálne rozdiely.',

    {t:'Mapa: 🏭 priemyselné centrá, ⚛️ jadrové elektrárne, 💧 vodná elektráreň, 📄 papiereň, ⛏️ ťažba magnezitu. Ktoré mestá vyrábajú autá?',img:()=>industryMapB(),o:[{t:'Bratislava, Trnava, Nitra, Žilina',ok:1},{t:'Poprad a Prešov'},{t:'Banská Bystrica a Zvolen'}]},
    {t:'Približný energetický mix Slovenska. Ktorý zdroj je druhý najväčší?',img:()=>hbarB([['jadrové',60,'#5B5BD6'],['vodné',16,'#1D5FC4'],['fosílne (plyn)',13,'#9E9E9E'],['iné obnoviteľné',11,'#0E9384']],' %'),o:[{t:'vodné elektrárne',ok:1},{t:'uhlie'},{t:'veterné elektrárne'}]}]),
   sortBins({t:'Do ktorého sektora patrí činnosť?',bins:[['p','primárny','🌾'],['s','sekundárny','🏭'],['t','terciárny','🛎️']],items:[['⛏️','ťažba magnezitu','p'],['🌲','ťažba dreva','p'],['🚗','montáž áut','s'],['⚛️','výroba elektriny','s'],['🏗️','stavba diaľnice','s'],['💻','vývoj softvéru','t'],['🏨','hotel v Tatrách','t'],['🏥','nemocnica','t']]}),
   ...(lv===2?[choiceRounds([

 sheet:lv=>sheetHead('Priemysel a energetika',lv)+`<p><b>1.</b> Do mapy zakresli značkami: automobilky, oceliareň, rafinériu, jadrové a vodnú elektráreň.</p>${physMap({line:true,cities:['ba','tt','nr','za','ke'],rivers:['dunaj','vah','hron','hornad'],relief:false})}

sluzby:{icon:'🚆',badge:'Plánovač',
 intro:[['ema','Z Michaloviec do Bratislavy je to vlakom vyše šesť hodín, hoci vzdušnou čiarou necelých 400 km. Do Viedne by som sa z Bratislavy dostala za hodinu.'],['samo','Presne – dôležitá je časová vzdialenosť, nie kilometre. A dnes už väčšina ľudí pracuje v službách: v obchode, doprave, IT či cestovnom ruchu.']],
 question:'Ako doprava, služby a cestovný ruch spájajú a menia regióny Slovenska?',
 text:[
  {h:'Služby – najväčší sektor',p:`V terciárnom sektore – v obchode, doprave, školstve, zdravotníctve, financiách, IT, verejnej správe a cestovnom ruchu – pracuje viac ako polovica zamestnaných. Služby sa sústreďujú do miest: najviac v Bratislave, ďalej v Košiciach a krajských mestách. Rastie sektor informačných technológií (napr. košická IT komunita).`},
  {h:'Doprava a jej koridory',p:`Hlavný dopravný koridor vedie údolím Váhu a cez Podtatranskú kotlinu: diaľnica <b>D1</b> a hlavná železnica Bratislava – Žilina – Košice. Hory komplikujú stavbu – treba tunely (napr. Višňové pri Žiline). Dôležité sú aj diaľnica D2 (Česko – Bratislava – Maďarsko), letiská Bratislava a Košice, vodná cesta Dunaj s prístavmi Bratislava a Komárno a širokorozchodná trať z Ukrajiny do Košíc.`},
  {h:'Časová vzdialenosť a tranzit',p:`Pre ľudí aj firmy je kľúčová ${g('casovavzd','časová vzdialenosť')}. Regióny s dobrou dopravou (západ, okolie D1) lákajú investície, odľahlé regióny strácajú. Slovensko je aj ${g('tranzit','tranzitnou')} krajinou – cez naše územie vedú ropovody, plynovody a kamiónová doprava medzi západom a východom Európy.`},
  {h:'Cestovný ruch',p:`Najnavštevovanejšie sú Bratislava, Vysoké Tatry a Liptov. Turistov lákajú hory (lyžovanie, turistika), kúpele a termálne kúpaliská, hrady, jaskyne, pamiatky UNESCO a gastronómia. Väčšinu návštevníkov tvoria domáci a turisti zo susedných krajín (Česko, Poľsko, Nemecko, Maďarsko). Cestovný ruch dáva prácu, ale v Tatrách už vznikajú problémy z preťaženia.`},
  {h:'Pre hlbších bádateľov: udržateľná mobilita',lv:2,p:`Doprava je jedným z najväčších zdrojov emisií. Riešením sú kvalitná verejná doprava (taktová železnica, integrované systémy), cyklotrasy, zdieľanie áut a elektrifikácia. Rozhodnutie, či postaviť diaľnicu alebo modernizovať železnicu, je otázka hodnôt aj dát – dopravných prieskumov, nákladov a vplyvu na krajinu.`}],
 fact:'Širokorozchodná železničná trať vedie z ukrajinskej hranice až k oceliarni pri Košiciach – je to najzápadnejšie miesto, kam v strednej Európe vedie široký rozchod koľají.',
 trip:'Vypočítaj časovú vzdialenosť z tvojej obce do krajského mesta a do Bratislavy autom a verejnou dopravou. Ktorá je kratšia a prečo?',
 check:{1:['Viem, že väčšina ľudí pracuje v službách.','Opíšem hlavné dopravné koridory.','Viem vysvetliť časovú vzdialenosť.','Uvediem hlavné oblasti cestovného ruchu.'],2:['Viem vysvetliť význam tranzitu.','Zhodnotím udržateľnosť dopravy a cestovného ruchu.']},
 play:{name:'Mapa časovej dostupnosti',need:'cestovné poriadky (cp.sk), mapa Slovenska, farbičky',
  steps:['Vyberte 8 cieľov (krajské mestá, Viedeň, Budapešť).','Pre každý zistite najrýchlejší čas cesty verejnou dopravou zo školy.','Na mapu nakreslite „izochróny“ – vyfarbite ciele podľa času: do 1 h, do 3 h, nad 3 h.','Porovnajte s kilometrami: kde je nepomer najväčší a prečo?'],
  l2:'Navrhnite zlepšenie spojenia pre vašu obec (nový spoj, prestup, cyklotrasa) a odhadnite, koľkým ľuďom by pomohlo.',
  out:'Urobte dopravný prieskum pri škole: počítajte za 15 minút autá, autobusy, bicykle a chodcov. Vyhodnoťte, čo prevláda.'},
 teacher:{ciele:['charakterizovať terciárny sektor','opísať dopravné koridory a vysvetliť časovú vzdialenosť','zhodnotiť cestovný ruch a udržateľnú mobilitu (8. – 9. roč.)'],

  {q:'V ktorom sektore pracuje najviac ľudí?',o:[{t:'v službách (terciárnom)',ok:1},{t:'v poľnohospodárstve'},{t:'v baníctve'}]},
  {q:'Kadiaľ vedie hlavný dopravný koridor Slovenska?',o:[{t:'údolím Váhu a pod Tatrami do Košíc',ok:1},{t:'po hranici s Maďarskom'},{t:'cez Záhorie'}]},
  {q:'Čo je časová vzdialenosť?',o:[{t:'ako dlho trvá cesta',ok:1},{t:'vzdialenosť v km'},{t:'čas otvorenia obchodu'}]},
  {q:'Ktorá oblasť je v cestovnom ruchu najnavštevovanejšia?',o:[{t:'Vysoké Tatry',ok:1},{t:'Záhorská nížina'},{t:'Poloniny'}]}],

  {q:'Čo znamená, že Slovensko je tranzitná krajina?',o:[{t:'cez územie vedú ropovody, plynovody a doprava medzi štátmi',ok:1},{t:'nemá vlastné cesty'},{t:'všetci tu len prestupujú'}]},

  {q:'Aký problém spôsobuje preťaženie Tatier turistami?',o:[{t:'erózia chodníkov, odpad, rušenie zvierat, zápchy',ok:1},{t:'nedostatok snehu v lete'},{t:'žiadny'}]}]},
 act:(el,lv)=>runParts(el,[
   choiceRounds([
    {t:'Čierno-biela čiara je hlavná železnica, oranžová širokorozchodná trať. Prečo vedie hlavná trať údolím Váhu?',img:()=>railMap(),o:[{t:'údolie je prirodzený prechod medzi horami',ok:1},{t:'je to najkratšia priamka'},{t:'po Váhu sa plavia lode'}]},
    {t:'Kam vedie širokorozchodná trať?',img:()=>railMap(),o:[{t:'z ukrajinskej hranice k oceliarni pri Košiciach',ok:1},{t:'z Bratislavy do Viedne'},{t:'do Tatier'}]},
    {t:'Vlak z Bratislavy do Košíc prejde asi 445 km za 5 hodín. Aká je jeho priemerná rýchlosť?',o:[{t:'asi 89 km/h',ok:1},{t:'asi 445 km/h'},{t:'asi 45 km/h'}],why:'445 ÷ 5 = 89 km/h.'}]),
   sortBins({t:'O aký druh cestovného ruchu ide?',bins:[['h','horský a športový','🎿'],['k','kúpeľný a wellness','♨️'],['p','poznávací','🏛️'],['m','mestský','🏙️']],items:[['⛷️','lyžovanie v Jasnej','h'],['♨️','liečenie v Piešťanoch','k'],['🏰','Spišský hrad','p'],['🎭','víkend v Bratislave','m'],['🥾','túra na Rysy','h'],['🛁','termálne kúpalisko','k'],['⛏️','banské múzeum v Štiavnici','p']]}),
   ...(lv===2?[choiceRounds([
    {t:'Mesto chce znížiť ranné zápchy. Ktoré riešenie je podložené dátami z dopravného prieskumu (80 % áut s 1 osobou, 20 % ciest kratších ako 3 km)?',o:[{t:'lepšie autobusy a bezpečné cyklotrasy na krátke cesty',ok:1},{t:'rozšíriť cestu o pruh'},{t:'nerobiť nič'}]}])]:[])],'Dopravu a služby plánuješ ako profesionál!'),
 sheet:lv=>sheetHead('Doprava, služby, cestovný ruch',lv)+`<p><b>1.</b> Zakresli D1, hlavnú železnicu, letiská a prístavy.</p>${physMap({line:true,cities:['ba','tt','tn','za','pp','ke'],rivers:['dunaj','vah'],relief:false})}

regiony:{icon:'📈',badge:'Analytik regiónov',
 intro:[['samo','Porovnal som dáta: Bratislavský kraj patrí k najbohatším regiónom EÚ, ale niektoré okresy na juhu a východe majú nezamestnanosť niekoľkonásobne vyššiu. Ako je to možné v jednej malej krajine?'],['ema','Keď cestujem vlakom z Bratislavy domov, vidím to aj z okna – nové haly a štvrte na západe, zatvorené fabriky a prázdne domy v niektorých dedinách na východe. Ale zároveň krásnu prírodu a šikovných ľudí.']],
 question:'Prečo sú medzi regiónmi Slovenska veľké rozdiely a ako ich možno zmenšovať?',
 text:[
  {h:'Ako merať rozdiely',p:`Regionálne rozdiely porovnávame ukazovateľmi: ${g('hdp','HDP na obyvateľa')}, ${g('nezam','miera nezamestnanosti')}, priemerná mzda, vzdelanie, dostupnosť služieb, dĺžka života či kvalita bývania. Žiadne jedno číslo nepovie všetko – treba ich kombinovať.`},
  {h:'Západ – východ, sever – juh',p:`Najvyššiu ekonomickú úroveň má <b>Bratislavský kraj</b> – patrí k najbohatším regiónom EÚ, má najvyššie mzdy a najnižšiu nezamestnanosť. Dobre sú na tom aj Trnavský a Trenčiansky kraj a okolie krajských miest. Vyššiu nezamestnanosť a nižšie mzdy majú viaceré okresy <b>juhu stredného Slovenska</b> (napr. Rimavská Sobota, Revúca) a <b>východného Slovenska</b>. Štát ich podporuje ako ${g('nro','najmenej rozvinuté okresy')}.`},
  {h:'Príčiny rozdielov',p:`Rozdiely majú viac príčin: <b>poloha</b> (blízkosť Viedne a trhov EÚ), <b>doprava</b> (diaľnice dorazili najprv na západ), <b>história</b> (zánik tovární po roku 1990), <b>vzdelanie</b> a <b>odchod mladých</b>, menej <b>investícií</b>, v niektorých obciach aj generačná chudoba. Pôsobia aj ako začarovaný kruh: menej práce → odchod mladých → menej služieb → ešte menej investícií.`},

 question:'Ako pripraviť a urobiť vlastný geografický výskum v teréne?',
 text:[
  {h:'Kroky výskumu',p:`1. <b>Otázka</b> – čo chcem zistiť (napr. Kde v obci je najviac hluku?). 2. ${g('hypot','Hypotéza')} – čo predpokladám. 3. <b>Plán</b> – kde, kedy, čím budem merať. 4. <b>Zber dát</b> v teréne. 5. <b>Spracovanie</b> – tabuľka, graf, mapa. 6. <b>Záver</b> – potvrdil som hypotézu? 7. <b>Prezentácia</b> a návrh riešenia.`},
  {h:'Nástroje terénneho geografa',p:`Mapa a <b>buzola</b> (určenie ${g('azimut','azimutu')}), GPS v mobile, mapové portály (ZBGIS, mapy.sk), meranie vzdialenosti krokmi (1 krok ≈ 0,7 – 0,8 m – odmeraj si svoj), teplomer, aplikácia na meranie hluku, fotoaparát, terénny zápisník. Pri ľuďoch používame <b>dotazník</b> alebo <b>rozhovor</b>.`},
  {h:'Kvantitatívne a kvalitatívne údaje',p:`<b>Kvantitatívne</b> údaje sú čísla: teplota, počet áut, decibely, vzdialenosť. <b>Kvalitatívne</b> údaje opisujú: fotografie, poznámky, názory ľudí, náčrtky. Dobrý výskum kombinuje oboje.`},
  {h:'Bezpečnosť a etika',p:`V teréne pracujeme v skupinách, so súhlasom učiteľa a rodičov, rešpektujeme súkromný majetok a pravidlá chránených území. Pri dotazníkoch sa pýtame slušne, vysvetlíme účel a údaje spracúvame <b>anonymne</b>. Ľudí nefotografujeme bez súhlasu.`},
  {h:'Pre hlbších bádateľov: GIS v škole',lv:2,p:`Údaje so súradnicami môžeš spracovať v jednoduchom GIS (napr. bezplatné webové aplikácie alebo QGIS): každý bod merania má polohu a hodnotu, z nich vznikne tematická mapa. Takto pracujú aj profesionálni geografi – urbanisti, ochranári či krízoví manažéri.`}],
 fact:'Pri meraní krokmi sa počítajú zvyčajne dvojkroky (každý druhý dopad tej istej nohy) – presnosť je pri troche tréningu prekvapivo dobrá, aj okolo 5 %.',

 check:{1:['Poznám kroky geografického výskumu.','Viem formulovať výskumnú otázku a hypotézu.','Viem určiť azimut a zmerať vzdialenosť krokmi.','Rozlíšim kvantitatívne a kvalitatívne údaje.'],2:['Viem spracovať údaje do tematickej mapy.','Dodržiavam etiku pri práci s ľuďmi a údajmi.']},

/* ---------- diploma ---------- */
function diplomaHTML(name){return `<div style="border:8px double #14213D;border-radius:20px;padding:30px 26px;text-align:center;color:#111">
  <div style="display:flex;justify-content:center;gap:18px"><div style="width:90px">${ema()}</div><div style="width:90px">${samo()}</div></div>
  <h1 style="font-family:'Sora',sans-serif;font-size:42px;margin:10px 0 0">Osvedčenie bádateľa</h1><p style="font-size:18px;margin:6px 0 16px">Slovensko v dátach, mapách a teréne</p><p>Toto osvedčenie získava</p>
  <p style="font-family:'Sora',sans-serif;font-size:34px;margin:6px 0;border-bottom:2px solid #111;display:inline-block;min-width:60%">${name||'&nbsp;'}</p>
  <p style="font-size:16px;margin-top:12px">za úspešné zvládnutie všetkých 15 tém v blokoch<br>Príroda Slovenska · Obyvateľstvo a sídla · Hospodárstvo a regióny.</p>
  <div style="display:flex;justify-content:space-between;margin-top:30px;font-size:14px"><span>Dátum: ______________</span><span>Podpis: ______________</span></div></div>`}
function openDiploma(){openDlg(`<h2>🎓 Osvedčenie bádateľa</h2><p>Všetkých 15 tém je zapísaných v denníku! Napíš meno a vytlač osvedčenie.</p><div class="row" style="justify-content:flex-start"><input id="dipName" placeholder="Meno a priezvisko" style="font:inherit;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;flex:1;min-width:180px;background:var(--card);color:var(--ink)"><button class="btn green small" id="dipPrint">🖨️ Vytlačiť</button></div>`);
  $('#dipPrint').onclick=()=>{$('#print-area').innerHTML=`<div class="sheet">${diplomaHTML($('#dipName').value.trim())}</div>`;window.print()}}

/* ---------- rendering ---------- */
const app=$('#app');
function setLevel(l){S.level=l;store.set('level',l);$$('.lvl button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.lv===l));render()}
$$('.lvl button').forEach(b=>b.onclick=()=>setLevel(+b.dataset.lv));
$('#homeBtn').onclick=()=>{S.view='home';render()};
$('#passBtn').onclick=openPass;
function updatePass(){$('#passCount').textContent=Object.keys(S.badges).length}
function markSeen(step){const k=S.mod+'_'+S.level;S.seen[k]=Math.max(S.seen[k]||0,step);store.set('seen',S.seen)}
function render(){try{speechSynthesis.cancel()}catch(e){}updatePass();S.view==='home'?renderHome():renderModule();window.scrollTo({top:0})}
const marker=(col,size=22)=>`<span class="marker m-${col}" style="width:${size}px;height:${size}px" aria-hidden="true"></span>`;
function renderModule(){
  const m=M[S.mod],lv=S.level,item=COURSE.flatMap(p=>p.items.map(i=>[...i,p.col])).find(i=>i[0]===S.mod);const seen=S.seen[S.mod+'_'+lv]||0;
  app.innerHTML=`<div class="mhead"><button class="btn soft small" id="back">🗺️ Bloky</button><button class="btn soft small" id="teach">👩‍🏫 Pre učiteľa</button></div><h1 class="mtitle">${marker(item[3],26)} ${item[1]}</h1>
   <nav class="steps" aria-label="Kroky">${STEPS.map(([ic,n],i)=>`<button data-s="${i}" ${i===S.step?'aria-current="step"':''} class="${i<seen?'ok':''}"><i>${i<seen?'✔':ic}</i>${n}</button>`).join('')}</nav>
   <section class="card" id="stage"></section>`;
  $('#back').onclick=()=>{S.view='home';render()};$('#teach').onclick=openTeacher;
  $$('.steps button').forEach(b=>b.onclick=()=>{S.step=+b.dataset.s;renderModule()});
  const cur=$('.steps [aria-current]');cur&&cur.scrollIntoView({inline:'center',block:'nearest'});
  renderStep();
  const bar=$('#nextBar'),inn=$('#nextIn');bar.hidden=false;

function makePickQ(N,minOwn){return function(m,lv){const gens=(m.gen||[]).map(g=>()=>g(lv));const own=m.quiz[lv]||[];const other=lv===2?(m.quiz[1]||[]):[];
  let sel=lv===2&&minOwn?[...shuffle(own).slice(0,minOwn),...shuffle([...own.slice(minOwn),...other,...gens]).slice(0,N-minOwn)]:shuffle([...own,...gens]).slice(0,N);
  if(lv===2&&minOwn){const rest=shuffle([...own,...other,...gens].filter(x=>!sel.includes(x)));sel=[...new Set(sel)];while(sel.length<N&&rest.length)sel.push(rest.pop())}

const BG={
 hust:lv=>{const k=dpick(Object.keys(KRD));const [p,a]=KRD[k];const d=Math.round(p*1000/a);return {q:`${KRN[k]} kraj: ${p} tisíc obyvateľov, ${dfs(a)} km². Aká je hustota zaľudnenia?`,o:dUniq(`asi ${d} obyv./km²`,[`asi ${Math.round(d/10)} obyv./km²`,`asi ${d*10} obyv./km²`,`asi ${Math.round(a/p)} obyv./km²`]),e:`${p} 000 ÷ ${dfs(a)} ≈ ${d}.`}},
 pp:lv=>{const b=dri(5,40),z=dri(5,40);return {q:`V obci sa narodilo ${b} detí a zomrelo ${z} ľudí. Aký je prirodzený prírastok?`,o:dUniq(`${b-z>0?'+':''}${b-z}`,[`${z-b>0?'+':''}${z-b}`,`${b+z}`,`${Math.round(b/z*10)/10}`]),e:`${b} − ${z} = ${b-z}.`}},
 celk:lv=>{const pp=dri(-30,10),ms=dri(-40,60);return {q:`Prirodzený prírastok obce je ${pp}, migračné saldo ${ms}. Aký je celkový prírastok?`,o:dUniq(`${pp+ms>0?'+':''}${pp+ms}`,[`${pp-ms}`,`${ms-pp}`,`${Math.abs(pp)+Math.abs(ms)}`]),e:`${pp} + (${ms}) = ${pp+ms}.`}},
 zmena:lv=>{const a=dri(500,3000,10),b=Math.round(a*dri(60,180)/100/10)*10;const c=(b-a)/a*100;return {q:`Obec mala ${dfs(a)} obyvateľov, o 10 rokov ${dfs(b)}. O koľko percent sa zmenil počet?`,o:dUniq(`${c>0?'+':''}${df1(c)} %`,[`${df1((b-a)/b*100)} %`,`${c>0?'+':''}${dfs(b-a)} %`,`${df1(b/a*100)} %`]),e:`(${dfs(b)} − ${dfs(a)}) ÷ ${dfs(a)} × 100 ≈ ${df1(c)} %.`}},
 cas:lv=>{const L=[['Bratislava',17.1],['Nitra',18.1],['Žilina',18.7],['Poprad',20.3],['Košice',21.3],['Michalovce',21.9]];let a=dpick(L),b=dpick(L);while(a===b)b=dpick(L);const [w,e]=a[1]<b[1]?[a,b]:[b,a];const m=Math.round((e[1]-w[1])*4);return {q:`${w[0]} leží na ${df1(w[1])}° v. d., ${e[0]} na ${df1(e[1])}° v. d. O koľko minút skôr vychádza slnko v meste ${e[0]}?`,o:dUniq(`asi ${m} min`,[`asi ${Math.round((e[1]-w[1])*15)} min`,`asi ${Math.round(e[1]-w[1])} min`,`asi ${m*4} min`]),e:`${df1(e[1]-w[1])}° × 4 min ≈ ${m} min.`}},
 tepl:lv=>{const h1=dri(200,600,50),t=dri(12,22),h2=h1+dpick([1000,1500,2000]);const r=t-(h2-h1)*0.006;return {q:`V ${h1} m n. m. je ${t} °C. Aká teplota bude vo výške ${dfs(h2)} m (−0,6 °C na 100 m)?`,o:dUniq(`asi ${df1(r)} °C`,[`asi ${df1(t+(h2-h1)*0.006)} °C`,`asi ${df1(t-(h2-h1)/100)} °C`,`asi ${t} °C`]),e:`(${dfs(h2)} − ${h1}) × 0,6/100 = ${df1((h2-h1)*0.006)} °C.`}},
 strecha:lv=>{const A=dri(200,1200,50),z=dri(500,900,10);return {q:`Strecha školy má ${dfs(A)} m², za rok spadne ${z} mm zrážok. Koľko litrov vody odtečie zo strechy?`,o:dUniq(`${dfs(A*z)} l`,[`${dfs(A+z)} l`,`${dfs(A*z/1000)} l`,`${dfs(A*z*10)} l`]),e:`1 mm na 1 m² = 1 liter; ${dfs(A)} × ${z} = ${dfs(A*z)} l.`}},
 kroky:lv=>{const k=dri(65,80)/100,n=dri(80,400,10);return {q:`Tvoj krok meria ${df1(k,2)} m. Urobil/a si ${n} krokov. Akú vzdialenosť si prešiel/prešla?`,o:dUniq(`${df1(k*n)} m`,[`${n} m`,`${df1(n/k)} m`,`${df1(k*n/10)} m`]),e:`${n} × ${df1(k,2)} = ${df1(k*n)} m.`}},
 podiel:lv=>{const T=dri(24,32),j=dri(13,20);return {q:`Za rok sa vyrobilo ${T} TWh elektriny, z toho ${j} TWh v jadrových elektrárňach. Aký je podiel jadra?`,o:dUniq(`asi ${Math.round(j/T*100)} %`,[`asi ${Math.round((T-j)/T*100)} %`,`asi ${j} %`,`asi ${Math.round(T/j*10)} %`]),e:`${j} ÷ ${T} × 100 ≈ ${Math.round(j/T*100)} %.`}},
 rychl:lv=>{const d=dri(380,460,5),h=dpick([4,4.5,5,5.5]);return {q:`Vlak prejde ${d} km za ${df1(h)} h. Aká je priemerná rýchlosť?`,o:dUniq(`asi ${Math.round(d/h)} km/h`,[`asi ${Math.round(d*h)} km/h`,`asi ${Math.round(d/h/2)} km/h`,`asi ${Math.round(d-h)} km/h`]),e:`${d} ÷ ${df1(h)} ≈ ${Math.round(d/h)} km/h.`}},
 pomer:lv=>{const a=dri(2,5),b=a*dri(2,4)+dri(0,1);return {q:`Okres X má nezamestnanosť ${a} %, okres Y ${b} %. Koľkokrát je vyššia v okrese Y?`,o:dUniq(`asi ${df1(b/a)}-krát`,[`asi ${b-a}-krát`,`asi ${df1(a/b,2)}-krát`,`asi ${df1(b/a+2)}-krát`]),e:`${b} ÷ ${a} ≈ ${df1(b/a)}.`}},
 azimut:lv=>{const az=dpick([0,45,90,135,180,225,270,315]);const N={0:'sever',45:'severovýchod',90:'východ',135:'juhovýchod',180:'juh',225:'juhozápad',270:'západ',315:'severozápad'};return {q:'Aký azimut ukazuje šípka?',img:()=>compass(az),o:dUniq(`${az}° – ${N[az]}`,shuffle(Object.entries(N).filter(([a])=>+a!==az).map(([a,n])=>`${a}° – ${n}`)))}}};
