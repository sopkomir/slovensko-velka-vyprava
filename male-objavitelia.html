<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malí objavitelia – Slovensko, veľká výprava</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1B2A41">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
.hub-btn{flex:0 0 40px;width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--line);background:var(--card);border-radius:12px;font-size:22px;text-decoration:none;color:inherit;font-weight:800}

:root{
  --paper:#EFF6E8; --card:#FFFFFF; --ink:#213A5C; --ink-soft:#52677F;
  --lowland:#4FA867; --lowland-soft:#DCEFDD; --hill:#C9874A; --hill-soft:#F6E5D1;
  --river:#2F8FD8; --river-soft:#DDECFA; --sun:#FFC93C; --sun-soft:#FFF1C7; --berry:#E4572E;
  --line:#C9D9C1; --topo:#D3E4C7; --press:rgba(33,58,92,.22);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#13233A; --card:#1C3253; --ink:#EEF4FF; --ink-soft:#B9C8DE;
    --lowland-soft:#1E3F35; --hill-soft:#46331F; --river-soft:#183B5F; --sun-soft:#43391A;
    --line:#35507A; --topo:#1A2E4B; --press:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --paper:#13233A; --card:#1C3253; --ink:#EEF4FF; --ink-soft:#B9C8DE;
  --lowland-soft:#1E3F35; --hill-soft:#46331F; --river-soft:#183B5F; --sun-soft:#43391A;
  --line:#35507A; --topo:#1A2E4B; --press:rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Andika','Trebuchet MS',system-ui,sans-serif;font-size:18px;line-height:1.55;-webkit-tap-highlight-color:transparent;min-height:100vh}
svg{max-width:100%}
h1,h2,h3{font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px;border-radius:12px}
.topo{position:fixed;inset:0;width:100%;height:100%;z-index:-1;color:var(--topo);pointer-events:none}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px;text-align:left}
#brandOwl{display:block;width:38px;flex:0 0 38px}#brandOwl svg{width:38px;height:44px;display:block}
.brand b{font-family:'Baloo 2',sans-serif;font-size:20px;line-height:1;display:block}
.brand small{font-size:13px;color:var(--ink-soft)}
.lvl{margin-left:auto;display:flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.lvl button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.lvl button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pass-btn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 10px;font-weight:700;display:flex;gap:6px;align-items:center}
@media (max-width:560px){.brand b{font-size:17px}.brand small{display:none}.lvl button{padding:6px 9px;font-size:14px}.lvl .lv-age{display:none}}
@media (max-width:460px){.brand-txt{display:none}.top-in{gap:8px;padding:8px 10px}.pass-btn{padding:6px 8px}}

main{max-width:820px;margin:0 auto;padding:16px 14px 110px}

/* buttons */
.btn{border:0;border-radius:18px;padding:14px 22px;font-weight:700;font-size:18px;background:var(--ink);color:var(--paper);box-shadow:0 5px 0 var(--press);transition:transform .08s, box-shadow .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:52px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--press)}
.btn.soft{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:#213A5C}
.btn.green{background:var(--lowland);color:#fff}
.btn.small{padding:8px 14px;font-size:16px;min-height:42px;border-radius:14px}
.say{border:2px solid var(--line);background:var(--card);border-radius:50%;width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;font-size:22px;box-shadow:0 3px 0 var(--press)}
.say:active{transform:translateY(2px);box-shadow:none}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;margin:8px 0 6px}
.hero .owl{width:132px}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:26px 26px 26px 8px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:19px}
.bubble p{margin:0;flex:1}
.hero h1{grid-column:1/-1;font-size:clamp(30px,7vw,46px);margin-top:10px}
.hero .lead{grid-column:1/-1;margin:0;color:var(--ink-soft);max-width:60ch}

/* trail */
.trail{position:relative;margin:22px 0 10px;padding-bottom:20px}
.trail svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pack{position:relative;z-index:1;margin:26px 0 8px;display:flex;align-items:baseline;gap:10px}
.pack h2{font-size:26px}
.pack span{color:var(--ink-soft);font-size:15px}
.stop{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:auto;margin:10px 0;background:none;border:0;padding:0;text-align:left}
.stop .dot{flex:0 0 74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--card);border:4px solid var(--ink);box-shadow:0 5px 0 var(--press)}
.stop .lbl{min-width:0;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px}
.stop .lbl b{display:block;font-family:'Baloo 2',sans-serif;font-size:20px;line-height:1.1}
.stop .lbl small{color:var(--ink-soft);font-size:14px}
.stop.done .dot{border-color:var(--lowland)}
.stop .stamp{position:absolute;left:52px;top:-6px;background:var(--lowland);color:#fff;border-radius:999px;font-size:13px;padding:1px 7px;font-weight:700}
.stop[disabled]{cursor:default}
.stop[disabled] .dot{filter:grayscale(1);opacity:.55;border-style:dashed;box-shadow:none}
.stop[disabled] .lbl{opacity:.7}
.stop:not([disabled]):active .dot{transform:translateY(4px);box-shadow:0 1px 0 var(--press)}

/* module */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 8px}
.mtitle{font-size:clamp(28px,7vw,40px);margin:0 0 10px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:0 0 auto;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.steps button i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font-size:15px}
.steps button[aria-current="step"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.steps button[aria-current="step"] i{background:var(--sun);color:#213A5C}
.steps button.ok i{background:var(--lowland);color:#fff}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;margin:12px 0}
.card h2{font-size:24px;margin-bottom:6px}
.task{display:flex;gap:12px;align-items:center;background:var(--sun-soft);border-radius:18px;padding:10px 12px;margin-bottom:12px;font-size:20px;font-weight:700}
.task p{margin:0;flex:1}
.scene{width:100%;height:auto;display:block;border-radius:18px;touch-action:manipulation}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 0}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--lowland)}
.feedback{min-height:30px;text-align:center;font-weight:700;margin-top:8px}
.feedback.good{color:var(--lowland)} .feedback.bad{color:var(--berry)}
.zone{cursor:pointer}
.zone circle{fill:rgba(255,255,255,.01);stroke:#213A5C;stroke-width:2.5;stroke-dasharray:6 6;opacity:.55}
.zone:hover circle,.zone:focus circle{opacity:1;stroke-width:3.5}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--press);min-height:64px;justify-content:center}
.opt svg{width:100%;max-width:150px;height:auto}
.opt .emo{font-size:46px;line-height:1}
.opt.right{border-color:var(--lowland);background:var(--lowland-soft)}
.opt.wrong{border-color:var(--berry)}
.opt:active{transform:translateY(3px);box-shadow:none}
.pad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,72px);gap:8px;justify-content:center;margin-top:12px}
.pad button{border:3px solid var(--ink);background:var(--card);border-radius:18px;font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 4px 0 var(--press)}
.pad button small{font-size:12px;font-weight:700;margin-top:3px}
.pad button:active{transform:translateY(3px);box-shadow:none}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:48px;background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:6px;margin-top:10px;align-items:center}
.prog span{background:var(--card);border:2px solid var(--ink);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:20px}
.prog span.run{background:var(--sun)}
.prog em{color:var(--ink-soft);font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.chip{border:3px solid var(--ink);background:var(--card);border-radius:14px;min-width:54px;height:50px;font-size:22px;font-weight:800;font-family:'Baloo 2',sans-serif;box-shadow:0 4px 0 var(--press)}
.chip[aria-pressed="true"]{background:var(--sun);color:#213A5C}
.chip:disabled{opacity:.3;box-shadow:none}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.words span{background:var(--river-soft);border-radius:999px;padding:4px 12px;font-weight:700}
.story{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start}
.story .owl{width:110px}
@media (max-width:480px){.story{grid-template-columns:76px 1fr}.story .owl{width:76px}.bubble{font-size:18px}}
.play ol{padding-left:24px;margin:8px 0} .play li{margin:6px 0}
.play h3{font-size:20px;margin-top:14px}
.tag{display:inline-block;background:var(--hill-soft);border-radius:10px;padding:2px 10px;font-weight:700;font-size:15px;margin-bottom:6px}
.next-bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:2px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.next-bar .in{max-width:820px;margin:0 auto;display:flex;gap:10px;justify-content:space-between}
.done-card{text-align:center;padding:10px}
.done-card .big{font-size:56px}
/* sheet preview */
.sheet{background:#fff;color:#111;border-radius:12px;padding:22px;border:1px solid #ccc;font-family:'Andika',sans-serif}
.sheet .sh-top{display:flex;justify-content:space-between;gap:10px;font-size:15px;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:10px}
.sheet h2{font-size:26px;margin:4px 0 6px;color:#111}
.sheet p{margin:6px 0}
.sheet svg{display:block;margin:10px auto;width:100%;height:auto}
.sheet .lines{border-bottom:1.5px solid #555;height:34px}
/* dialogs */
dialog{border:0;border-radius:26px;padding:0;max-width:min(640px,94vw);width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(19,35,58,.55)}
.dlg{padding:20px;max-height:84vh;overflow:auto}
.dlg h2{font-size:26px;margin-bottom:8px}
.dlg h3{font-size:19px;margin:14px 0 4px}
.dlg ul{margin:4px 0;padding-left:22px}
.dlg .close{float:right}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:10px}
.badge{border:2px dashed var(--line);border-radius:20px;padding:10px;text-align:center;font-size:14px}
.badge .st{width:78px;height:78px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:36px;border:5px double var(--line);color:var(--ink-soft)}
.badge.got{border-style:solid;border-color:var(--lowland)}
.badge.got .st{border-color:var(--lowland);background:var(--lowland-soft)}
.badge b{display:block;font-size:15px}
.reveal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(19,35,58,.6);padding:20px}
.reveal .box{background:var(--card);border-radius:30px;padding:26px 22px;text-align:center;max-width:360px;width:100%}
.reveal .st{width:150px;height:150px;margin:6px auto 12px;border-radius:50%;display:grid;place-items:center;font-size:70px;border:9px double var(--lowland);background:var(--lowland-soft);animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:scale(2.4) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:14px;z-index:60;max-width:90vw;font-size:16px}
.ill{max-width:440px;margin:0 auto 12px}
.bigemo{font-size:64px;text-align:center;line-height:1.2;letter-spacing:6px}
.mini-count{text-align:center;color:var(--ink-soft);font-size:14px;margin:4px 0 0}
.sort-item{display:flex;flex-direction:column;align-items:center;gap:4px;margin:4px auto 14px;background:var(--paper);border:3px dashed var(--line);border-radius:22px;padding:12px 18px;max-width:300px;font-size:20px;text-align:center}
.sort-item .emo{font-size:64px;line-height:1}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.bin{border:3px solid var(--ink);background:var(--card);border-radius:22px;padding:12px;font-weight:800;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 var(--press);font-family:'Baloo 2',sans-serif}
.bin .emo{font-size:40px;line-height:1.1}
.bin:active{transform:translateY(4px);box-shadow:0 1px 0 var(--press)}
.chip.wide{padding:0 14px;font-size:19px}
.order{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.ocard{position:relative;border:3px solid var(--ink);background:var(--card);border-radius:20px;padding:14px 8px;font-weight:700;font-size:19px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 var(--press)}
.ocard .emo{font-size:44px;line-height:1}
.ocard em{position:absolute;top:-10px;right:-8px;font-style:normal;background:var(--lowland);color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-weight:800}
.ocard em:empty{display:none}
.ocard.right{border-color:var(--lowland);background:var(--lowland-soft);box-shadow:none}
.obec-box{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--sun-soft);border-radius:18px;padding:12px}
.obec-box input{font:inherit;font-size:19px;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;min-width:0;flex:1 1 180px;background:var(--card);color:var(--ink)}
.wscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:18px}.wscroll svg{min-width:640px}
@media (min-width:700px){.wscroll+.mini-count{display:none}}
.zoomview{max-width:460px;margin:0 auto}
.rings{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:12px}
.rings span{display:flex;flex-direction:column;align-items:center;font-size:22px;padding:4px 6px;border-radius:12px;opacity:.45;min-width:52px}
.rings span small{font-size:11px;font-weight:700}
.rings span.past{opacity:.75}
.rings span.on{opacity:1;background:var(--sun-soft);outline:2px solid var(--sun)}
.shape{transition:filter .15s}.shape:hover{filter:brightness(1.08)}
.ill .scene{max-width:100%}
#print-area{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block}
  #print-area .sheet{border:0;padding:0}
}
@media (max-width:480px){.top-in{gap:5px!important;padding:8px 8px!important}.pass-btn{padding:5px 6px!important;font-size:14px}.lvl button{padding:6px 7px!important;font-size:12px!important}.hub-btn{flex-basis:34px!important;width:34px!important;height:36px!important;font-size:18px!important}.lvl .lv-age{display:none}}
@media (max-width:370px){.lvl button{padding:5px 5px!important;font-size:11px!important}}
</style>
</head>
<body>
<svg class="topo" id="topo" aria-hidden="true"></svg>
<header class="top"><div class="top-in">
  <button class="brand" id="homeBtn" aria-label="Domov – mapa výpravy"><span id="brandOwl"></span><span class="brand-txt"><b>Malí objavitelia</b><small>Slovensko – veľká výprava</small></span></button>
  <div class="lvl" role="group" aria-label="Úroveň">
    <button data-lv="1">Prvé kroky<span class="lv-age"> 5–7</span></button>
    <button data-lv="2">Objavitelia<span class="lv-age"> 7–9</span></button>
  </div>
  <button class="pass-btn" id="passBtn" aria-label="Cestovateľský pas">🎫 <span id="passCount">0</span></button>
</div></header>
<main id="app"></main>
<div class="next-bar" id="nextBar" hidden><div class="in" id="nextIn"></div></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="print-area"></div>

<script>
/* výslovnosť pre syntetický hlas: rozpísanie skratiek, jednotiek a čísel */
function plural(n,a,b,c){n=Math.abs(n);return n===1?a:(n>=2&&n<=4)?b:c}
function spk(t){let s=String(t).replace(/<[^>]+>/g,' ').replace(/\p{Extended_Pictographic}/gu,'').replace(/[▲★☐→↔·–—]/g,', ');
  s=s.replace(/(\d)[\u00a0 ](?=\d{3}(?!\d))/g,'$1').replace(/(\d)[\u00a0 ](?=\d{3}(?!\d))/g,'$1');
  const R=[[/m n\. m\./g,'metrov nad morom'],[/km²/g,'štvorcových kilometrov'],[/°C/g,' stupňov Celzia'],[/(\d+(?:,\d+)?)\s?%/g,'$1 percent'],
    [/\bnapr\./g,'napríklad'],[/\btzv\./g,'takzvaný'],[/\ba pod\./g,'a podobne'],[/\bpribl\./g,'približne'],[/\broč\./g,'ročník'],[/\btis\./g,'tisíc'],[/\bstor\./g,'storočie'],
    [/\bsv\. (\p{Lu}\p{Ll}*[ye])\b/gu,'svätej $1'],[/\bsv\. /g,'svätého '],
    [/(?<!\p{L})SHMÚ(?!\p{L})/gu,'Slovenský hydrometeorologický ústav'],[/\bSODB\b/g,'sčítanie obyvateľov, domov a bytov'],[/\bTANAP\b/g,'Tanap'],[/\bPIENAP\b/g,'Pienap'],[/\bNAPANT\b/g,'Napant'],
    [/\bCHKO\b/g,'chránená krajinná oblasť'],[/\bNP\b/g,'národný park'],[/\bUNESCO\b/g,'Unesko'],[/(?<!\p{L})EÚ(?!\p{L})/gu,'Európska únia'],[/\bSR\b/g,'Slovenskej republiky'],[/(?<!\p{L})MŠ(?!\p{L})/gu,'materská škola'],[/(?<!\p{L})ZŠ(?!\p{L})/gu,'základná škola'],
    [/\bD1\b/g,'dé jednotka'],[/\bD2\b/g,'dé dvojka'],[/ = /g,' je ']];
  R.forEach(([a,b])=>{s=s.replace(a,b)});

/* ---------- activity utils ---------- */
function finish(el,msg){tone(true);el.innerHTML=`<div class="done-card"><div class="big">🎉</div><h2>${msg||'Hotovo!'}</h2><p>Úloha je splnená. Pokračuj ďalej alebo si ju zahraj znova.</p><div class="row"><button class="btn soft" id="again">Hrať znova</button><button class="btn green" id="goNext">Ďalej: Hrajme sa</button></div></div>`;
  say('Hotovo! '+(msg||''));$('#again',el).onclick=()=>renderStep();$('#goNext',el).onclick=()=>{S.step=2;renderModule()};markSeen(1)}
function dotsHTML(n,i){return `<div class="dots" aria-hidden="true">${Array.from({length:n},(_,k)=>`<i class="${k<i?'on':''}"></i>`).join('')}</div>`}
function taskHTML(t){return `<div class="task"><p>${t}</p><button class="say" data-say="${esc(t)}" aria-label="Prečítaj úlohu">🔊</button></div>`}

/* M1 */
function actKde(el,lv){
  const tasks=lv===1?[['Polož loptu NA stôl.',['na']],['Polož loptu POD stôl.',['pod']],['Polož loptu PRED strom.',['pred']],['Schovaj loptu ZA strom.',['za']],['Polož loptu VEDĽA stola.',['vlavo','medzi']]]
   :[['Polož loptu VĽAVO od stola.',['vlavo']],['Polož loptu MEDZI stôl a strom.',['medzi']],['Polož loptu VPRAVO od stromu.',['vpravo']],['Schovaj loptu ZA strom.',['za']],['Polož loptu POD stôl.',['pod']],['Polož loptu NA stôl.',['na']]];
  const colors=['#E4572E','#2F8FD8','#FFC93C','#4FA867','#9B5DE5','#E4572E'];
  let i=0;
  function draw(){
    const [t]=tasks[i];
    el.innerHTML=taskHTML(t)+`<svg class="scene" viewBox="0 0 400 270" id="sc">${sceneTableTree({})}
      <g id="zones">${Object.entries(POS).map(([k,[x,y]])=>`<g class="zone" data-z="${k}" tabindex="0" role="button" aria-label="miesto"><circle cx="${x}" cy="${y}" r="24"/></g>`).join('')}</g></svg>
      <div class="feedback" id="fb" aria-live="polite"></div>${dotsHTML(tasks.length,i)}`;
    const b=document.createElementNS('http://www.w3.org/2000/svg','g');b.id='ball';b.innerHTML=ball(colors[i]);b.style.transition='transform .45s cubic-bezier(.3,1.4,.5,1)';b.style.transform='translate(200px,26px)';
    $('#front',el).appendChild(b);
    if(i>0)say(t);
    $$('.zone',el).forEach(z=>{const go=()=>place(z.dataset.z);z.onclick=go;z.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  }
  function place(z){
    const b=$('#ball',el),[x,y]=POS[z];(z==='za'?$('#behind',el):$('#front',el)).appendChild(b);
    requestAnimationFrame(()=>{b.style.transform=`translate(${x}px,${y}px)`});
    const fb=$('#fb',el);
    if(tasks[i][1].includes(z)){fb.className='feedback good';const p=praise();fb.textContent=p+' ✔';tone(true);say(p);$('#zones',el).style.pointerEvents='none';
      setTimeout(()=>{i++;if(i<tasks.length)draw();else finish(el,'Lopta je vždy tam, kde má byť!')},1300)}
    else{fb.className='feedback bad';fb.textContent='Skús ešte raz.';tone(false);$('#sc',el).classList.remove('shake');void el.offsetWidth;$('#sc',el).classList.add('shake')}
  }
  draw();
}

/* M2 */
function actZhora(el,lv){
  const rounds=lv===1?[['lopta',['trojuholnik']],['hrnek',['stol']],['stol',['lopta']],['auto',['auto:side']],['room',['mirror']]]
                     :[['hrnek',['hrnek:side','lopta']],['stolicka',['stol','stolicka:side']],['kniha',['kniha:side','stol']],['auto',['auto:side','stolicka']],['room',['mirror','wrong']]];
  let i=0;
  function draw(){
    const [obj,wrong]=rounds[i];let head,opts;
    if(obj==='room'){head=taskHTML('Toto je izba spredu. Ktorý plán ukazuje tú istú izbu zhora?')+roomSide();
      opts=shuffle([{h:roomPlan('ok'),ok:1},...wrong.map(w=>({h:roomPlan(w)}))]);}
    else{head=taskHTML(`Takto vyzerá ${NAMES[obj]} zboku. Ako vyzerá zhora?`)+`<div style="max-width:220px;margin:0 auto">${vsvg(obj,'side')}</div>`;
      opts=shuffle([{h:vsvg(obj,'top'),ok:1},...wrong.map(w=>{const [k,v]=w.split(':');return{h:vsvg(k,v||'top')}})]);}
    el.innerHTML=head+`<div class="opts" style="margin-top:12px">${opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-label="Možnosť ${k+1}">${o.h}</button>`).join('')}</div><div class="feedback" id="fb" aria-live="polite"></div>${dotsHTML(rounds.length,i)}`;
    if(i>0)say($('.task p',el).textContent);
    $$('.opt',el).forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.k];const fb=$('#fb',el);
      if(o.ok){b.classList.add('right');fb.className='feedback good';const p=praise();fb.textContent=p+' ✔';tone(true);say(p);$$('.opt',el).forEach(x=>x.disabled=true);setTimeout(()=>{i++;i<rounds.length?draw():finish(el,'Máš vtáčie oko!')},1200)}
      else{b.classList.add('wrong');fb.className='feedback bad';fb.textContent='Ešte raz – predstav si, že letíš nad ním.';tone(false)}});
  }
  draw();
}

/* M3 */
const START=[0,4],GOAL=[5,0],DIRS={U:[0,-1,'⬆️','hore'],D:[0,1,'⬇️','dole'],L:[-1,0,'⬅️','vľavo'],R:[1,0,'➡️','vpravo']};
function blocked(k,r){if(k<0||r<0||k>5||r>4)return 'kraj mapy';const ch=MAP[r][k];return (ch!=='.'&&ch!=='S'&&ch!=='H')?CELL[ch][0]:null}
function moveWalker(el,pos){const w=$('#walker',el);if(w)w.style.transform=`translate(${pos[0]*56+28}px,${pos[1]*56+28}px)`}
function actCesta(el,lv){lv===1?cestaDirect(el):cestaProgram(el)}
function cestaDirect(el){
  let pos=[...START],path=[[...START]],steps=0;
  function draw(){el.innerHTML=taskHTML('Doveď kamaráta z domu 🏠 až ku škole 🏫. Rybník a domy treba obísť.')+`<div id="g">${gridSVG(path,pos,{showPath:true})}</div>
   <div class="pad">${['','U',''].map(d=>d?padBtn(d):'<span></span>').join('')}${['L','D','R'].map(padBtn).join('')}</div><div class="feedback" id="fb" aria-live="polite"></div>`;
   $$('.pad button',el).forEach(b=>b.onclick=()=>step(b.dataset.d));}
  function step(d){const [dx,dy]=DIRS[d];const n=[pos[0]+dx,pos[1]+dy];const bl=blocked(...n);const fb=$('#fb',el);
    if(bl){fb.className='feedback bad';fb.textContent=`Tade to nejde – je tam ${bl}.`;tone(false);say(`Tade to nejde, je tam ${bl}.`);return}
    pos=n;path.push([...n]);steps++;fb.textContent='';$('#g',el).innerHTML=gridSVG(path,pos,{showPath:true});
    if(n[0]===GOAL[0]&&n[1]===GOAL[1])setTimeout(()=>finish(el,`Si v škole! Prešiel si ${steps} krokov.`),500)}
  draw();
}
function padBtn(d){return `<button data-d="${d}" aria-label="${DIRS[d][3]}">${DIRS[d][2]}<small>${DIRS[d][3]}</small></button>`}
function cestaProgram(el){
  let prog=[],phase=1;
  function draw(){
    if(phase===2)return describe();
    el.innerHTML=taskHTML('Naprogramuj cestu do školy. Poskladaj šípky a stlač Spusti.')+`<div id="g">${gridSVG([],START)}</div>
    <div class="prog" id="prog">${prog.length?prog.map(d=>`<span>${DIRS[d][2]}</span>`).join(''):'<em>Tu sa objaví tvoj program…</em>'}</div>
    <div class="pad">${['','U',''].map(d=>d?padBtn(d):'<span></span>').join('')}${['L','D','R'].map(padBtn).join('')}</div>
    <div class="row"><button class="btn soft small" id="undo">Zmazať poslednú</button><button class="btn green small" id="run">▶ Spusti</button></div><div class="feedback" id="fb" aria-live="polite"></div>${dotsHTML(2,0)}`;
    $$('.pad button',el).forEach(b=>b.onclick=()=>{if(prog.length<16){prog.push(b.dataset.d);draw()}});
    $('#undo',el).onclick=()=>{prog.pop();draw()};
    $('#run',el).onclick=run;
  }
  function run(){let pos=[...START],k=0;const fb=$('#fb',el);$$('button',el).forEach(b=>b.disabled=true);
    const spans=$$('#prog span',el);
    const t=setInterval(()=>{if(k>=prog.length){clearInterval(t);end(pos);return}
      spans.forEach(s=>s.classList.remove('run'));spans[k]&&spans[k].classList.add('run');
      const [dx,dy]=DIRS[prog[k]];const n=[pos[0]+dx,pos[1]+dy];const bl=blocked(...n);
      if(bl){clearInterval(t);fb.className='feedback bad';fb.textContent=`Bum! Na ${k+1}. kroku je ${bl}. Oprav program.`;tone(false);say(`Bum! Na ${k+1}. kroku je ${bl}.`);$$('button',el).forEach(b=>b.disabled=false);return}
      pos=n;moveWalker(el,pos);k++;
      if(pos[0]===GOAL[0]&&pos[1]===GOAL[1]){clearInterval(t);end(pos)}},420)}
  function end(pos){const fb=$('#fb',el);
    if(pos[0]===GOAL[0]&&pos[1]===GOAL[1]){fb.className='feedback good';fb.textContent='Program funguje! Si v škole. ✔';tone(true);say('Program funguje!');setTimeout(()=>{phase=2;draw()},1500)}
    else{fb.className='feedback bad';fb.textContent='Program skončil, ale ku škole ešte nie si. Pridaj šípky.';tone(false);$$('button',el).forEach(b=>b.disabled=false)}}
  function describe(){
    const route=[[0,4],[1,4],[2,4],[2,3],[3,3],[4,3],[5,3],[5,2],[5,1],[5,0]];
    const opts=shuffle([{t:'Od domu idem vpravo popod poštu. Pred obchodom zabočím hore. Potom idem vpravo popod fontánu a nakoniec hore až ku škole.',ok:1},
      {t:'Od domu idem hore popri strome a potom vpravo cez rybník rovno ku škole.'},
      {t:'Od domu idem vpravo za obchod a potom hore popri strome až ku škole.'}]);
    el.innerHTML=taskHTML('Červená čiara ukazuje cestu. Ktorý opis k nej patrí?')+gridSVG(route,null,{showPath:true})+`<div class="opts" style="grid-template-columns:1fr;margin-top:12px">${opts.map((o,k)=>`<button class="opt" style="font-weight:400;text-align:left;align-items:flex-start" data-k="${k}">${o.t}</button>`).join('')}</div><div class="feedback" id="fb" aria-live="polite"></div>${dotsHTML(2,1)}`;
    say('Červená čiara ukazuje cestu. Ktorý opis k nej patrí?');
    $$('.opt',el).forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.k];const fb=$('#fb',el);

      z.onclick=go;z.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});

/* ---------- diploma ---------- */

  <div style="width:130px;margin:0 auto">${owl()}</div><h1 style="font-family:'Baloo 2',sans-serif;font-size:44px;margin:10px 0 0">Diplom</h1>
  <p style="font-size:20px;margin:6px 0 18px">Malý objaviteľ Slovenska a sveta</p><p style="font-size:18px">Tento diplom získava</p>
  <p style="font-family:'Baloo 2',sans-serif;font-size:38px;margin:6px 0;border-bottom:2px solid #111;display:inline-block;min-width:60%">${name||'&nbsp;'}</p>
  <p style="font-size:18px;margin-top:14px">za úspešnú výpravu so sovou Buzolou<br>a všetkých 14 pečiatok v cestovateľskom pase.</p>
  <p style="font-size:34px;letter-spacing:6px">${COURSE.flatMap(p=>p.items).map(i=>i[2]).join(' ')}</p>
  <div style="display:flex;justify-content:space-between;margin-top:40px;font-size:15px"><span>Dátum: ______________</span><span>Podpis: ______________</span></div></div>`}
function openDiploma(){openDlg(`<h2>🎓 Diplom</h2><p>Všetkých 14 pečiatok je v pase! Napíš meno objaviteľa a vytlač diplom.</p><div class="obec-box"><input id="dipName" placeholder="Meno a priezvisko" autocomplete="off"><button class="btn green small" id="dipPrint">🖨️ Vytlačiť</button></div>`);
  $('#dipPrint').onclick=()=>{$('#print-area').innerHTML=`<div class="sheet">${diplomaHTML($('#dipName').value.trim())}</div>`;window.print()}}

/* ---------- rendering ---------- */
const app=$('#app');
function setLevel(l){S.level=l;store.set('level',l);$$('.lvl button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.lv===l));render()}
$$('.lvl button').forEach(b=>b.onclick=()=>setLevel(+b.dataset.lv));
$('#homeBtn').onclick=()=>{S.view='home';render()};
$('#passBtn').onclick=openPass;
function updatePass(){$('#passCount').textContent=Object.keys(S.badges).length}
function markSeen(step){const k=S.mod+'_'+S.level;S.seen[k]=Math.max(S.seen[k]||0,step);store.set('seen',S.seen)}

function render(){speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();updatePass();S.view==='home'?renderHome():renderModule();window.scrollTo({top:0})}

function renderHome(){
  $('#nextBar').hidden=true;
  const greet='Ahoj! Som sova Buzola. Poďme spolu objavovať svet – od našej triedy až po celé Slovensko!';
  app.innerHTML=`<section class="hero">${owl()}${bubble(greet)}
   <h1>Slovensko – veľká výprava</h1><p class="lead">Každá zastávka na ceste je jedna téma. Za splnený kvíz dostaneš pečiatku do cestovateľského pasu.</p></section>
   <div class="trail" id="trail"><svg class="path" id="trailPath" aria-hidden="true"></svg>
   ${COURSE.map(p=>`<div class="pack"><h2>${p.pack}</h2><span>${p.note}</span></div>`+p.items.map(([id,t,ic],k)=>{const ready=!!M[id];const got=S.badges[id];
      return `<button class="stop ${got?'done':''}" data-id="${id}" ${ready?'':'disabled'} style="margin-left:${[2,30,16,40,8][(k+COURSE.indexOf(p))%5]}%;max-width:calc(100% - ${[2,30,16,40,8][(k+COURSE.indexOf(p))%5]}%)">
       <span class="dot" aria-hidden="true">${ic}</span>${got?'<span class="stamp">✔</span>':''}<span class="lbl"><b>${t}</b><small>${ready?(got?'pečiatka získaná':'pripravené'):'čoskoro'}</small></span></button>`}).join('')).join('')}
   </div>`;
  $$('.stop:not([disabled])').forEach(b=>b.onclick=()=>{S.mod=b.dataset.id;S.step=0;S.view='mod';render()});
  requestAnimationFrame(drawTrail);
}
function drawTrail(){const tr=$('#trail');if(!tr)return;const box=tr.getBoundingClientRect();const pts=$$('.stop .dot',tr).map(d=>{const r=d.getBoundingClientRect();return[r.left-box.left+r.width/2,r.top-box.top+r.height/2]});
  if(pts.length<2)return;let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];const my=(y0+y1)/2;d+=` C${x0} ${my} ${x1} ${my} ${x1} ${y1}`}
  $('#trailPath').innerHTML=`<path d="${d}" fill="none" stroke="var(--hill)" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>`}
window.addEventListener('resize',()=>{if(S.view==='home')drawTrail()});

function renderModule(){
  const m=M[S.mod],lv=S.level,title=COURSE.flatMap(p=>p.items).find(i=>i[0]===S.mod)[1];const seen=S.seen[S.mod+'_'+lv]||0;
  app.innerHTML=`<div class="mhead"><button class="btn soft small" id="back" aria-label="Späť na mapu výpravy">🗺️ Výprava</button><button class="btn soft small" id="teach">👩‍🏫 Pre učiteľa</button></div><h1 class="mtitle">${m.icon} ${title}</h1>
   <nav class="steps" aria-label="Kroky">${STEPS.map(([ic,n],i)=>`<button data-s="${i}" ${i===S.step?'aria-current="step"':''} class="${i<seen||i===seen&&i<S.step?'ok':''}"><i>${i<seen?'✔':i+1}</i>${n}</button>`).join('')}</nav>
   <section class="card" id="stage"></section>`;
  $('#back').onclick=()=>{S.view='home';render()};$('#teach').onclick=openTeacher;
  $$('.steps button').forEach(b=>b.onclick=()=>{S.step=+b.dataset.s;renderModule()});
  const cur=$('.steps [aria-current]');cur&&cur.scrollIntoView({inline:'center',block:'nearest'});
  renderStep();
  const bar=$('#nextBar'),inn=$('#nextIn');bar.hidden=false;
  inn.innerHTML=`<button class="btn soft" id="prev" ${S.step===0?'disabled style="visibility:hidden"':''}>Späť</button>${S.step<4?`<button class="btn sun" id="nxt">Ďalej: ${STEPS[S.step+1][1]}</button>`:`<button class="btn sun" id="home2">Na mapu výpravy</button>`}`;
  $('#prev')&&($('#prev').onclick=()=>{S.step--;renderModule();window.scrollTo({top:0})});
  $('#nxt')&&($('#nxt').onclick=()=>{markSeen(S.step+1);S.step++;renderModule();window.scrollTo({top:0})});
  $('#home2')&&($('#home2').onclick=()=>{S.view='home';render()});
}
function renderStep(){
  const m=M[S.mod],lv=S.level,st=$('#stage');
  if(S.step===0){const story=typeof m.story[lv]==='function'?m.story[lv]():m.story[lv];st.innerHTML=`<div class="story">${owl()}${bubble(story)}</div>${m.extra?m.extra():''}<h2 style="margin-top:16px">${lv===1?'Slová na dnes':'Kľúčové slová'}</h2><div class="words">${m.words[lv].map(w=>`<span>${w}</span>`).join('')}</div>`;m.onStory&&m.onStory();}
  else if(S.step===1){st.innerHTML='<div id="act"></div>';m.act($('#act'),lv);const t=$('#act .task p');t&&say(t.textContent)}
  else if(S.step===2){const p=m.play;st.innerHTML=`<div class="play"><span class="tag">Aktivita bez obrazovky</span><h2>${p.name}</h2><p><b>Potrebujeme:</b> ${p.need}</p><h3>Ako na to</h3><ol>${p.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
   <h3>${lv===2?'Pre Objaviteľov':'Keď to už ide (Objavitelia)'}</h3><p>${p.l2}</p><h3>Vonku</h3><p>${p.out}</p></div>`;markSeen(3)}
  else if(S.step===3){st.innerHTML=`<p style="margin-top:0">Pracovný list pre úroveň <b>${lv===1?'Prvé kroky':'Objavitelia'}</b>. Úroveň prepneš hore.</p><div class="sheet" id="sheetPrev">${m.sheet(lv)}</div><div class="row"><button class="btn green" id="print">🖨️ Vytlačiť list</button></div><p style="font-size:15px;color:var(--ink-soft);text-align:center">Ak sa tlač neotvorí, otvorte stránku v samostatnom okne prehliadača.</p>`;
    $('#print').onclick=()=>{$('#print-area').innerHTML=`<div class="sheet">${$('#sheetPrev').innerHTML}</div>`;window.print()};markSeen(4)}
  else quiz(st,m,lv);
}

function quiz(st,m,lv){
  const qs=pickQ(m,lv);let i=0,score=0,tried=false;
  function draw(){const q=qs[i];const opts=shuffle(q.o);
    st.innerHTML=`<h2>Kvíz · otázka ${i+1} z ${qs.length}</h2>${taskHTML(q.q)}${q.img?`<div style="max-width:420px;margin:0 auto 10px">${q.img()}</div>`:''}
     <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.e?`<span class="emo">${o.e}</span>`:''}${o.s||''}${o.t?`<span>${o.t}</span>`:''}</button>`).join('')}</div><div class="feedback" id="fb" aria-live="polite"></div>${dotsHTML(qs.length,i)}`;
    say(q.q);tried=false;
    $$('.opt',st).forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.k];const fb=$('#fb',st);
      if(o.ok){if(!tried)score++;b.classList.add('right');tone(true);fb.className='feedback good';fb.textContent=praise()+' ✔';$$('.opt',st).forEach(x=>x.disabled=true);setTimeout(()=>{i++;i<qs.length?draw():end()},1100)}
      else{tried=true;b.classList.add('wrong');b.disabled=true;tone(false);fb.className='feedback bad';fb.textContent='Skús inú odpoveď.'}})}

S.mute=store.get('mute',false);
{const _tone=tone;tone=function(ok){if(!S.mute)_tone(ok)}}
let __clickSay=0;document.addEventListener('click',e=>{if(e.target.closest('[data-say],#isay'))__clickSay=Date.now()},true);
{const _say=say;say=function(t,m){if(S.mute&&Date.now()-__clickSay>600)return;return _say(t,m)}}
(function(){const host=document.querySelector('.top-in');if(!host)return;const b=document.createElement('button');b.className='pass-btn';b.id='muteBtn';
 const upd=()=>{b.textContent=S.mute?'🔇':'🔊';b.setAttribute('aria-pressed',S.mute);b.setAttribute('aria-label',S.mute?'Zvuk je vypnutý – zapnúť':'Vypnúť zvuk');b.title=S.mute?'Zvuk je vypnutý (texty si môžeš pustiť tlačidlom pri texte)':'Vypnúť zvuk'};
 b.onclick=()=>{S.mute=!S.mute;store.set('mute',S.mute);if(S.mute){try{speechSynthesis.cancel()}catch(e){}}upd();toast(S.mute?'Zvuk je vypnutý.':'Zvuk je zapnutý.')};
 upd();const pass=document.getElementById('passBtn');host.insertBefore(b,document.getElementById('autoBtn')||pass)})();
(function(){const a=document.getElementById('autoBtn');if(!a)return;const fix=()=>{a.textContent='🗣️';a.style.opacity=S.auto?1:.45};fix();a.addEventListener('click',()=>setTimeout(fix,0))})();
