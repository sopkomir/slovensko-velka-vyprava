<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cestovatelia – Slovensko krok za krokom</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1B2A41">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
.hub-btn{flex:0 0 40px;width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--line);background:var(--card);border-radius:12px;font-size:22px;text-decoration:none;color:inherit;font-weight:800}

:root{
  --paper:#EAF0EC;--card:#FFFFFF;--ink:#1B2A41;--ink-soft:#4F5F75;--line:#CBD7CF;--topo:#D7E2DA;--press:rgba(27,42,65,.25);
  --red:#D62828;--blue:#1D5FC4;--green:#2A9D4B;--yellow:#F2C200;--tan:#E6D49B;--brown:#7A4A22;
  --lowland:#2A9D4B;--lowland-soft:#DCEFDF;--sun:#F2C200;--sun-soft:#FFF4C4;--river-soft:#DCE8F8;--berry:#D62828;--hill-soft:#F3E7C8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121C2B;--card:#1B2940;--ink:#EEF3FA;--ink-soft:#B6C3D6;--line:#33476A;--topo:#18263B;--press:rgba(0,0,0,.5);--lowland-soft:#1C3A2B;--sun-soft:#3F3818;--river-soft:#17345A;--hill-soft:#3E3320}}
:root[data-theme="dark"]{--paper:#121C2B;--card:#1B2940;--ink:#EEF3FA;--ink-soft:#B6C3D6;--line:#33476A;--topo:#18263B;--press:rgba(0,0,0,.5);--lowland-soft:#1C3A2B;--sun-soft:#3F3818;--river-soft:#17345A;--hill-soft:#3E3320}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito','Segoe UI',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent;min-height:100vh}
h1,h2,h3{font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;line-height:1.12;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
svg{max-width:100%}
:focus-visible{outline:4px solid var(--yellow);outline-offset:3px;border-radius:10px}
.topo{position:fixed;inset:0;width:100%;height:100%;z-index:-1;color:var(--topo);pointer-events:none}
/* trail marker */
.marker{display:inline-block;flex:0 0 auto;border:2px solid var(--ink);border-radius:3px;background:linear-gradient(#fff 0 33%,var(--mc) 33% 67%,#fff 67%);vertical-align:-4px}
.m-cervena{--mc:var(--red)}.m-modra{--mc:var(--blue)}.m-zelena{--mc:var(--green)}.m-zlta{--mc:var(--yellow)}
/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px;text-align:left}
#brandOwl{display:block;width:34px;flex:0 0 34px}#brandOwl svg{width:34px;height:40px;display:block}
.brand b{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;display:block;line-height:1}
.brand small{font-size:12px;color:var(--ink-soft)}
.lvl{margin-left:auto;display:flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.lvl button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.lvl button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pass-btn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-weight:800;display:flex;gap:6px;align-items:center}
@media (max-width:520px){.brand-txt small{display:none}.lvl button{padding:6px 9px;font-size:13px}}
@media (max-width:420px){.brand-txt{display:none}}
main{max-width:960px;margin:0 auto;padding:16px 14px 110px}
/* buttons */
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;font-size:17px;background:var(--ink);color:var(--paper);box-shadow:0 4px 0 var(--press);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:50px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.btn.soft{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.sun{background:var(--yellow);color:#1B2A41}
.btn.green{background:var(--green);color:#fff}
.btn.small{padding:8px 13px;font-size:15px;min-height:40px;border-radius:12px}
.say{border:2px solid var(--line);background:var(--card);border-radius:50%;width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;font-size:19px}
/* hero */
.hero{display:grid;grid-template-columns:1fr 1.25fr;gap:18px;align-items:center;margin:10px 0 8px}
.hero h1{font-size:clamp(44px,9vw,78px);font-weight:800;line-height:.95}
.hero .sub{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;margin:6px 0 10px;color:var(--brown)}
.hero .lead{margin:0;color:var(--ink-soft);max-width:44ch}
.hero-r{border-radius:20px;overflow:hidden;border:2px solid var(--line);background:#fff;transform:rotate(1.2deg);box-shadow:0 10px 30px rgba(27,42,65,.12)}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero-r{transform:none}}
.guide{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start;margin:18px 0 6px}
.guide .owl{width:76px}
.bubble{background:var(--card);border:2px solid var(--ink);border-radius:20px 20px 20px 6px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.bubble p{margin:0;flex:1}
/* routes */
.route{margin:26px 0 8px}
.route header{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.route h2{font-size:26px}.route header span{color:var(--ink-soft);font-size:14px;font-weight:700}
.stops{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sign{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--ink);border-radius:10px 26px 26px 10px;padding:10px 14px 10px 10px;text-align:left;box-shadow:0 4px 0 var(--press);min-height:68px}
.sign:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.sg-n{flex:0 0 34px;height:34px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;border:2px solid var(--ink);background:linear-gradient(#fff 0 30%,var(--rc) 30% 70%,#fff 70%);color:transparent;text-shadow:none}
.r-cervena{--rc:var(--red)}.r-modra{--rc:var(--blue)}.r-zelena{--rc:var(--green)}
.sg-t{flex:1}.sg-t b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:18px;line-height:1.15}.sg-t small{color:var(--ink-soft);font-weight:700}
.sg-i{font-size:28px}
.sign.done{border-color:var(--green)}.sign.done small{color:var(--green)}
.sign[disabled]{opacity:.55;box-shadow:none;border-style:dashed;cursor:default}
/* module */
.mhead{display:flex;justify-content:space-between;gap:10px;margin:4px 0 8px}
.mtitle{font-size:clamp(28px,6vw,42px);margin:0 0 10px;display:flex;align-items:center;gap:12px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}.steps::-webkit-scrollbar{display:none}
.steps button{flex:0 0 auto;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:5px 12px 5px 6px;display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px}
.steps button i{font-style:normal;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--paper);font-size:14px}
.steps button[aria-current="step"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.steps button[aria-current="step"] i{background:var(--yellow)}
.steps button.ok i{background:var(--green);color:#fff}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}
.card h2{font-size:24px;margin-bottom:6px}
.read-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sec{margin:14px 0;max-width:68ch}.sec h2{font-size:23px;margin-bottom:4px}.sec p{margin:0;font-size:18px}
.sec.extra{border-left:5px solid var(--blue);padding-left:14px}
.tag{display:inline-block;background:var(--hill-soft);border-radius:8px;padding:2px 10px;font-weight:800;font-size:14px;margin-bottom:6px}.tag.t2{background:var(--river-soft)}
.g{border:0;background:none;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--blue)}
.gpop{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);border-radius:16px;padding:12px 56px 12px 16px;width:min(520px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.gpop p{margin:4px 0 0}.gpop .say{position:absolute;right:8px;top:8px;background:var(--card);color:var(--ink)}
.fact,.trip{border-radius:16px;padding:12px 16px;margin:16px 0;max-width:68ch}
.fact{background:var(--sun-soft)}.fact p,.trip p{margin:4px 0 0}
.trip{background:var(--lowland-soft);display:flex;gap:12px;align-items:flex-start}
.hint{font-size:14px;color:var(--ink-soft);text-align:center}
.task{display:flex;gap:12px;align-items:center;background:var(--sun-soft);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:18px;font-weight:800}
.task p{margin:0;flex:1}
.scene{width:100%;height:auto;display:block;border-radius:14px;touch-action:manipulation}
.ill{max-width:560px;margin:0 auto 12px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 0}.dots i{width:11px;height:11px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--green)}
.mini-count{text-align:center;color:var(--ink-soft);font-size:13px;margin:4px 0 0}
.feedback{min-height:28px;text-align:center;font-weight:800;margin-top:8px}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}
.zone{cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--press);min-height:54px;justify-content:center;text-align:center}
.opt svg{width:100%;max-width:220px;height:auto}.opt .emo{font-size:40px;line-height:1}
.opt.right{border-color:var(--green);background:var(--lowland-soft)}.opt.wrong{border-color:var(--red)}
.opt:active{transform:translateY(2px);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.chip{border:2px solid var(--ink);background:var(--card);border-radius:10px;min-height:44px;padding:0 12px;font-size:16px;font-weight:800;box-shadow:0 3px 0 var(--press)}
.chip[aria-pressed="true"]{background:var(--yellow);color:#1B2A41}.chip:disabled{opacity:.3;box-shadow:none}
.bigemo{font-size:56px;text-align:center;line-height:1.2}
.sort-item{display:flex;flex-direction:column;align-items:center;gap:2px;margin:4px auto 12px;background:var(--paper);border:2px dashed var(--line);border-radius:18px;padding:10px 16px;max-width:340px;font-size:19px;text-align:center}
.sort-item .emo{font-size:52px;line-height:1}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bin{border:2px solid var(--ink);background:var(--card);border-radius:16px;padding:10px;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--press)}
.bin .emo{font-size:32px;line-height:1.1}.bin:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.order{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ocard{position:relative;border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:12px 8px;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 var(--press)}
.ocard .emo{font-size:30px;line-height:1}.ocard em{position:absolute;top:-10px;right:-8px;font-style:normal;background:var(--green);color:#fff;border-radius:6px;width:30px;height:30px;display:grid;place-items:center;font-weight:800}.ocard em:empty{display:none}
.ocard.right{border-color:var(--green);background:var(--lowland-soft);box-shadow:none}
.wscroll,#tz{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}.wscroll svg{min-width:640px}#tz svg.cvmap{min-width:620px}
.tbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:640px){.twin{grid-template-columns:1fr}}
.cap{margin:0 0 4px;font-weight:800;font-size:14px;color:var(--ink-soft)}
.cwrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}.cwrap canvas{position:absolute;inset:0;width:100%;height:100%}.cwrap #ct{position:relative}
.slider{display:flex;flex-direction:column;gap:6px;margin:14px auto 0;max-width:520px;font-weight:700}.slider input{width:100%;accent-color:var(--blue);height:32px}
.checks{display:grid;gap:8px;margin-top:10px}.chk{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:12px;padding:10px 12px;font-weight:700}.chk input{width:26px;height:26px;accent-color:var(--green);flex:0 0 26px}
.play ol{padding-left:24px;margin:8px 0}.play li{margin:6px 0}.play h3{font-size:19px;margin-top:14px}
.next-bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:2px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.next-bar .in{max-width:960px;margin:0 auto;display:flex;gap:10px;justify-content:space-between}
.done-card{text-align:center;padding:10px}.done-card .big{font-size:46px}
.sheet{background:#fff;color:#111;border-radius:10px;padding:22px;border:1px solid #ccc;font-family:'Nunito',sans-serif}
.sheet .sh-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:10px;flex-wrap:wrap}
.sheet h2{font-size:25px;margin:2px 0 6px;color:#111}.sheet p{margin:7px 0}.sheet svg{display:block;margin:8px auto;width:100%;height:auto}.sheet .lines{border-bottom:1.5px solid #555;height:32px}
dialog{border:0;border-radius:22px;padding:0;max-width:min(680px,94vw);width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(18,28,43,.55)}
.dlg{padding:20px;max-height:84vh;overflow:auto}.dlg h2{font-size:26px;margin-bottom:8px}.dlg h3{font-size:18px;margin:14px 0 4px}.dlg ul{margin:4px 0;padding-left:22px}.dlg .close{float:right}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.badge{border:2px dashed var(--line);border-radius:16px;padding:10px;text-align:center;font-size:13px}
.badge .st{width:70px;height:70px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:32px;border:5px double var(--line)}
.badge.got{border-style:solid;border-color:var(--green)}.badge.got .st{border-color:var(--green);background:var(--lowland-soft)}.badge b{display:block;font-size:14px}
.reveal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(18,28,43,.6);padding:20px}
.reveal .box{background:var(--card);border-radius:26px;padding:24px 20px;text-align:center;max-width:360px;width:100%}
.reveal .st{width:140px;height:140px;margin:6px auto 12px;border-radius:50%;display:grid;place-items:center;font-size:64px;border:9px double var(--green);background:var(--lowland-soft);animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:scale(2.4) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:15px}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@media (min-width:700px){.swipe{display:none}}
.stopcard{background:var(--paper);border-radius:18px;padding:14px;margin-top:12px}.sc-h{display:flex;gap:12px;align-items:center}.sc-h small{color:var(--ink-soft);font-weight:800}.sc-h h2{font-size:24px}.sc-h div{flex:1}.sc-e{font-size:40px}.stopcard>p{font-size:17px;margin:8px 0}.sc-q{margin-top:12px!important}
#print-area{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{@page{size:A4;margin:12mm}body{background:#fff}body>*:not(#print-area){display:none!important}#print-area{display:block}#print-area .sheet{border:0;padding:0}}
</style>
</head>
<body>
<svg class="topo" id="topo" aria-hidden="true"></svg>
<header class="top"><div class="top-in">
  <button class="brand" id="homeBtn" aria-label="Domov – trasy"><span id="brandOwl"></span><span class="brand-txt"><b>Cestovatelia</b><small>Slovensko krok za krokom</small></span></button>
  <div class="lvl" role="group" aria-label="Ročník"><button data-lv="1">4. ročník</button><button data-lv="2">5. ročník</button></div>
  <button class="pass-btn" id="passBtn" aria-label="Cestovateľský pas">🎫 <span id="passCount">0</span></button>
</div></header>
<main id="app"></main>
<div class="next-bar" id="nextBar" hidden><div class="in" id="nextIn"></div></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="print-area"></div>
<script>
/* výslovnosť pre syntetický hlas: rozpísanie skratiek, jednotiek a čísel */
function plural(n,a,b,c){n=Math.abs(n);return n===1?a:(n>=2&&n<=4)?b:c}
function spk(t){let s=String(t).replace(/<[^>]+>/g,' ').replace(/\p{Extended_Pictographic}/gu,'').replace(/[▲★☐→↔·–—]/g,', ');
  s=s.replace(/(\d)[\u00a0 ](?=\d{3}(?!\d))/g,'$1').replace(/(\d)[\u00a0 ](?=\d{3}(?!\d))/g,'$1');
  const R=[[/m n\. m\./g,'metrov nad morom'],[/km²/g,'štvorcových kilometrov'],[/°C/g,' stupňov Celzia'],[/(\d+(?:,\d+)?)\s?%/g,'$1 percent'],
    [/\bnapr\./g,'napríklad'],[/\btzv\./g,'takzvaný'],[/\ba pod\./g,'a podobne'],[/\bpribl\./g,'približne'],[/\broč\./g,'ročník'],[/\btis\./g,'tisíc'],[/\bstor\./g,'storočie'],
    [/\bsv\. (\p{Lu}\p{Ll}*[ye])\b/gu,'svätej $1'],[/\bsv\. /g,'svätého '],
    [/(?<!\p{L})SHMÚ(?!\p{L})/gu,'Slovenský hydrometeorologický ústav'],[/\bSODB\b/g,'sčítanie obyvateľov, domov a bytov'],[/\bTANAP\b/g,'Tanap'],[/\bPIENAP\b/g,'Pienap'],[/\bNAPANT\b/g,'Napant'],
    [/\bCHKO\b/g,'chránená krajinná oblasť'],[/\bNP\b/g,'národný park'],[/\bUNESCO\b/g,'Unesko'],[/(?<!\p{L})EÚ(?!\p{L})/gu,'Európska únia'],[/\bSR\b/g,'Slovenskej republiky'],[/(?<!\p{L})MŠ(?!\p{L})/gu,'materská škola'],[/(?<!\p{L})ZŠ(?!\p{L})/gu,'základná škola'],
    [/\bD1\b/g,'dé jednotka'],[/\bD2\b/g,'dé dvojka'],[/ = /g,' je ']];
  R.forEach(([a,b])=>{s=s.replace(a,b)});
  const U={km:['kilometer','kilometre','kilometrov'],cm:['centimeter','centimetre','centimetrov'],mm:['milimeter','milimetre','milimetrov'],m:['meter','metre','metrov']};

/* ---------- contour engine ---------- */
const TER={
 kopec:(x,y)=>{const sx=x<.42?.2:.085;return 60+840*Math.exp(-(((x-.42)/sx)**2+((y-.5)/.24)**2)/2)},
 dva:(x,y)=>80+720*Math.exp(-(((x-.3)/.13)**2+((y-.52)/.18)**2)/2)+560*Math.exp(-(((x-.72)/.12)**2+((y-.45)/.16)**2)/2),
 udolie:(x,y)=>140+1100*Math.abs(x-.5)**1.4+320*(1-y),
 plosina:(x,y)=>{const r=Math.hypot((x-.5)/1.35,(y-.5));return 110+620/(1+Math.exp((r-.27)/.022))},
 rovina:(x,y)=>130+190*x+15*Math.sin(y*4)};
const TNAME={kopec:'vrch',dva:'dva vrchy so sedlom',udolie:'údolie',plosina:'plošina',rovina:'rovina'};
function contourPath(f,L,W,H,nx=72,ny=48){let d='';const gx=W/nx,gy=H/ny;const z=[];for(let j=0;j<=ny;j++){z[j]=[];for(let i=0;i<=nx;i++)z[j][i]=f(i/nx,j/ny)}
  const ip=(a,b,za,zb)=>a+(b-a)*((L-za)/(zb-za));
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=z[j][i],b=z[j][i+1],c=z[j+1][i+1],e=z[j+1][i];const x=i*gx,y=j*gy;
    const pts=[];if((a<L)!==(b<L))pts.push([ip(x,x+gx,a,b),y]);if((b<L)!==(c<L))pts.push([x+gx,ip(y,y+gy,b,c)]);if((e<L)!==(c<L))pts.push([ip(x,x+gx,e,c),y+gy]);if((a<L)!==(e<L))pts.push([x,ip(y,y+gy,a,e)]);
    for(let k=0;k+1<pts.length;k+=2)d+=`M${pts[k][0].toFixed(1)} ${pts[k][1].toFixed(1)}L${pts[k+1][0].toFixed(1)} ${pts[k+1][1].toFixed(1)}`}
  return d}
function contourSVG(t,{W=360,H=240,step=100,water=null,labels=true,pts=null,line=false,river=true,bg=true}={}){const f=TER[t];let s=`<svg class="scene" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vrstevnicová mapa">${bg?`<rect width="${W}" height="${H}" fill="${line?'#fff':'#FBF7EC'}" stroke="#ccc"/>`:''}`;
  for(let L=step;L<1000;L+=step){const d=contourPath(f,L,W,H);if(d)s+=`<path d="${d}" fill="none" stroke="${line?'#333':(water&&L===water?'#1D5FC4':'#A0602D')}" stroke-width="${water&&L===water?3:(L%500===0?2:1.1)}"/>`}
  if(river&&t==='udolie')s+=`<path d="M${W/2} 0V${H}" stroke="#1D5FC4" stroke-width="3" stroke-dasharray="${line?'6 4':''}"/><path d="M${W/2-7} ${H-24}l7 12 7-12" fill="none" stroke="#1D5FC4" stroke-width="2.5"/>`;
  if(labels){if(t==='kopec')s+=`<path d="M${.42*W} ${.5*H-6}l5 8h-10z" fill="#1B2A41"/><text x="${.42*W+8}" y="${.5*H-6}" font-size="12" font-weight="700">900</text>`;
   if(t==='dva')s+=`<path d="M${.3*W} ${.52*H-6}l5 8h-10z" fill="#1B2A41"/><text x="${.3*W+8}" y="${.52*H-6}" font-size="12" font-weight="700">800</text><path d="M${.72*W} ${.45*H-6}l5 8h-10z" fill="#1B2A41"/><text x="${.72*W+8}" y="${.45*H-6}" font-size="12" font-weight="700">640</text>`}
  if(pts)pts.forEach(([n,x,y])=>{s+=`<circle cx="${x*W}" cy="${y*H}" r="7" fill="#D62828" stroke="#fff" stroke-width="2"/><text x="${x*W+10}" y="${y*H+5}" font-size="15" font-weight="800" fill="#D62828" paint-order="stroke" stroke="#fff" stroke-width="3">${n}</text>`});
  return s+'</svg>'}
function profileSVG(t,{W=360,H=130,water=null,mini=false}={}){const f=TER[t];const yv=t==='udolie'?.75:.5;let p=`M0 ${H}`;for(let i=0;i<=90;i++){const x=i/90;const z=f(x,yv);p+=`L${(x*W).toFixed(1)} ${(H-z/1000*(H-10)).toFixed(1)}`}p+=`L${W} ${H}Z`;
  let s=`<svg class="scene" viewBox="0 0 ${W} ${H}" role="img" aria-label="Profil terénu"><rect width="${W}" height="${H}" fill="#EAF4FB"/>`;
  if(water!=null){const wy=H-water/1000*(H-10);s+=`<rect x="0" y="${wy}" width="${W}" height="${H-wy}" fill="#5BA8DE" opacity=".75"/>`}
  s+=`<path d="${p}" fill="#B98A5E" stroke="#6E4527" stroke-width="2" ${water!=null?'opacity=".92"':''}/>`;
  if(water!=null){const wy=H-water/1000*(H-10);s+=`<path d="M0 ${wy}H${W}" stroke="#1D5FC4" stroke-width="2" stroke-dasharray="6 4"/><text x="6" y="${wy-5}" font-size="12" font-weight="800" fill="#1D5FC4">${water} m</text>`}
  if(!mini)[200,400,600,800].forEach(v=>{const y=H-v/1000*(H-10);s+=`<path d="M${W-30} ${y}H${W}" stroke="#555"/><text x="${W-32}" y="${y+4}" font-size="10" text-anchor="end" fill="#555">${v}</text>`});
  return s+'</svg>'}

    <div class="row"><button class="btn sun" id="exNext">Rozumiem, ďalej</button></div>${dotsHTML(pn,pi)}`;
  function update(){$('#pf',el).innerHTML=profileSVG(t,{water:w});$('#ct',el).innerHTML=contourSVG(t,{water:w,bg:false});$('#wlt',el).innerHTML=`Hladina vody: <b>${w} m n. m.</b>`;
    const cv=$('#cv',el),ctx=cv.getContext('2d'),f=TER[t];const im=ctx.createImageData(360,240);
    const land=[[159,208,138],[176,214,140],[214,214,150],[230,212,155],[222,190,130],[205,165,110],[185,140,95],[165,118,80],[145,98,66],[125,82,55]];
    for(let j=0;j<240;j++)for(let i=0;i<360;i++){const z=f(i/360,j/240);const k=(j*360+i)*4;const col=z<w?[91,168,222]:land[Math.min(9,Math.floor(z/100))];im.data[k]=col[0];im.data[k+1]=col[1];im.data[k+2]=col[2];im.data[k+3]=z<w?235:170}
    ctx.putImageData(im,0,0);$$('[data-t]',el).forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t))}
  $$('[data-t]',el).forEach(b=>b.onclick=()=>{t=b.dataset.t;update();say(TNAME[t])});
  $('#wl',el).oninput=e=>{w=+e.target.value;update()};
  $('#exNext',el).onclick=next;update()}

povrch:{icon:'🏔️',badge:'Horolezec',
 text:[
  {h:'Hory a nížiny',p:`Väčšinu Slovenska tvoria pohoria. Patria do veľkého horstva ${g('karpaty')}, ktoré sa v oblúku tiahne cez viaceré štáty. Na juhu a na východe sú rovinaté ${g('nizina','nížiny')} – patria do ${g('panva','Panónskej panvy')}.`},
  {h:'Najznámejšie pohoria',p:`Na severe sa dvíhajú <b>Tatry</b> s Gerlachovským štítom (2 655 m) a Lomnickým štítom. Pod nimi sú <b>Nízke Tatry</b> s Ďumbierom (2 043 m). Ďalej <b>Malá a Veľká Fatra</b>, rozsiahle <b>Slovenské rudohorie</b>, <b>Malé Karpaty</b> pri Bratislave a na východe <b>Vihorlatské vrchy</b> a <b>Slanské vrchy</b>.`},
  {h:'Kotliny',p:`Medzi pohoriami ležia ${g('kotlina','kotliny')} – nižšie územia obklopené horami. Napríklad Podtatranská, Liptovská, Turčianska, Zvolenská či Košická kotlina. Ľudia tu odpradávna stavali dediny a mestá, lebo tu bolo miesto na polia aj na cesty.`},
  {h:'Tri nížiny',p:`<b>Podunajská nížina</b> je najväčšia, najteplejšia a najúrodnejšia – je to „obilnica Slovenska“. <b>Záhorská nížina</b> na západe má piesky a borovicové lesy. <b>Východoslovenská nížina</b> leží pri Michalovciach a Trebišove, pretína ju veľa riek.`},
  {h:'Ako vznikli pohoria',lv:2,p:`Karpaty vznikli ${g('horotvor')}. Časti zemskej kôry na seba tlačili a horniny sa vrásnili a dvíhali – podobne ako obrus, keď ho na stole posúvaš k sebe. Trvalo to milióny rokov a pohoria sa dvíhajú aj dnes, len veľmi pomaly.`},
  {h:'Doliny, tiesňavy a kaňony',lv:2,p:`${g('rdolina','Riečna dolina')} má tvar písmena V – vyhĺbila ju rieka. ${g('ldolina','Ľadovcová dolina')} má tvar U – vymodeloval ju ľadovec, ako ich vidíš v Tatrách. ${g('ties','Tiesňava')} je úzka dolina so strmými skalami (Zádielska tiesňava v Slovenskom krase), ${g('kanon')} je hlboká úzka dolina rieky (Prielom Hornádu v Slovenskom raji).`}],

voda:{icon:'💧',badge:'Vodník',
 text:[
  {h:'Rieky z našich hôr',p:`Väčšina riek na Slovensku pramení v našich horách a tečie z hôr do nížin. Najdlhšou riekou, ktorá tečie územím Slovenska, je <b>Váh</b> (403 km). Najväčšou riekou je <b>Dunaj</b> – na juhu tvorí hranicu s Maďarskom. Ďalšie dôležité rieky sú <b>Hron, Nitra, Hornád, Ipeľ, Bodrog, Poprad</b>.`},
  {h:'Dve moria',p:`Takmer všetky naše rieky odvádzajú vodu do Dunaja a ten do <b>Čierneho mora</b>. Len <b>Poprad</b> a <b>Dunajec</b> tečú na sever, do <b>Baltského mora</b>. Územie, z ktorého voda odteká do jedného mora, je ${g('umorie')}. Hranica medzi úmoriami je ${g('rozvodie')} – vedie po hrebeňoch hôr.`},
  {h:'Plesá a vodné nádrže',p:`V Tatrách je veľa ${g('pleso','plies')} – horských jazier, ktoré vznikli činnosťou ľadovca. Najväčšie a najhlbšie je Veľké Hincovo pleso, najznámejšie Štrbské pleso. Ľudia postavili aj ${g('nadrz','vodné nádrže')}: Oravskú priehradu, Liptovskú Maru či Zemplínsku šíravu pri Michalovciach.`},
  {h:'Liečivé pramene',p:`Slovensko je bohaté na ${g('mineral','minerálne pramene')}. Niektoré sú teplé a liečivé – pri nich vznikli kúpele: Piešťany, Bardejovské Kúpele, Trenčianske Teplice, Rajecké Teplice a ďalšie.`},
  {h:'Cesta rieky',lv:2,p:`Každá rieka má <b>prameň</b> (začiatok), <b>prítoky</b> (menšie rieky, ktoré do nej vtekajú) a <b>ústie</b> (koniec). Váh vzniká sútokom Čierneho a Bieleho Váhu a ústi do Dunaja pri Komárne. Hron pramení pod Kráľovou hoľou a ústi do Dunaja pri Štúrove.`}],

pocasie:{icon:'🌦️',badge:'Meteorológ',
 text:[
  {h:'Počasie a podnebie',p:`${g('pocasie','Počasie')} je stav ovzdušia práve teraz – dnes prší, zajtra bude slnko. ${g('podnebie','Podnebie')} je dlhodobý ráz počasia na jednom mieste: napríklad v Tatrách býva chladno a veľa snehu, na Podunajskej nížine teplo a sucho.`},
  {h:'Čo meria meteorológ',p:`Meteorológovia merajú ${g('metprvky')}: <b>teplotu</b> (teplomerom), <b>zrážky</b> (zrážkomerom), <b>vietor</b> (vetromerom), <b>oblačnosť</b> a <b>tlak vzduchu</b> (tlakomerom). Pozorujú aj ${g('javy')} – búrky, hmlu, rosu, námrazu či dúhu. Predpoveď počasia pre Slovensko pripravuje Slovenský hydrometeorologický ústav (SHMÚ).`},
  {h:'Čím vyššie, tým chladnejšie',p:`S výškou teplota klesá – asi o 0,6 °C na každých 100 metrov. Keď je v Poprade (asi 700 m n. m.) 20 °C, na Lomnickom štíte o 2 000 m vyššie je asi o 12 °C chladnejšie. Preto v horách leží sneh dlhšie a najteplejšie je na Podunajskej nížine.`},
  {h:'Rastliny a zvieratá podľa výšky',p:`S výškou sa menia aj rastliny – vznikajú ${g('veg')}. V nížinách a pahorkatinách rastú duby (<b>dubový stupeň</b>), vyššie buky (<b>bukový</b>), potom smreky (<b>smrekový</b>). Okolo 1 500 m končí les – je tu <b>horná hranica lesa</b>. Nad ňou rastie <b>kosodrevina</b> a najvyššie sú <b>hole a skaly</b>, kde žijú kamzíky a svište.`},
  {h:'Podnebné oblasti',lv:2,p:`Slovensko delíme na tri podnebné oblasti: <b>teplú</b> (nížiny na juhu a východe), <b>mierne teplú</b> (kotliny a pahorkatiny) a <b>chladnú</b> (hory). Podnebie ovplyvňuje, čo ľudia pestujú: na nížinách kukuricu, slnečnicu a vinič, v horských oblastiach skôr zemiaky a pasienky.`}],

ochrana:{icon:'🌲',badge:'Strážca prírody',
 text:[
  {h:'Prečo chránime prírodu',p:`Na Slovensku žijú vzácne rastliny a zvieratá a sú tu nádherné hory, jaskyne či pralesy. Aby sa zachovali aj pre ďalšie generácie, vyhlasujeme chránené územia. Tomu hovoríme ${g('uzemochr')}.`},
  {h:'Deväť národných parkov',p:`${g('np','Národné parky')} sú najväčšie a najcennejšie chránené územia. Na Slovensku ich je deväť: <b>TANAP</b> (najstarší, od roku 1949), <b>Pieniny, Nízke Tatry, Malá Fatra, Veľká Fatra, Slovenský raj, Muránska planina, Slovenský kras</b> a <b>Poloniny</b> na severovýchode.`},
  {h:'Ďalšie chránené územia',p:`Okrem národných parkov máme ${g('chko','chránené krajinné oblasti')} – napríklad Vihorlat, Záhorie či Malé Karpaty. Menšie vzácne útvary sú ${g('pamiatka','prírodné pamiatky')}: jaskyne, vodopády, skalné útvary či pramene.`},
  {h:'Ako sa správame v prírode',p:`Chodíme po <b>značených chodníkoch</b>. <b>Netrháme</b> chránené rastliny a <b>nerušíme</b> zvieratá. Odpadky si <b>berieme domov</b>. Oheň zakladáme len na vyznačených ohniskách. Psa máme na vôdzke. V národnom parku platia aj ďalšie pravidlá – sú napísané na tabuliach pri vstupe.`},
  {h:'Svetové poklady prírody',lv:2,p:`Dve prírodné lokality Slovenska sú zapísané v Zozname svetového dedičstva UNESCO: <b>Jaskyne Slovenského krasu</b> (napr. Domica, Ochtinská aragonitová jaskyňa, Dobšinská ľadová jaskyňa) a <b>Karpatské bukové pralesy</b> (napr. Stužica v Poloninách či pralesy Vihorlatu). Pralesy sú lesy, do ktorých človek nikdy nezasahoval.`}],

function krajMap(o={}){return physMap({kraje:true,relief:false,rivers:['dunaj','vah','hron','hornad'],cities:o.cities||[],scale:o.scale??true,line:o.line,extra:o.extra||'',...o})}
function tapKraje(tasks){return (el,next,pi,pn)=>{let q=0;
  function draw(){const [tt,key]=tasks[q];el.dataset.kr=key;
    el.innerHTML=taskHTML(tt)+`<div id="tk" class="wscroll">${krajMap({cities:Object.keys(KRCITY)})}</div><p class="mini-count swipe">↔ Mapu môžeš posúvať prstom.</p><div class="feedback" id="fb" aria-live="polite"></div>${dotsHTML(pn,pi)}<p class="mini-count">${q+1} / ${tasks.length}</p>`;
    if(q>0||pi>0)say(tt);
    $$('#tk .kraj',el).forEach(p=>{p.style.cursor='pointer';p.onclick=()=>{const k=p.dataset.k;const fb=$('#fb',el);
      if(k===key){p.setAttribute('fill','#F2C200');tone(true);fb.className='feedback good';fb.textContent=`${praise()} ${KRN[k]} kraj, krajské mesto ${KRCITY[k]}. ✔`;say(`${KRN[k]} kraj.`);$('#tk svg',el).style.pointerEvents='none';setTimeout(()=>{q++;q<tasks.length?draw():next()},1600)}
      else{tone(false);fb.className='feedback bad';fb.textContent=`Toto je ${KRN[k]} kraj. Skús iný.`}}})}
  draw()}}

function journeyPart(stops,col='#D62828'){return (el,next,pi,pn)=>{let i=0;
  function mapWith(){const pts=stops.map(s=>PJ(s[1],s[2]));let extra=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="3.5" stroke-dasharray="9 6" stroke-linecap="round" opacity=".85"/>`;
    extra+=pts.map((p,k)=>`<g><circle cx="${p[0]}" cy="${p[1]}" r="${k===i?13:9}" fill="${k<i?'#2A9D4B':k===i?'#F2C200':'#fff'}" stroke="#1B2A41" stroke-width="2"/><text x="${p[0]}" y="${p[1]+1}" text-anchor="middle" dominant-baseline="central" font-size="${k===i?12:10}" font-weight="800">${k+1}</text></g>`).join('');
    return physMap({cities:[],rivers:['dunaj','vah','hron','hornad','poprad','dunajec','nitra'],extra,scale:false})}
  function draw(){const [name,lo,la,emo,txt,q]=stops[i];const opts=shuffle(q.o);el.dataset.jok=opts.findIndex(o=>o.ok);
    el.innerHTML=`<div class="wscroll">${mapWith()}</div>
     <article class="stopcard"><div class="sc-h"><span class="sc-e">${emo}</span><div><small>Zastávka ${i+1} z ${stops.length}</small><h2>${name}</h2></div><button class="say" data-say="${esc(name+'. '+txt)}" aria-label="Prečítaj">🔊</button></div><p>${txt}</p>
     <p class="sc-q"><b>${q.t}</b></p><div class="opts" style="grid-template-columns:1fr">${opts.map(optHTML).join('')}</div><div class="feedback" id="fb" aria-live="polite"></div></article>${dotsHTML(pn,pi)}`;
    if(i>0)say(name);
    {const w=$('.wscroll',el),sv=w&&w.querySelector('svg');if(sv&&w.scrollWidth>w.clientWidth){w.scrollLeft=PJ(lo,la)[0]/CV.W*sv.clientWidth-w.clientWidth/2}}
    $$('.stopcard .opt',el).forEach((b,k)=>b.onclick=()=>{const fb=$('#fb',el);if(opts[k].ok){b.classList.add('right');tone(true);fb.className='feedback good';fb.textContent=praise()+' ✔';$$('.stopcard .opt',el).forEach(x=>x.disabled=true);setTimeout(()=>{i++;if(i<stops.length){draw();const m=$('.stopcard',el);m&&m.scrollIntoView({block:'nearest'})}else next()},1100)}
      else{b.classList.add('wrong');b.disabled=true;tone(false);fb.className='feedback bad';fb.textContent='Prečítaj si text o zastávke ešte raz.'}})}
  draw()}}

  <p><b>2.</b> ${lv===1?'Ktorá zastávka sa ti páčila najviac? Nakresli ju:':'Naplánuj jednodňový výlet na 3 zastávky. Napíš poradie, čím pocestuješ a čo tam uvidíš:'}</p>${lv===1?'<div style="border:2px dashed #111;height:150px;border-radius:8px"></div>':linesN(4)}${extraQ||''}`}

kraje:{icon:'🗺️',badge:'Znalec krajov',
 text:[
  {h:'Osem krajov',p:`Slovensko sa delí na 8 ${g('kraj','samosprávnych krajov')}: Bratislavský, Trnavský, Trenčiansky, Nitriansky, Žilinský, Banskobystrický, Prešovský a Košický. Každý kraj má svoje <b>krajské mesto</b>, ktoré sa volá rovnako ako kraj. Najväčší je Banskobystrický kraj, najmenší Bratislavský.`},
  {h:'Okresy a obce',p:`Kraje sa ďalej delia na ${g('okres','okresy')} – na Slovensku ich je 79. Najmenšou časťou sú obce. Slovensko má takmer 2 900 obcí, z toho asi 140 sú mestá.`},
  {h:'Tradičné regióny',p:`Ľudia však často hovoria aj o ${g('region','tradičných regiónoch')}: Orava, Liptov, Kysuce, Turiec, Spiš, Šariš, Zemplín, Gemer, Záhorie či Podunajsko. Každý región má svoje nárečie, kroje, jedlá a zvyky. Ich názvy vychádzajú z dávnych žúp.`},
  {h:'Prečo sú regióny rôzne',p:`Regióny sa líšia prírodou aj tým, čím sa ľudia živili. Na Orave a Kysuciach chovali ovce a spracúvali drevo, na Podunajsku pestovali obilie a zeleninu, v Banskej Štiavnici a na Spiši ťažili rudy, na Zemplíne pestujú vinič.`},
  {h:'Kraj ako samospráva',lv:2,p:`Kraj vedie <b>predseda</b> a <b>zastupiteľstvo</b>, ktorých si volíme vo voľbách. Kraj sa stará napríklad o stredné školy, cesty II. a III. triedy, regionálnu dopravu, sociálne služby, divadlá a múzeá. O obec sa stará starosta alebo primátor so zastupiteľstvom.`}],
 fact:'Banskobystrický kraj je rozlohou najväčší – je viac ako štyrikrát väčší ako Bratislavský. Bratislavský kraj má však najviac obyvateľov na jeden štvorcový kilometer.',
 trip:'Zisti, v ktorom kraji, okrese a regióne leží tvoja obec. Čím je tvoj región známy – jedlom, krojom, nárečím, pamiatkou?',
 check:{1:['Viem, koľko krajov má Slovensko, a vymenujem ich.','Ukážem na mape kraj, v ktorom bývam.','Priradím krajské mestá ku krajom.','Viem vymenovať aspoň 5 tradičných regiónov.'],2:['Viem, kto vedie kraj a o čo sa stará.','Viem vysvetliť rozdiel medzi krajom a tradičným regiónom.']},
 play:{name:'Regionálna ochutnávka',need:'mapa Slovenska na stenu, papiere, fotografie alebo predmety z regiónov (kroj, recept, nárečové slovo)',
  steps:['Rozdeľte triedu na skupiny, každá si vylosuje jeden tradičný región.','Skupina zistí: kde región leží, ktoré mesto je jeho centrom, aké jedlo, kroj či slovo je preň typické.','Pripravte malý stánok s obrázkom, mapkou a „ochutnávkou“ (recept, pieseň, nárečové slovíčko).','Ostatní chodia od stánku k stánku a zapisujú si do cestovateľského denníka.'],
  l2:'Vytvorte „regionálny slovník“: každá skupina nájde 5 nárečových slov zo svojho regiónu a ich význam v spisovnej slovenčine.',
  out:'Opýtajte sa starých rodičov alebo susedov, aké slová, jedlá či zvyky sú typické pre vašu obec. Porovnajte ich s iným regiónom.'},
 teacher:{ciele:['vymenovať kraje Slovenska a ich krajské mestá a ukázať ich na mape','rozlíšiť správne členenie (kraj, okres, obec) a tradičné regióny','uviesť príklady regionálnych zvláštností'],
  svp:'2. cyklus, téma Obyvateľstvo Slovenska a jeho činnosť v krajine: kraje a tradičné regióny Slovenska, regionálne zvláštnosti; prepojenie s občianskym komponentom (samospráva).',
  tipy:['Hranice krajov na mape sú z Natural Earth (zjednodušené).','Polohy tradičných regiónov sú orientačné – regióny nemajú úradné hranice.','Počty: 8 krajov, 79 okresov, takmer 2 900 obcí (z toho asi 140 miest).','Prepojenie: slovenský jazyk (nárečia), výtvarná výchova (kroje, ornamenty), dejepisný komponent (župy).']},
 quiz:{1:[
  {q:'Koľko samosprávnych krajov má Slovensko?',o:[{t:'8',ok:1},{t:'5'},{t:'12'}]},
  {q:'Ktoré mesto je krajským mestom Žilinského kraja?',o:[{t:'Žilina',ok:1},{t:'Martin'},{t:'Poprad'}]},
  {q:'V ktorom regióne stojí Spišský hrad?',o:[{t:'Spiš',ok:1},{t:'Orava'},{t:'Záhorie'}]},
  {q:'Ktorý kraj je rozlohou najväčší?',o:[{t:'Banskobystrický',ok:1},{t:'Bratislavský'},{t:'Trnavský'}]}],
  2:[
  {q:'Koľko okresov má Slovensko?',o:[{t:'79',ok:1},{t:'8'},{t:'2 900'}]},
  {q:'Kto vedie samosprávny kraj?',o:[{t:'predseda a zastupiteľstvo',ok:1},{t:'starosta'},{t:'prezident'}]},
  {q:'Odkiaľ pochádzajú názvy tradičných regiónov?',o:[{t:'z dávnych žúp',ok:1},{t:'z názvov riek v Poľsku'},{t:'vymysleli ich turisti'}]},
  {q:'Ktorý región leží na východe Slovenska pri Michalovciach?',o:[{t:'Zemplín',ok:1},{t:'Turiec'},{t:'Kysuce'}]}]},
 act:(el,lv)=>runParts(el,[
   tapKraje(lv===1?[['Ťukni na Bratislavský kraj.','ba'],['Ťukni na Žilinský kraj.','za'],['Ťukni na Košický kraj.','ke'],['Ťukni na Banskobystrický kraj – je najväčší.','bb']]:[['Ťukni na Trenčiansky kraj.','tn'],['Ťukni na Nitriansky kraj.','nr'],['Ťukni na Prešovský kraj.','po'],['Ťukni na Trnavský kraj.','tt']]),
   labelSlots({t:'Priraď krajské mestá ku krajom. Vyber mesto a ťukni do správneho kraja.',wide:true,keys:Object.keys(KRCITY),label:KRCITY,svg:f=>krajMap({cities:[],scale:false,slots:{filled:f,label:KRCITY,pos:Object.fromEntries(Object.entries(KRC).map(([k,v])=>[k,PJ(...v)]))}}),hint:'Krajské mesto sa volá rovnako ako kraj.'}),
   tapZones({svg:()=>physMap({cities:[],rivers:['dunaj','vah','hron','hornad'],relief:true,extra:REG.map(([k,n,lo,la])=>{const [x,y]=PJ(lo,la);return `<circle cx="${x}" cy="${y}" r="7" fill="#fff" stroke="#1B2A41" stroke-width="2"/>`}).join('')}),zones:Object.fromEntries(REG.map(([k,n,lo,la])=>[k,[...PJ(lo,la),24,n]])),
     tasks:(lv===1?['orava','spis','zemplin','zahorie','liptov']:['kysuce','turiec','saris','gemer','podunajsko']).map(k=>{const r=REG.find(x=>x[0]===k);return [`Ťukni na región ${r[1]} – ${r[4]}.`,k]})})],'Kraje aj regióny poznáš!'),
 sheet:lv=>sheetHead('Kraje a regióny',lv)+`<p><b>1.</b> Každý kraj vyfarbi inou farbou a dopíš krajské mestá.</p>${krajMap({line:true,cities:[]})}
  <p><b>2.</b> Moja obec leží v ______________ kraji, v okrese ______________, v regióne ______________.</p>${lv===2?'<p><b>3.</b> Typické pre môj región je (jedlo, kroj, slovo, zvyk): ______________________________</p>':''}`},

zapad:{icon:'🏰',badge:'Pútnik po Váhu',
 text:[
  {h:'Cesta pozdĺž Váhu',p:`Naša prvá cesta vedie z Liptova pod Tatrami popri rieke <b>Váh</b> až k Dunaju. Prejdeme cez Liptov, Oravu, Turiec, Považie a Podunajsko. Na mape vidíš 10 zastávok – v kroku Objavujem ich navštívime jednu po druhej.`},
  {h:'Hory, hrady a jaskyne',p:`Na severe sú hory: Nízke Tatry, Malá a Veľká Fatra. Nad údoliami strážia hrady – Oravský, Strečno, Trenčiansky. V Demänovskej doline sú krásne jaskyne a pod Ružomberkom drevená dedinka Vlkolínec, ktorá je v zozname ${g('unesco')}.`},
  {h:'Mestá na Váhu',p:`Váh preteká Žilinou, Trenčínom, Piešťanmi a Sereďou až do Komárna. Pri Váhu vznikli mestá, lebo voda dávala ľuďom silu pre mlyny a pílu a po rieke sa plavilo drevo na pltiach. Dnes sú na Váhu vodné elektrárne.`},
  {h:'Na juhu: nížiny a hlavné mesto',p:`Na juhu sa krajina otvára do úrodnej Podunajskej nížiny. Trnava je „malý Rím“ s mnohými kostolmi. Na konci cesty je <b>Bratislava</b> – hlavné mesto pri Dunaji s hradom, Dómom sv. Martina a hradom Devín.`},
  {h:'Povesť o studni lásky',lv:0,p:`Na Trenčianskom hrade je hlboká studňa. ${g('povest','Povesť')} hovorí, že mladý Turek Omar chcel vyslobodiť svoju milú Fatimu, ktorú držal pán hradu v zajatí. Pán mu povedal: „Dostaneš ju, keď vykopeš v skale studňu a nájdeš vodu.“ Omar s priateľmi kopal tri roky, kým sa v hlbinách neobjavila voda. Odvtedy sa studni hovorí studňa lásky.`},
  {h:'Pre zvedavých: ako sa menil Váh',lv:2,p:`Na Váhu je dnes sústava vodných diel – Vážska kaskáda. Liptovská Mara zadržiava vodu, vodné elektrárne vyrábajú elektrinu a hrádze chránia mestá pred povodňami. Zmizli však pltníci, ktorí kedysi splavovali drevo až k Dunaju.`}],
 fact:'Hrad Devín stojí na skale nad sútokom Moravy a Dunaja. Stál tu už v čase Veľkej Moravy a dnes je národnou kultúrnou pamiatkou.',
 trip:'Vyber si jednu zastávku tejto cesty a zisti, ako dlho by si sa tam dostal/a z tvojej obce vlakom alebo autobusom.',
 check:{1:['Viem opísať cestu pozdĺž Váhu od Liptova po Bratislavu.','Pozná(m) aspoň 3 hrady a 3 mestá na tejto ceste.','Viem, čím sú známe Piešťany a Trnava.','Viem prerozprávať povesť o studni lásky.'],2:['Viem vysvetliť, prečo vznikali mestá pri riekach.','Viem, na čo slúži Vážska kaskáda.']},
 play:{name:'Sprievodca na jeden deň',need:'mapa trasy (pracovný list), pohľadnice alebo vytlačené fotografie miest, papier',
  steps:['Každý žiak si vyberie jednu zastávku cesty.','Pripraví krátku „sprievodcovskú reč“ (1 minúta): kde sme, čo tu uvidíme, jedna zaujímavosť.','Trieda „cestuje“ – žiaci sa postavia v poradí zastávok a postupne rozprávajú.','Na konci hlasujte, kam by ste išli na triedny výlet.'],
  l2:'Naplánujte skutočný výlet na jednu zastávku: cesta tam a späť, čas, cena lístka, čo si zbalíme. Využite cestovný poriadok na internete.',
  out:'Nájdite vo svojom okolí hrad, kúpele, skanzen alebo múzeum, ktoré sa podobá niektorej zastávke. V čom sa líšia?'},
 teacher:{ciele:['orientovať sa na mape západného a severozápadného Slovenska','spojiť miesta s ich typickou pamiatkou alebo prírodným útvarom','prerozprávať regionálnu povesť'],
  svp:'2. cyklus: určovanie polohy najvýznamnejších povrchových celkov, riek a sídiel na mape Slovenska spojené s ich charakteristikou; regionálne zvláštnosti a kultúrne dedičstvo; prepojenie s dejepisným komponentom (povesti, pamiatky).',
  tipy:['Trasa je inšpirovaná členením vlastivedy na tri cesty po Slovensku, texty sú pôvodné.','Povesť o studni lásky je ľudová povesť, nie historická udalosť – je dobrá príležitosť na rozhovor o tom, čím sa povesť líši od histórie.','Rímsky nápis na trenčianskej skale pochádza z roku 179 a pripomína víťazstvo rímskych vojsk (Laugaricio).']},
 quiz:{1:[
  {q:'Pozdĺž ktorej rieky vedie táto cesta?',o:[{t:'Váh',ok:1},{t:'Hornád'},{t:'Ipeľ'}]},
  {q:'Ktoré mesto sa volá „malý Rím“?',o:[{t:'Trnava',ok:1},{t:'Žilina'},{t:'Martin'}]},
  {q:'Kde je studňa lásky?',o:[{t:'na Trenčianskom hrade',ok:1},{t:'v Bratislave'},{t:'v Piešťanoch'}]},
  {q:'Ktorá obec je v zozname UNESCO?',o:[{t:'Vlkolínec',ok:1},{t:'Terchová'},{t:'Piešťany'}]}],
  2:[
  {q:'Čo je Vážska kaskáda?',o:[{t:'sústava vodných diel na Váhu',ok:1},{t:'vodopád v Tatrách'},{t:'skupina hradov'}]},
  {q:'Z ktorého roku je rímsky nápis v Trenčíne?',o:[{t:'179',ok:1},{t:'1944'},{t:'1993'}]},
  {q:'Kde sa vlieva Morava do Dunaja?',o:[{t:'pod Devínom',ok:1},{t:'v Komárne'},{t:'v Žiline'}]},
  {q:'Čo sa kedysi plavilo po Váhu na pltiach?',o:[{t:'drevo',ok:1},{t:'autá'},{t:'uhlie z Ameriky'}]}]},
 act:(el,lv)=>runParts(el,[journeyPart(ZAPAD,'#D62828')],'Cesta pozdĺž Váhu je za tebou!'),
 sheet:lv=>routeSheet(ZAPAD,'Od Tatier k Dunaju',lv)},

stred:{icon:'⛏️',badge:'Banský majster',
 text:[
  {h:'Cesta stredom Slovenska',p:`Druhá cesta vedie z Nitry cez <b>Pohronie</b> a <b>Horehronie</b> až k rieke <b>Hornád</b>. Je to krajina sopečných pohorí, starých banských miest, hradov a jaskýň.`},
  {h:'Zlato, striebro a meď',p:`V Štiavnických a Kremnických vrchoch sa stáročia ťažili drahé kovy. <b>Banská Štiavnica</b> bola jedným z najbohatších banských miest Európy, v <b>Kremnici</b> razia mince dodnes a <b>Banská Bystrica</b> zbohatla na medi. Okolo Štiavnice vybudovali baníci umelé jazerá – <b>tajchy</b>.`},
  {h:'Hrady, zámky a lesy',p:`Cestou uvidíš rozprávkový zámok v <b>Bojniciach</b>, Zvolenský zámok aj Nitriansky hrad. Na Horehroní sú rozsiahle lesy – po lesnej železnici v Čiernom Balogu kedysi vozili drevo.`},
  {h:'Jaskyne a Slovenský raj',p:`Na konci cesty je kras – krajina z vápenca, v ktorej voda vyhĺbila jaskyne a tiesňavy. <b>Dobšinská ľadová jaskyňa</b> má ľad po celý rok a v <b>Slovenskom raji</b> sa chodí po rebríkoch popri vodopádoch.`},
  {h:'Povesť o jaštericiach',lv:0,p:`Podľa ${g('povest','povesti')} pásol kedysi pastier ovce v kopcoch, kde dnes stojí Banská Štiavnica. Raz zbadal dve jašterice, na ktorých chrbtoch sa leskol zlatý a strieborný prach. Sledoval ich, kam sa skryli – a našiel bohatú žilu rudy. Tak vraj vzniklo mesto, ktoré má jaštericu aj vo svojom znaku.`},
  {h:'Pre zvedavých: prvá banská akadémia',lv:2,p:`V Banskej Štiavnici vznikla v 18. storočí jedna z prvých vysokých škôl pre banských odborníkov na svete. Študenti sem prichádzali z celej Európy – tradíciu dodnes pripomínajú študentské zvyky ako Šachtág.`}],
 fact:'Tajchy okolo Banskej Štiavnice boli dôležitou súčasťou baníctva – zachytávali vodu, ktorá poháňala banské stroje. Dnes sa v nich ľudia kúpu.',
 trip:'Vyber si jednu banskú pamiatku (Banská Štiavnica, Kremnica, Banská Bystrica) a zisti, aký kov sa tam ťažil a čo z neho vyrábali.',
 check:{1:['Viem opísať cestu z Nitry k Hornádu.','Viem, ktoré mestá boli známe baníctvom a aký kov sa v nich ťažil.','Viem, čo sú tajchy.','Viem prerozprávať povesť o jaštericiach.'],2:['Viem, čo je kras a ako vznikajú jaskyne.','Viem, prečo bola Banská Štiavnica významná pre vzdelávanie.']},
 play:{name:'Baníci a geológovia',need:'piesok v krabici, „poklady“ (gombíky, kamienky natreté zlatou a striebornou farbou), lyžičky, sitká',
  steps:['Do krabice s pieskom ukryte „rudu“ – zlaté a strieborné kamienky.','Skupiny sú banícke družstvá. Majú obmedzený čas a vodu (pohár) na preplachovanie piesku sitkom.','Za každý nájdený kúsok si zapíšu bod. Porovnajte, ktorá metóda bola najlepšia.','Porozprávajte sa: prečo baníci potrebovali vodu a prečo stavali tajchy?'],
  l2:'Zistite, ktoré kovy a nerasty sa na Slovensku ťažia dnes a na čo sa používajú (napríklad magnezit, vápenec, hnedé uhlie).',
  out:'Ak máte v obci kameňolom alebo pieskovňu, zistite, čo sa v nej ťaží a kam sa to vozí.'},
 teacher:{ciele:['orientovať sa na mape stredného Slovenska','vysvetliť význam baníctva pre vznik miest','spoznať kras, jaskyne a chránené územia stredného Slovenska'],
  svp:'2. cyklus: poloha najvýznamnejších sídiel, riek a povrchových celkov; vplyv prírodných podmienok na činnosť človeka; kultúrne dedičstvo; prepojenie s dejepisným komponentom.',
  tipy:['Povesť o jaštericiach je známa štiavnická povesť; jašterica je aj súčasťou erbu mesta.','Kremnická mincovňa razí mince nepretržite od 14. storočia.','Prepojenie: prírodoveda (horniny, nerasty), dejepis (baníctvo, SNP).']},
 quiz:{1:[
  {q:'Čo sa razí v Kremnici?',o:[{t:'mince',ok:1},{t:'tehly'},{t:'sklo'}]},
  {q:'Ako sa volajú umelé jazerá okolo Banskej Štiavnice?',o:[{t:'tajchy',ok:1},{t:'plesá'},{t:'šíravy'}]},
  {q:'Kde je najstaršia ZOO na Slovensku?',o:[{t:'v Bojniciach',ok:1},{t:'v Nitre'},{t:'v Kremnici'}]},
  {q:'V ktorej jaskyni je ľad po celý rok?',o:[{t:'v Dobšinskej ľadovej jaskyni',ok:1},{t:'v Domici'},{t:'v Demänovskej jaskyni slobody'}]}],
  2:[
  {q:'Na akom kove zbohatla Banská Bystrica?',o:[{t:'na medi',ok:1},{t:'na hliníku'},{t:'na železe z Ruska'}]},
  {q:'Čo je kras?',o:[{t:'krajina z vápenca s jaskyňami a tiesňavami',ok:1},{t:'sopečné pohorie'},{t:'nížina s riekami'}]},
  {q:'Ktoré knieža dalo okolo roku 828 vysvätiť kostol v Nitre?',o:[{t:'Pribina',ok:1},{t:'Svätopluk II.'},{t:'Ľudovít I.'}]},
  {q:'Kde vznikla jedna z prvých banských vysokých škôl na svete?',o:[{t:'v Banskej Štiavnici',ok:1},{t:'v Bratislave'},{t:'v Prahe'}]}]},
 act:(el,lv)=>runParts(el,[journeyPart(STRED,'#1D5FC4')],'Cesta stredom Slovenska je za tebou!'),
 sheet:lv=>routeSheet(STRED,'Od Dunaja po Hornád',lv)},

vychod:{icon:'🌄',badge:'Objaviteľ východu',
 text:[
  {h:'Cesta východom Slovenska',p:`Tretia cesta začína v <b>Košiciach</b>, vedie cez Zemplín k ukrajinskej hranici, potom na sever cez Šariš a Spiš až k rieke <b>Dunajec</b> v Pieninách.`},
  {h:'Zemplín a Vihorlat',p:`Na Východoslovenskej nížine leží <b>Zemplínska šírava</b> – „slovenské more“. Nad ňou sa dvíhajú sopečné <b>Vihorlatské vrchy</b> s jazerom Morské oko a bukovými pralesmi. Na juhu Zemplína dozrieva hrozno na tokajské víno.`},
  {h:'Poloniny a drevené kostolíky',p:`Na severovýchode sú <b>Poloniny</b> s pralesom Stužica a najvýchodnejšou obcou Novou Sedlicou. V okolí Svidníka a Bardejova stoja drevené chrámy a žijú tu aj Rusíni, Ukrajinci a ďalšie národnosti so svojimi zvykmi.`},
  {h:'Šariš a Spiš',p:`<b>Bardejov</b> má stredoveké námestie zapísané v UNESCO. <b>Prešov</b> je krajské mesto Šariša. Na Spiši stojí obrovský <b>Spišský hrad</b>, v <b>Levoči</b> je najvyšší neskorogotický drevený oltár na svete a v <b>Kežmarku</b> drevený kostol bez železných klincov. Cesta končí splavom Dunajca v Pieninách.`},
  {h:'Povesť o Bielej panej',lv:0,p:`V Levoči sa rozpráva ${g('povest','povesť')} o krásnej Juliane Korponayovej. Hovorí sa, že v čase vojen tajne prezradila nepriateľom, ako sa dostať do opevneného mesta – v noci im otvorila mestskú bránu. Za zradu ju čakal trest a jej duch vraj dodnes blúdi po meste ako Biela pani.`},
  {h:'Pre zvedavých: mnoho kultúr',lv:2,p:`Východ Slovenska je pestrý: popri Slovákoch tu žijú Rusíni, Ukrajinci, Maďari, Rómovia a ďalší. Vidno to na kostoloch rôznych cirkví, na nápisoch v dvoch jazykoch, na jedlách aj piesňach. Rozmanitosť je bohatstvo regiónu.`}],
 fact:'Vrch Kremenec v Bukovských vrchoch je jediné miesto, kde sa stretávajú hranice Slovenska, Poľska a Ukrajiny.',

function hbar(data,{unit='',max=null,col='#1D5FC4'}={}){const m=max||Math.max(...data.map(d=>d[1]));const h=data.length*34+10;

  <text x="10" y="22" font-size="15" font-weight="800" fill="#1B2A41">${now?'Dnes':'Pred 150 rokmi'}</text></svg>`}

  {h:'Národnosti',p:`Väčšina obyvateľov sa hlási k slovenskej ${g('narodnost','národnosti')} – v roku 2021 to bolo 83,8 %. Žijú tu aj ${g('mensina','národnostné menšiny')}: najväčšia je maďarská (asi 7,8 %, najmä na juhu), ďalej rómska, česká, rusínska (najmä na severovýchode), ukrajinská a ďalšie. Úradným jazykom je slovenčina, menšiny však môžu v niektorých obciach a školách používať aj svoj jazyk.`},
  {h:'Ľudia sú v pohybe',p:`Mnohí každý deň ${g('dochadzanie','dochádzajú')} do práce či do školy v inej obci. Niektorí sa ${g('migracia','sťahujú')} natrvalo – z dedín do miest, z miest do obcí v okolí, za prácou do iných krajov alebo do zahraničia. Na Slovensko zase prichádzajú ľudia z iných krajín.`},
  {h:'Pre zvedavých: starneme',lv:2,p:`Rodí sa menej detí a ľudia žijú dlhšie. Preto pribúda starších ľudí a ubúda detí – hovoríme, že obyvateľstvo <b>starne</b>. Bude treba viac opatrovateľov a lekárov a menej ľudí bude pracovať. Najviac obyvateľov má Prešovský kraj, ktorý má aj najviac detí.`}],

sidla:{icon:'🏙️',badge:'Urbanista',
 text:[
  {h:'Dediny a mestá',p:`Miesta, kde ľudia trvalo žijú, sú ${g('sidlo','sídla')}. Slovensko má takmer 2 900 obcí, z toho asi 140 miest. Najväčšie mesto je <b>Bratislava</b> (asi 475 000 obyvateľov), druhé <b>Košice</b> (asi 230 000). Ďalšie veľké mestá – Prešov, Žilina, Nitra a Banská Bystrica – majú okolo 80 000 obyvateľov.`},
  {h:'Prečo mestá vznikli práve tam',p:`Mestá vznikali tam, kde sa ľuďom dobre žilo a obchodovalo: pri <b>riekach</b> a brodoch (Komárno, Žilina), na križovatkách <b>obchodných ciest</b> (Košice, Trnava), pri <b>baniach</b> (Banská Štiavnica, Kremnica), pri <b>hradoch</b> (Trenčín, Nitra) alebo pri liečivých <b>prameňoch</b> (Piešťany).`},
  {h:'Ako vyzerá mesto',p:`V centre býva <b>námestie</b> s radnicou, kostolom a obchodmi. Okolo sú ${g('sidlisko','sídliská')} s bytovými domami a štvrte rodinných domov. Na okraji sú <b>priemyselné zóny</b> s továrňami a skladmi. Na oddych slúžia parky, ihriská a lesy pri meste.`},
  {h:'Vidiek',p:`Na dedinách žijú ľudia v rodinných domoch so záhradami, blízko prírody. Kedysi sa takmer všetci živili poľnohospodárstvom, dnes mnohí dochádzajú za prácou do miest. Najmenšou obcou Slovenska je Príkra pri Svidníku – žije v nej len niekoľko ľudí.`},
  {h:'Pre zvedavých: rastúce okolie miest',lv:2,p:`Veľa rodín sa sťahuje z miest do obcí v ich okolí – chcú bývať v dome so záhradou. Tomu hovoríme ${g('suburb')}. Obce okolo Bratislavy a Košíc rýchlo rastú, pribúdajú v nich domy aj autá na cestách. Naopak, niektoré odľahlé dediny sa vyľudňujú.`}],

hosp:{icon:'🏭',badge:'Podnikateľ',
 text:[
  {h:'Ako sa ľudia živia',p:`Ľudia pracujú v troch veľkých oblastiach: v ${g('polnohosp','poľnohospodárstve')}, v ${g('priemysel','priemysle')} a v ${g('sluzby','službách')}. Dnes najviac ľudí na Slovensku pracuje v službách – v obchodoch, školách, nemocniciach, na úradoch, v doprave či v cestovnom ruchu.`},
  {h:'Polia, sady a pastviny',p:`Na teplých a úrodných nížinách sa pestuje pšenica, kukurica, jačmeň, cukrová repa, slnečnica a zelenina. Na svahoch Malých Karpát a na Zemplíne rastie vinič. V horách sa pasú ovce a kravy – z ovčieho mlieka sa vyrába <b>bryndza</b>. Lesy pokrývajú asi 41 % Slovenska a dávajú drevo.`},
  {h:'Továrne',p:`Slovensko vyrába najviac áut na obyvateľa na svete. Autá sa vyrábajú v Bratislave, Trnave, Žiline a Nitre. V Košiciach je veľká <b>oceliareň</b>, v Bratislave <b>rafinéria</b>, ktorá spracúva ropu. Továrne vyrábajú aj elektroniku, papier, potraviny či lieky.`},
  {h:'Odkiaľ máme elektrinu',p:`Viac ako polovicu elektriny vyrábajú ${g('energia','jadrové elektrárne')} v Mochovciach a Jaslovských Bohuniciach. Ďalšiu elektrinu dávajú vodné elektrárne (najväčšia je Gabčíkovo na Dunaji), slnečné panely a ďalšie zdroje.`},
  {h:'Pre zvedavých: výhody a riziká',lv:2,p:`Továrne dávajú ľuďom prácu, ale ak sa veľa krajiny spolieha na jednu oblasť (napríklad autá), je zraniteľná, keď sa jej prestane dariť. Preto je dobré, keď kraj ponúka rôzne druhy práce. Výroba môže aj znečisťovať ovzdušie a vodu – preto platia prísne pravidlá ochrany prírody.`}],

  l2:'Vyberte si jeden výrobok z domácnosti (jogurt, papier, auto) a vystopujte jeho cestu: odkiaľ je surovina, kde sa vyrába, ako sa dostal do obchodu.',

doprava:{icon:'🚆',badge:'Sprievodca',

  {h:'Pre zvedavých: zodpovedný turista',lv:2,p:`Príliš veľa turistov naraz môže prírode škodiť – zošliapané chodníky, odpad, hluk, autá v dolinách. Zodpovedný turista cestuje vlakom či autobusom, chodí po značených chodníkoch, nakupuje u miestnych ľudí a nechá miesto také, aké ho našiel.`}],

zmena:{icon:'🌍',badge:'Ochranca Zeme',
 text:[
  {h:'Krajina, ktorú tvorí človek',p:`Krajina okolo nás nie je taká, aká bola kedysi. Ľudia vyrúbali časť lesov a premenili ich na polia a lúky, postavili dediny, mestá, cesty a železnice, narovnali rieky a postavili priehrady. Takú krajinu voláme ${g('krajina')}.`},
  {h:'Čo krajine pomáha a čo škodí',p:`Polia nám dávajú potraviny, priehrady elektrinu a ochranu pred povodňami, cesty nás spájajú. Ale veľké polia bez remízok a stromov ničí vietor a dážď, ťažba mení tvar kopcov, továrne a autá znečisťujú ovzdušie a odpad môže otráviť vodu a pôdu.`},
  {h:'Meniaca sa klíma',p:`Aj na Slovensku cítime ${g('klima')}: je viac horúcich dní a súch, prudké búrky a prívalové dažde. V oslabených smrekových lesoch sa premnožil podkôrny hmyz – lykožrút. Lesníci preto vysádzajú pestrejšie lesy s rôznymi druhmi stromov.`},
  {h:'Čo môžeme urobiť my',p:`Triedime odpad a nakupujeme menej zbytočných vecí. Šetríme vodu a elektrinu. Chodíme pešo, bicyklom alebo verejnou dopravou. Sadíme stromy, staviame búdky pre vtáky a pomáhame upratovať prírodu. Aj malý čin, keď ho robí veľa ľudí, mení svet.`},
  {h:'Pre zvedavých: dve strany jednej stavby',lv:2,p:`Vodné dielo <b>Gabčíkovo</b> na Dunaji vyrába elektrinu, zlepšilo plavbu lodí a chráni okolie pred povodňami. Zároveň však zmenilo prúdenie Dunaja a život v jeho ramenách a lužných lesoch. Pri veľkých stavbách treba vždy porovnať výhody aj nevýhody.`}],
 fact:'Remízky – malé skupinky stromov a kríkov medzi poliami – chránia pôdu pred vetrom a sú domovom pre vtáky, zajace a užitočný hmyz.',

function makePickQ(N,minOwn){return function(m,lv){const gens=(m.gen||[]).map(g=>()=>g(lv));const own=m.quiz[lv]||[];const other=lv===2?(m.quiz[1]||[]):[];
  let sel=lv===2&&minOwn?[...shuffle(own).slice(0,minOwn),...shuffle([...own.slice(minOwn),...other,...gens]).slice(0,N-minOwn)]:shuffle([...own,...gens]).slice(0,N);
  if(lv===2&&minOwn){const rest=shuffle([...own,...other,...gens].filter(x=>!sel.includes(x)));sel=[...new Set(sel)];while(sel.length<N&&rest.length)sel.push(rest.pop())}
  return shuffle(sel).map(q=>{q=typeof q==='function'?q():q;return Array.isArray(q.q)?{...q,q:dpick(q.q)}:q})}}

  function show(){const f=spec.frames[k];const dur=f.dur||Math.max(4200,f.cap.split(' ').length*360);
    bars.forEach((b,i)=>{b.className=i<k?'done':i===k?'on':'';b.style.setProperty('--dur',dur+'ms')});
    const raw=typeof f.svg==='function'?f.svg():f.svg;ov.querySelector('#ist').innerHTML=`<div class="fr fx-${f.fx||'pop'}">${withMarks(raw,f.marks)}</div>`;
    ov.querySelector('#icap').outerHTML=`<p id="icap">${f.cap}</p>`;ov.querySelector('#isay').dataset.say=f.cap.replace(/<[^>]+>/g,'');
    if(spec.voice&&typeof say==='function')say(f.cap.replace(/<[^>]+>/g,''),true);
    clearTimeout(timer);if(!paused)timer=setTimeout(()=>{k++;if(k<spec.frames.length)show();else{ov.querySelector('#iskip').textContent='Začať ▶';bars.forEach(b=>b.className='done')}},dur)}
  ov.querySelector('#iskip').onclick=close;
  ov.querySelector('#iagain').onclick=()=>{k=0;paused=false;ov.querySelector('#ipause').textContent='⏸';show()};
  ov.querySelector('#iprev').onclick=()=>{k=Math.max(0,k-1);show()};
  ov.querySelector('#ipause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶':'⏸';if(paused){clearTimeout(timer);bars[k]&&(bars[k].querySelector('span').style.animationPlayState='paused')}else{show()}};
  ov.querySelector('#isay').onclick=e=>{e.stopPropagation();say(e.currentTarget.dataset.say,true)};
  document.addEventListener('keydown',function esc(ev){if(ev.key==='Escape'){document.removeEventListener('keydown',esc);if(document.body.contains(ov))close()}});
  show()}
function packOf(id){return COURSE.findIndex(p=>p.items.some(i=>i[0]===id))}

    const host=h.closest('.pack')||h.closest('header');host.appendChild(b)});
  $$('.stop[data-id],.sign[data-id]').forEach(s=>s.addEventListener('click',e=>{const pi=packOf(s.dataset.id);if(pi<0||!INTROS[pi]||store.get('intro_'+pi,0))return;e.stopImmediatePropagation();e.preventDefault();playIntro(pi,()=>s.click())},true))}
